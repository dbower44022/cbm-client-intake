<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="cbm-org" content="{{org}}" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{org}} — Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Slab:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/tokens.css" />
  <link rel="stylesheet" href="/shared/charts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="an">
    <header class="an__topbar">
      <div class="an__title">
        <h1>Analytics</h1>
        <p class="an__sub" id="pageSubtitle"></p>
      </div>
      <div class="an__usercorner" id="userCorner" hidden>
        <button type="button" class="cbm-button cbm-button--secondary" id="manageBtn" hidden>Manage</button>
        <span class="an__who">Signed in as <strong id="whoName"></strong></span>
        <button type="button" class="cbm-button cbm-button--secondary" id="logoutBtn">Sign out</button>
      </div>
    </header>

    <!-- Sign-in happens at the portal (/); this shows access/server errors. -->
    <section class="an__msg" id="msgView" hidden>
      <p class="form-error" id="msgText" role="alert"></p>
      <p><a href="/">Return to the sign-in page</a></p>
    </section>

    <section class="an__dash" id="dashView" hidden>
      <nav class="an__tabs" id="pageTabs" role="tablist" hidden></nav>

      <div class="an__controls">
        <label class="an__rangelabel" for="rangeSelect">Time range</label>
        <select id="rangeSelect" aria-label="Time range"></select>
        <span class="an__spacer"></span>
        <button type="button" class="cbm-button cbm-button--secondary" id="refreshBtn">Refresh</button>
      </div>

      <p class="an__notice" id="notice" role="status" hidden></p>
      <p class="an__loading" id="loadingState">Loading…</p>

      <div class="an__grid" id="panelGrid"></div>
    </section>

    <!-- Manage (Phase B authoring): metrics + pages -->
    <section class="an__manage" id="manageView" hidden>
      <div class="an__manage-head">
        <button type="button" class="cbm-button cbm-button--secondary" id="backToView">← Back to dashboards</button>
        <nav class="an__mtabs" role="tablist">
          <button type="button" class="an__mtab is-active" data-mtab="metrics">Metrics</button>
          <button type="button" class="an__mtab" data-mtab="pages">Pages</button>
        </nav>
      </div>

      <div id="mPanelMetrics">
        <div class="an__mtoolbar">
          <h2>Metric library</h2>
          <button type="button" class="cbm-button" id="newMetricBtn">+ New metric</button>
        </div>
        <div id="metricList"></div>
      </div>

      <div id="mPanelPages" hidden>
        <div class="an__mtoolbar">
          <h2>Pages</h2>
          <button type="button" class="cbm-button" id="newPageBtn">+ New page</button>
        </div>
        <div id="pageList"></div>
      </div>
    </section>

    <!-- Editor modal (metric builder / page composer) -->
    <div class="an__modal" id="editorModal" hidden role="dialog" aria-modal="true" aria-labelledby="editorTitle">
      <div class="an__modal-backdrop" id="editorBackdrop"></div>
      <div class="an__modal-card" role="document">
        <div class="an__modal-head">
          <h3 id="editorTitle">Editor</h3>
          <button type="button" class="an__modal-close" id="editorClose" aria-label="Close">×</button>
        </div>
        <div class="an__modal-body" id="editorBody"></div>
        <div class="an__modal-actions" id="editorActions"></div>
      </div>
    </div>

    <footer class="cbm-footer">
      <p>&copy; <span data-cbm-year>2026</span> {{org}}. All rights reserved.<span class="cbm-footer__version" data-cbm-version></span></p>
    </footer>
  </main>

  <!-- busy.js first: it wraps fetch/XHR, so it must precede any script that
       can start a request. -->
  <script src="/shared/busy.js"></script>
  <script src="/shared/charts.js"></script>
  <script src="app.js"></script>
  <script src="/shared/footer.js"></script>
</body>
</html>
