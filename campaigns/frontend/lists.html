<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="cbm-org" content="{{org}}" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{org}} — Marketing Management</title>
  <!-- Lists is a tab of Marketing Management now (build plan § 7e.2). This
       address stays for old bookmarks and links: it opens that tab, carrying
       an opened list (?list=<id>) with it. -->
  <meta http-equiv="refresh" content="0; url=/campaigns/#lists" />
  <script>
    (function () {
      var want = new URLSearchParams(location.search).get("list");
      location.replace("/campaigns/#lists" + (want ? "?list=" + encodeURIComponent(want) : ""));
    })();
  </script>
</head>
<body>
  <p>Lists is now a tab of Marketing Management. <a href="/campaigns/#lists">Open it</a>.</p>
</body>
</html>
