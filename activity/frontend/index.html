<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="cbm-org" content="{{org}}" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{org}} — Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Slab:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/tokens.css" />
  <link rel="stylesheet" href="/shared/grid.css" />
  <link rel="stylesheet" href="/shared/history.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="cbm-container ac">
    <header class="ac__header">
      <div>
        <h1>Activity</h1>
        <p class="ac__sub">Every change one person made, or every change in a date range, across every record — in the applications and in the CRM directly.</p>
      </div>
      <div class="ac__header-user">
        <span class="ac__who">Signed in as <strong id="whoName"></strong></span>
        <button type="button" class="cbm-button cbm-button--secondary ac__sm" id="logoutBtn">Sign out</button>
      </div>
    </header>

    <section id="msgView" hidden>
      <p class="form-error" id="msgText" role="alert"></p>
      <p><a href="/">Return to the sign-in page</a></p>
    </section>

    <section id="pageView" hidden>
      <form class="ac__ask" id="askForm" autocomplete="off">
        <label class="ac__f"><span>Person</span>
          <select id="askPerson"><option value="">Anyone (choose dates)</option></select>
        </label>
        <label class="ac__f"><span>From</span><input type="date" id="askFrom" /></label>
        <label class="ac__f"><span>To</span><input type="date" id="askTo" /></label>
        <button type="submit" class="cbm-button" id="askBtn">Show changes</button>
        <p class="ac__hint">Choose a person, or both dates. The filters below then narrow what was found.</p>
      </form>
      <p class="ac__notice" id="notice" role="status" hidden></p>
      <div id="results"></div>
    </section>

    <footer class="cbm-footer">
      <p>&copy; <span data-cbm-year>2026</span> {{org}}.<span class="cbm-footer__version" data-cbm-version></span></p>
    </footer>
  </main>

  <!-- busy.js first: it wraps fetch/XHR, so it must be in place before any
       other script can start a request. -->
  <script src="/shared/busy.js"></script>
  <script src="/shared/grid.js"></script>
  <script src="/shared/history.js"></script>
  <script src="app.js"></script>
  <script src="/shared/footer.js"></script>
</body>
</html>
