<title>Running an event</title>
<meta name="claude:viewport-fit-sides" content="cover">

<!-- The organisation's name appears on this page and nowhere else in the course.
     When this becomes a served page in the application these two values are
     written as {{org}} and {{abbr}} and core/branding.py fills them in. The
     content file only ever carries the tokens. -->
<meta name="cbm-org" content="Cleveland Business Mentors">
<meta name="cbm-abbr" content="CBM">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Slab:wght@600&display=swap">
<link rel="stylesheet" href="styles.css">

<div id="app"></div>

<script src="course.js"></script>
<script>
(function () {
  "use strict";

  var app = document.getElementById("app");
  var COURSE = window.COURSE;

  if (!COURSE || !COURSE.modules) {
    app.innerHTML = "";
    var fail = document.createElement("div");
    fail.className = "fail";
    fail.innerHTML = "<h2>The course content did not load</h2><p>This page is a player over " +
      "<code>course.js</code>, which did not arrive. Nothing is wrong with your browser — " +
      "the file is missing from the publish.</p>";
    app.appendChild(fail);
    return;
  }

  /* ---------- the organisation's name, read from the page ---------- */

  function meta(name, fallback) {
    var m = document.querySelector('meta[name="' + name + '"]');
    var v = m && m.getAttribute("content");
    if (!v || v.indexOf("{{") === 0) return fallback;
    return v;
  }
  var ORG = meta("cbm-org", "the organisation");
  var ABBR = meta("cbm-abbr", "the organisation");

  function words(s) {
    if (typeof s !== "string") return s;
    return s.split("{{org}}").join(ORG).split("{{abbr}}").join(ABBR);
  }

  /* ---------- progress, per viewer, disposable ---------- */

  var KEY = "cbm-course-events-marketing-v1";
  var done = {};
  try {
    var raw = window.localStorage.getItem(KEY);
    if (raw) done = JSON.parse(raw) || {};
  } catch (e) { done = {}; }

  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) { /* fine */ }
  }

  /* ---------- the step list ---------- */

  function stepsOf(mod) {
    var out = [{ kind: "opener", mod: mod }];
    (mod.slides || []).forEach(function (s, i) {
      out.push({ kind: "slide", mod: mod, data: s, key: mod.id + ":s" + i });
    });
    (mod.videos || []).forEach(function (v, i) {
      out.push({ kind: "video", mod: mod, data: v, key: mod.id + ":v" + i });
    });
    return out;
  }

  function countable(mod) {
    return (mod.slides || []).length + (mod.videos || []).length;
  }

  function doneIn(mod) {
    return stepsOf(mod).filter(function (st) { return st.key && done[st.key]; }).length;
  }

  var mi = 0, si = 0;

  var fromHash = (location.hash || "").replace("#", "");
  COURSE.modules.forEach(function (m, i) { if (m.id === fromHash) mi = i; });

  /* ---------- small DOM helpers ---------- */

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = words(text);
    return n;
  }

  function chipFor(mod) {
    if (mod.state === "ready") return null;
    if (mod.state === "held") return { cls: "held", label: "Held" };
    return { cls: "wait", label: "Not written yet" };
  }

  function videoChip(v) {
    return v.url ? { cls: "ok", label: "Recorded" }
                 : { cls: "wait", label: "Script only" };
  }

  /* ---------- render ---------- */

  function render() {
    var mod = COURSE.modules[mi];
    var steps = stepsOf(mod);
    if (si >= steps.length) si = steps.length - 1;
    if (si < 0) si = 0;

    app.innerHTML = "";
    var wrap = el("div", "wrap");
    wrap.appendChild(rail());
    wrap.appendChild(mainPane(mod, steps));
    app.appendChild(wrap);
  }

  function rail() {
    var r = el("aside", "rail");
    r.appendChild(el("p", "eyebrow", ABBR + " training"));
    r.appendChild(el("h1", null, COURSE.title));
    r.appendChild(el("p", "blurb", COURSE.audience + ". " + COURSE.blurb));

    var totalAll = 0, doneAll = 0;
    COURSE.modules.forEach(function (m) { totalAll += countable(m); doneAll += doneIn(m); });

    var ov = el("div", "overall");
    ov.appendChild(el("span", null, doneAll + " of " + totalAll + " steps done"));
    var bar = el("div", "bar");
    var fill = el("span");
    fill.style.width = totalAll ? Math.round((doneAll / totalAll) * 100) + "%" : "0%";
    bar.appendChild(fill);
    ov.appendChild(bar);
    r.appendChild(ov);

    var list = el("ul", "mods");
    COURSE.modules.forEach(function (m, i) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      if (i === mi) b.setAttribute("aria-current", "true");
      b.appendChild(el("span", "n", String(i + 1)));
      b.appendChild(el("span", "t", m.title));

      var sub = countable(m)
        ? doneIn(m) + " / " + countable(m)
        : (m.state === "held" ? "held" : "to come");
      b.appendChild(el("span", "s", sub));

      b.addEventListener("click", function () {
        mi = i; si = 0;
        try { history.replaceState(null, "", "#" + m.id); } catch (e) { location.hash = m.id; }
        render();
        window.scrollTo(0, 0);
      });
      li.appendChild(b);
      list.appendChild(li);
    });
    r.appendChild(list);

    var foot = el("div", "railfoot");
    var reset = document.createElement("button");
    reset.type = "button";
    reset.textContent = "Reset progress";
    var armed = false;
    reset.addEventListener("click", function () {
      if (!armed) { armed = true; reset.textContent = "Tap again to reset"; return; }
      done = {}; save(); render();
    });
    foot.appendChild(reset);
    r.appendChild(foot);
    return r;
  }

  function mainPane(mod, steps) {
    var m = el("main", "main");
    var inner = el("div", "inner");
    var st = steps[si];

    var crumb = el("p", "crumb");
    crumb.appendChild(el("span", null, "Module " + (mi + 1) + " · " + mod.title));
    var c = chipFor(mod);
    if (c) {
      var ch = el("span", "chip " + c.cls, c.label);
      crumb.appendChild(ch);
    }
    inner.appendChild(crumb);

    if (st.kind === "opener") inner.appendChild(opener(mod, steps));
    else if (st.kind === "slide") inner.appendChild(slide(st));
    else inner.appendChild(video(st));

    m.appendChild(inner);
    m.appendChild(nav(steps));
    return m;
  }

  function opener(mod, steps) {
    var card = el("section", "card opener");
    card.appendChild(el("h2", null, mod.title));
    card.appendChild(el("p", "summary", mod.summary));

    if (mod.state === "held") {
      var h = el("div", "note");
      h.appendChild(el("strong", null, "Not recorded yet. "));
      h.appendChild(document.createTextNode(words(mod.heldBecause)));
      card.appendChild(h);
    } else if (mod.state === "planned") {
      var p = el("p", "empty");
      p.appendChild(el("strong", null, "This module is planned, not written. "));
      p.appendChild(document.createTextNode(
        "Its slides and videos are listed in the course plan; nothing here is authored yet."));
      card.appendChild(p);
    }

    if (countable(mod)) {
      var ul = el("ul", "steps");
      steps.forEach(function (s) {
        if (!s.key) return;
        var li = document.createElement("li");
        li.appendChild(el("span", "k", s.kind === "slide" ? "sl" : "vid"));
        li.appendChild(el("span", null, s.data.title));
        if (s.kind === "video") {
          var vc = videoChip(s.data);
          li.appendChild(el("span", "chip " + vc.cls, vc.label));
        } else {
          li.appendChild(el("span", "k", done[s.key] ? "done" : ""));
        }
        ul.appendChild(li);
      });
      card.appendChild(ul);

      if (COURSE.signIn) {
        var n = el("div", "note");
        n.appendChild(el("strong", null, "Sign in as: "));
        n.appendChild(document.createTextNode(words(COURSE.signIn)));
        card.appendChild(n);
      }
    }
    return card;
  }

  /* A screenshot that has not been captured yet says so and names the file it
     wants, rather than showing a broken image. Dropping the file into shots/
     makes it appear with no edit to the content. */
  function shot(s) {
    var fig = el("figure", "shot");
    var img = document.createElement("img");
    img.src = "shots/" + s.shot.file;
    img.alt = words(s.shot.alt || s.shot.caption || "");
    img.loading = "lazy";
    img.addEventListener("error", function () {
      fig.innerHTML = "";
      var ph = el("div", "shot-missing");
      var p1 = el("p");
      p1.appendChild(el("strong", null, "Screenshot not captured yet. "));
      p1.appendChild(document.createTextNode(words(s.shot.caption)));
      ph.appendChild(p1);
      var p2 = el("p");
      p2.appendChild(document.createTextNode("Save it as "));
      p2.appendChild(el("code", null, "shots/" + s.shot.file));
      ph.appendChild(p2);
      fig.appendChild(ph);
    });
    fig.appendChild(img);
    fig.appendChild(el("figcaption", null, s.shot.caption));
    return fig;
  }

  function slide(st) {
    var s = st.data;
    var card = el("section", "card");
    card.appendChild(el("h2", null, s.title));
    (s.body || []).forEach(function (p) { card.appendChild(el("p", null, p)); });

    if (s.facts && s.facts.length) {
      var dl = el("dl", "facts");
      s.facts.forEach(function (f) {
        var row = el("div", "fact");
        row.appendChild(el("dt", null, f[0]));
        row.appendChild(el("dd", null, f[1]));
        dl.appendChild(row);
      });
      card.appendChild(dl);
    }
    if (s.shot) card.appendChild(shot(s));
    if (s.note) card.appendChild(el("div", "note", s.note));
    card.appendChild(doneRow(st));
    return card;
  }

  function video(st) {
    var v = st.data;
    var card = el("section", "card vid");
    card.appendChild(el("h2", null, v.title));

    var head = el("p", "shows");
    head.appendChild(document.createTextNode(words(v.shows)));
    card.appendChild(head);

    var box = el("div", "box");
    if (v.url) {
      var a = document.createElement("a");
      a.className = "watch";
      a.href = v.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "Watch the walkthrough";
      box.appendChild(a);
      box.appendChild(el("p", null,
        "The video opens in a new tab. Come back here when it ends."));
    } else {
      var p1 = el("p");
      p1.appendChild(el("strong", null, "Not recorded yet. "));
      p1.appendChild(document.createTextNode(
        "The recording script for this walkthrough is ready — it names the sign-in, " +
        "every click and what to say."));
      box.appendChild(p1);
      var p2 = el("p");
      p2.appendChild(document.createTextNode("Script: "));
      var code = el("code", null, v.script + (v.section ? "  §" + v.section : ""));
      p2.appendChild(code);
      box.appendChild(p2);
    }
    card.appendChild(box);
    card.appendChild(doneRow(st));
    return card;
  }

  function doneRow(st) {
    var label = el("label", "done");
    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.id = "done-" + st.key;
    cb.checked = !!done[st.key];
    cb.addEventListener("change", function () {
      if (cb.checked) done[st.key] = 1; else delete done[st.key];
      save();
      render();
    });
    label.appendChild(cb);
    label.appendChild(document.createTextNode(
      st.kind === "video" ? "I have watched this" : "I have read this"));
    return label;
  }

  function nav(steps) {
    var n = el("div", "nav");

    var back = document.createElement("button");
    back.type = "button";
    back.textContent = "Back";
    back.disabled = false;
    back.addEventListener("click", function () { move(-1); });

    var next = document.createElement("button");
    next.type = "button";
    next.className = "primary";
    var last = si >= steps.length - 1;
    var lastMod = mi >= COURSE.modules.length - 1;
    next.textContent = last ? (lastMod ? "Back to the start" : "Next module") : "Next";
    next.addEventListener("click", function () { move(1); });

    n.appendChild(back);
    n.appendChild(next);
    n.appendChild(el("span", "count", "Step " + (si + 1) + " of " + steps.length));
    return n;
  }

  function move(d) {
    var steps = stepsOf(COURSE.modules[mi]);
    var want = si + d;
    if (want >= 0 && want < steps.length) { si = want; render(); window.scrollTo(0, 0); return; }
    var wantMod = mi + d;
    if (wantMod < 0) wantMod = COURSE.modules.length - 1;
    if (wantMod >= COURSE.modules.length) wantMod = 0;
    mi = wantMod;
    si = d > 0 ? 0 : stepsOf(COURSE.modules[mi]).length - 1;
    try { history.replaceState(null, "", "#" + COURSE.modules[mi].id); } catch (e) { /* fine */ }
    render();
    window.scrollTo(0, 0);
  }

  document.addEventListener("keydown", function (e) {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === "ArrowRight") move(1);
    else if (e.key === "ArrowLeft") move(-1);
  });

  window.addEventListener("hashchange", function () {
    var id = (location.hash || "").replace("#", "");
    COURSE.modules.forEach(function (m, i) { if (m.id === id && i !== mi) { mi = i; si = 0; render(); } });
  });

  render();
})();
</script>
