stage: 4
name: Set up Google Workspace and the chapter's email
version: "0.4"
updated: "09-23-26 13:54"
why: >-
  Google Workspace is Google's paid service for an organization's email, calendars
  and documents. The software reads and sends the chapter's mail, creates calendar
  events and stores documents through it, so several of the mailboxes made here are
  used by the software and have rules of their own. This stage also takes the
  domain registrar account off the founder's personal email.
who: >-
  The chapter's setup contact and its Google Workspace administrator, with the
  central support organization.
time: >-
  Most of a day, spread over two or three days while DNS records are seen and
  the nonprofit application is answered.
before_you_start:
  - The agreement signed (stage 2)
  - The domain names registered and in the chapter's Cloudflare account, or at its own DNS provider with manual DNS (stage 3)
  - The nonprofit determination letter, for the discount (step 1.5)
unlocks: >-
  The hosting and video meeting accounts can be opened with chapter addresses
  (stage 5). The Google permissions the software needs (stage 10) depend on the
  accounts made here.
steps:
  - id: "4.1"
    name: Confirm the chapter will hold its own Google Workspace
    why: Every chapter hosts its own email on its own Google Workspace, so the chapter has to take on that account and its cost before anything is set up.
    who: chapter's board, advised by the central support organization
    first: ["2.6"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: "Tell the board what holding its own Google Workspace means:"
        items:
          - The account is in the chapter's own name, on the chapter's own domain.
          - The chapter pays for it, with the nonprofit discount once it is granted (step 4.13).
          - The chapter's mail, documents and calendars stay with the chapter if it ever leaves.
          - The central support organization works inside it only by the chapter's grant.
      - do: The board records that the chapter will hold its own Google Workspace.
    done_when: >-
      The board has recorded that the chapter will hold its own Google Workspace,
      in its own name and on its own domain.
    note: "Ruled 09-18-26: every chapter hosts its own email on its own Google Workspace. The central support organization does not provide Google Workspace."
    check:
      how: The board minutes record it.
      probe: none
    goes_wrong: nothing known yet
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#4.1

  - id: "4.2"
    name: Create the Google Workspace account
    why: The chapter's mailboxes, calendars and shared documents all live in this account.
    who: chapter — the setup contact
    first: ["4.1", "3.4"]
    needs: [primary_domain, founding_email]
    produces: []
    mode: guided
    actions:
      - do: "Open the chapter's record from step 3.2 and read which domain name is the email domain. Everything below uses that domain name, called EMAIL-DOMAIN."
      - do: "In a browser, go to https://workspace.google.com and choose to get started. The exact wording of Google's screens has not been checked for this guide."
      - do: "Answer Google's sign-up questions with these values:"
        items:
          - "Business name: the chapter's name, exactly as chosen in step 1.1"
          - "Number of employees: the number of staff who will have mailboxes"
          - "Region: United States"
          - "Current email address: the founding email address from step 3.1"
          - "Does the business have a domain: yes, and enter EMAIL-DOMAIN"
      - do: "When Google asks for the first user, enter the setup contact's own details:"
        items:
          - "First name and last name: the setup contact's own name, not a role such as Admin"
          - "Username: FIRSTNAME.LASTNAME, so the address is FIRSTNAME.LASTNAME@EMAIL-DOMAIN"
          - "Password: a new password, stored straight away in the chapter's Board vault (step 2.7)"
        see: "An account created, with this user as its first administrator. It becomes the chapter's own administrator account in step 4.5."
      - do: "Choose the Business Starter plan, or the plan the cost agreement names (step 2.2), and pay with the chapter's own card (step 1.6). The nonprofit discount is applied for later, in step 4.13."
      - do: "In a new browser window, go to https://admin.google.com and sign in as FIRSTNAME.LASTNAME@EMAIL-DOMAIN."
        see: "The Google admin console's home page. Google will ask to verify the domain; that is step 4.3."
    done_when: >-
      The account exists on the chapter's email domain and the first administrator
      can sign in.
    check:
      how: The setup contact signs in to the Google Workspace admin console.
      probe: none
    goes_wrong: >-
      Signing up with the website domain name when the chapter chose a separate email
      domain name. The mailboxes then land on the wrong domain name.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#4.2

  - id: "4.3"
    name: Verify the domain
    why: Google will not deliver mail for a domain until the chapter proves it owns it.
    who: both — the chapter's setup contact, with the central support organization's help
    first: ["4.2", "3.7"]
    needs: [primary_domain]
    produces: []
    mode: guided
    actions:
      - do: In the Google Workspace admin console, start domain verification and choose the method that adds a TXT record. Copy the value Google shows.
        see: "A value beginning google-site-verification= followed by a long code. The code is different for every domain."
      - do: "In the chapter's Cloudflare account, open the domain, then DNS, then Records, and choose Add record. Enter exactly:"
        items:
          - "Type: TXT"
          - "Name: @ (the domain itself)"
          - "Content: the whole value from Google, starting google-site-verification="
          - "TTL: Auto"
        see: The new TXT record in the list. Leave any other TXT records as they are.
      - do: "With manual DNS, add the TXT record in the chapter's DNS provider account instead (step 3.7). Its screens differ by provider and are not given here; the record's values are the same."
      - do: Return to the admin console and choose to verify.
        see: The domain shown as verified. A new record can take from minutes to a day to be seen.
    done_when: >-
      Google reports the domain as verified.
    check:
      how: The admin console shows the domain as verified.
      probe: The app looks up the domain's text records and confirms Google's verification record is present.
    goes_wrong: >-
      Impatience. A new DNS record can take from minutes to a day to be seen. Wait
      before assuming the record is wrong.
    later: The app writes the verification record into Cloudflare with the chapter's token. With manual DNS, a person still adds it.
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#4.3

  - id: "4.4"
    name: Switch mail delivery to Google
    why: Mail sent to the chapter's addresses must reach Google, and mail the chapter sends must prove it is genuine or it lands in spam folders.
    who: both — the chapter's setup contact, with the central support organization's help
    first: ["4.3"]
    needs: [primary_domain]
    produces: []
    mode: guided
    actions:
      - do: "Four DNS records are needed on the chapter's email domain, all added in the chapter's Cloudflare account (open the domain, then DNS, then Records). With manual DNS, add all four in the chapter's DNS provider account instead (step 3.7); its screens differ by provider and are not given here, and the records' values are the same:"
        items:
          - "One MX record, which sends incoming mail to Google."
          - "One SPF record, which lists who may send mail as the domain."
          - "One DKIM record, which lets receivers check a message's signature."
          - "One DMARC record, which tells receivers what to do with mail that fails the other two."
      - do: "Delete every existing MX record on the domain. Then choose Add record and enter exactly:"
        items:
          - "Type: MX"
          - "Name: @ (the domain itself)"
          - "Mail server: smtp.google.com"
          - "Priority: 1"
          - "TTL: Auto"
        see: One MX record only, pointing at smtp.google.com. Cloudflare shows it as DNS only by itself. Cleveland's email domain uses exactly this record.
      - do: "Look for an existing TXT record beginning v=spf1. A domain may have only one. If one exists, edit it; if not, choose Add record. Enter exactly:"
        items:
          - "Type: TXT"
          - "Name: @"
          - "Content: v=spf1 include:_spf.google.com ~all"
          - "TTL: Auto"
        see: Exactly one TXT record beginning v=spf1.
      - do: "In the Google Workspace admin console, open Apps, then Google Workspace, then Gmail, then Authenticate email. If the menu differs, search the admin console for Authenticate email. Choose the domain, then generate a new record with these settings:"
        items:
          - "Key length: 2048"
          - "Prefix selector: google"
        see: "A record name, google._domainkey, and a long value beginning v=DKIM1; k=rsa; p=."
      - do: "In Cloudflare, choose Add record and enter exactly:"
        items:
          - "Type: TXT"
          - "Name: google._domainkey"
          - "Content: the whole value from the admin console, beginning v=DKIM1"
          - "TTL: Auto"
      - do: Wait at least an hour, then return to Authenticate email in the admin console and choose Start authentication.
        see: The status for the domain reads that it is authenticating email with DKIM.
      - do: "In Cloudflare, choose Add record and enter exactly, putting the first administrator's chapter address in place of REPORT-ADDRESS. Receivers send their reports to it. Change it to the alert receiving address once step 4.9 has decided that address:"
        items:
          - "Type: TXT"
          - "Name: _dmarc"
          - "Content: v=DMARC1; p=none; rua=mailto:REPORT-ADDRESS"
          - "TTL: Auto"
        see: One TXT record named _dmarc.
      - do: From a personal account outside the chapter, send a message to the first administrator's chapter address.
        see: The message arrives in the chapter mailbox.
      - do: From the chapter mailbox, reply to that personal account. In the personal account, open the message and show its original, or its full headers.
        see:
          - "SPF: PASS"
          - "DKIM: PASS"
          - "DMARC: PASS"
      - do: Put a reminder in the chapter's calendar for four weeks' time, to change the DMARC record from p=none to p=quarantine once the reports show only the chapter's own mail. Cleveland's email domain now runs at p=reject.
    done_when: >-
      A message sent from outside to an address on the domain arrives in the Google
      mailbox.
    check:
      how: The outside message arrives, and the reply shows SPF, DKIM and DMARC all passing.
      probe: "The app looks up four records on the email domain and confirms each: the MX record is smtp.google.com; exactly one SPF record, including _spf.google.com; a TXT record at google._domainkey beginning v=DKIM1; and a TXT record at _dmarc beginning v=DMARC1."
    if_not: Do not change the records again straight away. A changed record can take up to a day to be seen everywhere. Check the four records against the values above, character by character, then ask the central support organization.
    goes_wrong: >-
      Three things. Leaving an old MX record from a previous mail provider: some mail
      then goes to the old provider and is never seen. Adding a second SPF record
      instead of editing the first: receivers then treat SPF as broken. And skipping
      DKIM or DMARC: everything seems to work, but the software's welcome emails to
      new mentors land in spam folders. Any other service that will send mail as the
      chapter's domain, such as a newsletter service or the website's contact form,
      must be added to the SPF record too; ask the central support organization.
    later: The app writes the MX, SPF and DMARC records into Cloudflare with the chapter's token, and then only asks a person to generate the DKIM key. With manual DNS, a person still adds all four.
    status: not-yet-tried — the record values are Cleveland's own, read from its live email domain on 09-19-26.
    source: 8-Methods-Organization-Domains-Google.md#4.4

  - id: "4.5"
    name: Create the chapter's own administrator account
    why: The chapter must always be able to run its own Google Workspace, whatever happens to the central support organization.
    who: chapter
    first: ["4.2"]
    needs: []
    produces: []
    mode: guided
    actions:
      - do: "Sign in to https://admin.google.com as the first administrator from step 4.2."
      - do: "Open Account, then Admin roles. Check the first administrator holds the Super Admin role. The menu wording has not been checked for this guide."
        see: "Super Admin listed for FIRSTNAME.LASTNAME@EMAIL-DOMAIN."
      - do: "Create a second chapter officer's user the same way as step 4.11, then open that user's page, open Admin roles and privileges, and assign Super Admin."
        see: "Two chapter people holding Super Admin."
      - do: "Record both names and addresses on the chapter's account list (step 5.7) as the holders of the Google Workspace top-level sign-in."
      - do: "The second officer signs in at https://admin.google.com with their own chapter address."
        see: "The admin console's home page."
    done_when: >-
      A named person at the chapter holds a Google Workspace administrator account on
      a chapter address.
    check:
      how: The named person signs in to the admin console with their chapter address.
      probe: none
    goes_wrong: >-
      The chapter's only administrator being the central support organization. That
      breaks the rule that the chapter can always withdraw the central support
      organization's access.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#4.5

  - id: "4.6"
    name: Create the central support organization's administrator account
    why: The central support organization needs its own named administrator account to enter the software's permission grant in step 10.3.
    who: both — the chapter's administrator creates it; the central support organization uses it
    first: ["4.5", "2.4"]
    needs: []
    produces: []
    mode: guided
    actions:
      - do: "Sign in to https://admin.google.com as the chapter's administrator."
      - do: "Open Directory, then Users, and choose Add new user. Enter:"
        items:
          - "First name: the central support person's first name"
          - "Last name: the central support person's last name"
          - "Primary email: FIRSTNAME.LASTNAME@EMAIL-DOMAIN, using the central support person's own name, never a shared name such as support"
      - do: "Let Google generate the password. Copy it straight into the chapter's Operations vault, and tell the central support person privately where to find it. Never email it."
      - do: "Open the new user's page, open Admin roles and privileges, and assign Super Admin. Entering the software's permission grant in step 10.3 needs it."
        see: "Super Admin listed for the central support person's account."
      - do: "The central support person signs in at https://admin.google.com with the new address, sets their own password, and turns on two-step sign-in straight away."
        see: "The chapter's admin console, reached from their own account."
    done_when: >-
      The central support organization holds its own named administrator account,
      separate from the chapter's.
    check:
      how: The central support organization signs in to the chapter's admin console with its own account.
      probe: none
    goes_wrong: >-
      The account uses a paid licence, like any user. Budget for it in the cost
      agreement (step 2.2).
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#4.6

  - id: "4.7"
    name: Create the shared operations mailbox
    why: The software reads the chapter's public email and sends as this address, so every staff member sees the same conversation.
    who: chapter's administrator
    first: ["4.5"]
    needs: [primary_domain]
    produces: [ops_mailbox]
    mode: guided
    actions:
      - do: "Sign in to https://admin.google.com as the chapter's administrator. Open Directory, then Users, and choose Add new user."
      - do: "Enter exactly:"
        items:
          - "First name: the chapter's name, for example Akron Business Mentors"
          - "Last name: Info"
          - "Primary email: info@EMAIL-DOMAIN"
      - do: "Let Google generate the password and copy it straight into the chapter's Operations vault."
      - do: "Open Directory, then Users, and find info@EMAIL-DOMAIN."
        see: "info@EMAIL-DOMAIN listed as a user with a Google Workspace licence. It must not appear under Directory, then Groups."
      - do: "Write info@EMAIL-DOMAIN on the chapter information form as the shared operations mailbox. The software reads it as OPS_MAILBOX."
    done_when: >-
      The shared address the software reads and sends from exists as a real licensed
      mailbox, not as an alias or a group. An alias will not work.
    check:
      how: The address appears in the admin console as a user with a licence.
      probe: Once stage 10 is done, the app asks Google's directory whether the address is a licensed user and not a group.
    goes_wrong: >-
      Creating the address as a group or an alias. The software can only act as a real
      mailbox, and it fails later with an error that does not name the cause. Cleveland
      learned this when its administrator address turned out to be a group. Also, only
      one deployment may ever read a given shared operations mailbox.
    later: unchanged
    status: not-yet-tried — the rule is proven on Cleveland.
    source: 8-Methods-Organization-Domains-Google.md#4.7

  - id: "4.8"
    name: Create the alert sending mailbox
    why: The software sends its warning messages from this address, and Google refuses to send as a group or an alias.
    who: chapter's administrator
    first: ["4.5"]
    needs: [ops_mailbox]
    produces: [alert_email_from]
    mode: guided
    actions:
      - do: "Use the shared operations mailbox from step 4.7 as the sending address. Cleveland does the same, and it saves a licence."
      - do: "On the chapter information form, write info@EMAIL-DOMAIN as the alert sending address, or leave it empty. The software reads it as ALERT_EMAIL_FROM, and when it is empty it sends from OPS_MAILBOX anyway."
      - do: "Only if the chapter wants a separate sending address: create a second user exactly as in step 4.7, with Last name Alerts and Primary email alerts@EMAIL-DOMAIN, and write that address on the form instead."
        see: "The sending address listed under Directory, then Users, with a licence, and not under Groups."
    done_when: >-
      The address the software sends its warning messages from exists as a real
      licensed mailbox. An alias or a group will be refused.
    check:
      how: The address appears in the admin console as a user with a licence.
      probe: Once stage 10 is done, the app asks Google's directory whether the address is a licensed user.
    goes_wrong: >-
      A group or an alias. It is refused, the same as in step 4.7.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#4.8

  - id: "4.9"
    name: Decide who receives the system's warning messages
    why: A warning nobody reads changes nothing, so the receiving address must reach named people.
    who: both
    first: ["4.5"]
    needs: []
    produces: [alert_email_to]
    mode: guided
    actions:
      - do: "Sign in to https://admin.google.com. Open Directory, then Groups, and choose Create group. Enter:"
        items:
          - "Name: System Administrators"
          - "Group email: admin@EMAIL-DOMAIN"
          - "Description: Receives the system's warning messages"
      - do: "In the group's access settings, let people outside the organization post to the group. The hosting provider's alerts come from outside the chapter. The setting's exact wording has not been checked for this guide."
      - do: "Add these members to the group:"
        items:
          - "At least one named officer of the chapter"
          - "At least one named person from the central support organization, by their own address"
      - do: "Write admin@EMAIL-DOMAIN on the chapter information form as the alert receiving address. The software reads it as ALERT_EMAIL_TO. Write the members' names beside it on the chapter's account list (step 5.7)."
      - do: "From a personal account outside the chapter, send a test message to admin@EMAIL-DOMAIN."
        see: "The test message arrives with every member of the group."
    done_when: >-
      The receiving address is decided and it reaches a person who reads it during the
      working week, not an unattended mailbox.
    check:
      how: The named people are written down beside the address. The real test is step 12.4, once the software can send.
      probe: none
    goes_wrong: >-
      An address nobody reads. The warnings then arrive and change nothing.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#4.9

  - id: "4.10"
    name: Create the members group
    why: When a new mentor's mailbox is created, the software adds the mentor to this group, so the chapter can write to all its members at once.
    who: chapter's administrator
    first: ["4.5"]
    needs: [primary_domain]
    produces: [members_group]
    mode: guided
    actions:
      - do: "Sign in to https://admin.google.com. Open Directory, then Groups, and choose Create group. Enter:"
        items:
          - "Name: All Members"
          - "Group email: allmembers@EMAIL-DOMAIN, or another address the chapter prefers"
          - "Description: Every member of the chapter"
      - do: "In the group's access settings, set who can post. That is the chapter's choice. Only the group's own members posting is the usual choice."
      - do: "Add yourself as a test member, then remove yourself."
        see: "The member appears in the group's member list and then disappears."
      - do: "Write the group's address on the chapter information form as the members group. The software reads it as GOOGLE_MEMBERS_GROUP. Leaving it empty turns this feature off."
    done_when: >-
      The group exists at its own address and the administrator can add and remove
      members.
    check:
      how: The group appears in the admin console, and the administrator adds and removes a test member.
      probe: Once stage 10 is done, the app reads the group through Google's directory.
    goes_wrong: >-
      Adding members to the group needs one more permission in the software's grant
      than the rest. Step 10.3 lists it.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#4.10

  - id: "4.11"
    name: Create the staff mailboxes
    why: Staff sign in and are addressed at their chapter address only, never a personal one.
    who: chapter's administrator
    first: ["4.5"]
    needs: [primary_domain]
    produces: []
    mode: guided
    actions:
      - do: "Sign in to https://admin.google.com. For each member of staff the chapter names now (the full list is confirmed later, in step 14.1), open Directory, then Users, and choose Add new user. Enter:"
        items:
          - "First name: their first name"
          - "Last name: their last name"
          - "Primary email: FIRSTNAME.LASTNAME@EMAIL-DOMAIN"
          - "Secondary email: their personal address, used only to send them their sign-in details"
      - do: "Let Google generate a password, and choose the option that asks for a new password at the first sign-in. Send the sign-in details to the secondary email. The option wording has not been checked for this guide."
      - do: "Do not create mentors' mailboxes here. The software creates each mentor's mailbox from their mentor record (step 15.9)."
      - do: "Open Directory, then Users."
        see: "Every member of staff listed, each with a licence."
    done_when: >-
      Every member of staff who will use the system has a mailbox on the chapter's
      domain. Mentors' mailboxes are created later, from their mentor records (step
      15.9).
    check:
      how: Every name on the staff list (step 14.1) has a mailbox.
      probe: Once stage 10 is done, the app compares the staff list with Google's directory.
    goes_wrong: >-
      A mentor's mailbox created by hand. The software may then pick a different
      address for that mentor. Also, a staff member's personal address used in the
      software causes duplicate calendar invitations.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#4.11

  - id: "4.12"
    name: Require two-step sign-in
    why: The chapter's mailboxes hold client and mentor records, and a stolen password must not be enough to read them.
    who: chapter's administrator
    first: ["4.5", "4.6", "4.7", "4.8", "4.9", "4.10", "4.11"]
    needs: [chapter_vault]
    produces: []
    mode: guided
    actions:
      - do: "Sign in to https://admin.google.com. Open Security, then Authentication, then 2-step verification. The menu wording has not been checked for this guide."
      - do: "Set exactly:"
        items:
          - "Allow users to turn on 2-step verification: on"
          - "Enforcement: on, from a date one week away"
          - "New user enrollment period: 1 week"
          - "Methods: any except verification codes sent by text message or phone call"
        see: "The settings saved for the whole organization."
      - do: "Sign in as info@EMAIL-DOMAIN and turn on two-step sign-in at https://myaccount.google.com/signinoptions/twosv, using an authenticator app held by two named people, not one person's phone."
      - do: "On the same page, generate backup codes for info@EMAIL-DOMAIN and put them in the chapter's Operations vault. Do the same for any other shared mailbox."
      - do: "After the enforcement date, open Directory, then Users, and add the 2-step verification enrollment column."
        see: "Every user shown as enrolled."
    done_when: >-
      Two-step sign-in is enforced for every account, and recovery is possible
      without one person.
    check:
      how: The admin console reports two-step sign-in as enforced, each user enrolled, and the shared mailboxes' recovery codes are in the vault.
      probe: Once stage 10 is done, the app reads each user's enrolment through Google's directory.
    goes_wrong: >-
      A shared mailbox whose second step is one person's phone. When that person is
      away, nobody can sign in to it.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#4.12

  - id: "4.13"
    name: Apply for the nonprofit discount
    why: The discount is claimed in the chapter's own name and lowers the Google Workspace bill the chapter pays every month.
    who: chapter
    first: ["1.5", "4.2"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: "In a browser, go to https://www.google.com/nonprofits and choose to get started. Sign in as the chapter's administrator from step 4.5."
      - do: "Fill in the application with the chapter's legal name, its employer identification number from step 1.3, and its address, exactly as they appear on the determination letter from step 1.5."
      - do: "Google's verification partner, Goodstack (formerly called Percent), checks the chapter's nonprofit status. If it asks for evidence, upload the determination letter from step 1.5. That this is still the verification partner has not been checked for this guide."
      - do: "Write the date the application went in on the chapter's account list (step 5.7), with the expected answer date Google gives."
      - do: "Once approved, activate Google Workspace for Nonprofits from the Google for Nonprofits account, and choose the chapter's existing Google Workspace domain. The exact screens have not been checked for this guide."
        see: "The admin console's billing page shows the nonprofit plan."
    done_when: >-
      The application has been submitted with the chapter's nonprofit evidence, and
      the expected answer date is recorded.
    check:
      how: The application is submitted, and the answer date is written down.
      probe: none
    goes_wrong: >-
      A chapter under a sponsoring nonprofit has no status of its own to apply with.
      See step 1.5 and the open question in the plan.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#4.13

  - id: "4.14"
    name: Move control of the registrar account to a chapter mailbox
    why: The domain names must not stay tied to one volunteer's personal email.
    who: chapter — the setup contact
    first: ["4.4"]
    needs: [ops_mailbox, founding_email]
    produces: []
    mode: guided
    actions:
      - do: "Sign in to the registrar account from step 3.3. Open its account profile or contact settings. Registrars name this page differently; if it cannot be found, search the registrar's help pages for how to change the account email."
      - do: "Change the account's sign-in and contact email to info@EMAIL-DOMAIN, and confirm the change from the message sent there."
      - do: "Delete the founding email address from step 3.1 from every contact field on the account."
      - do: "Sign in to Cloudflare, open My Profile, and change the email address to info@EMAIL-DOMAIN. Confirm the change from the message sent there. With manual DNS, do the same in the chapter's DNS provider account, unless the registrar hosts the DNS."
        see: "Both accounts show info@EMAIL-DOMAIN."
      - do: "Sign out of the registrar and use its forgotten-password link with info@EMAIL-DOMAIN."
        see: "The password reset message arrives in info@EMAIL-DOMAIN. Do not complete the reset unless you mean to; if you do, put the new password in the chapter's vault."
    done_when:
      - "The registrar account's contact address is a chapter mailbox."
      - "The founder's personal address has been removed."
      - "A password reset test lands in the chapter mailbox."
    check:
      how: The password reset message arrives in the chapter mailbox.
      probe: none
    goes_wrong: >-
      A loop. If the chapter's email is ever down because of a domain name problem,
      the registrar's password reset goes to that same broken email. Keep the
      registrar's recovery codes from step 3.6 safe for this case.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#4.14

