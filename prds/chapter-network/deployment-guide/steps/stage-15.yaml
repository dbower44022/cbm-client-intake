    date: "09-23-26 14:27"
    change: >-
      The placeholder CHAPTER-SLUG is now SHORT-LABEL, the form's own name for it (Doug, 09-23-26: slug is a terrible name for a user). The guide's index lists every shared placeholder.
  - version: "0.2"
    date: "09-19-26 00:15"
    change: >-
      Every action made precise (Doug, 09-19-26): exact file naming, the
      mapping table's columns, the load order, the restore-copy commands, the
      audit script run inside the application's web part, and exact addresses
      for Mentor Administration and the volunteer form.
  - version: "0.1"
    date: "09-18-26 17:30"
    change: >-
      First version as data, converted from the methods for loading records
      (10-Methods-Website-Pages-Records.md, version 0.2) and for the mentor steps
      (5-Methods-Form-Accounts-Checks.md, version 0.4) with the step list's
      finishing tests.
