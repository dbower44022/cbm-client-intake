stage: 6
name: Build the chapter's public website
version: "0.7"
updated: "11-08-26 10:05"
summary: >-
  The chapter's public website is a WordPress site built from the Association's
  template, on a lightly managed host on DigitalOcean (Cloudways), with the
  Association's WordPress add-on, the chapter connector (Association rulings 28,
  29 and 34). The chapter owns the site, its pages and its words. The chapter
  connector fetches the parts that come from the CRM system: the colours, fonts,
  logo and header graphic set in the Website group of System Settings, the key
  pages such as the mentor directory and events, and the framed forms. This stage
  publishes the site, installs the template and the chapter connector, names the
  person who edits it, gathers the colours and images the Website group will hold,
  and turns on visitor statistics without cookies. A chapter that keeps another
  platform, such as Squarespace, uses the embed code instead (Association ruling
  27), and steps 6.2 and 6.3 differ for it.
who: >-
  The chapter. The Association helps on request (Association ruling 33).
time: >-
  About two hours for a new WordPress site on the template, plus up to a day for a
  new address to be seen everywhere. The chapter's own pages and words take as
  long as the chapter wants.
before_you_start:
  - The chapter's domain names in its Cloudflare account (step 3.7)
  - The website host account (step 5.10)
  - The chapter's name (step 1.1)
unlocks: >-
  The policy documents (stage 7) can be published on the site, and the chapter
  information form (stage 8) can be filled in with the site's address. The site's
  key pages and colours appear once the chapter's applications are deployed and
  the Website group is filled in (stage 13).
steps:
  - id: "6.1"
    name: Choose the website platform
    summary: >-
      The Association recommends its WordPress template with the chapter connector
      (Association rulings 28 and 34). A chapter may keep the platform it has; it
      then shows the CRM's parts through the embed code, a frame the chapter
      applications serve, without page switches (Association ruling 27).
    who: chapter
    first: ["3.4"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: "Decide one of two answers with the chapter's board:"
        items:
          - "The Association's WordPress template, on Cloudways (the full path). Steps 6.2 and 6.3 build it."
          - "The chapter's existing website platform (the basic path). The site stays where it is, and the CRM's parts are added with the embed code at stage 13."
      - do: "Name the person who builds and maintains the site, and write on the chapter's account list (step 5.7): the platform, the address the editors sign in at, and that person's name."
        see: The website on the account list, with a named person.
    done_when: >-
      The choice is made and someone is named to build and maintain the site.
    check:
      how: The platform and the person's name are on the chapter's account list.
      probe: none
    goes_wrong: >-
      Nobody named to maintain it. A website built by a volunteer who then leaves is
      a website nobody can change. On WordPress, someone must also keep WordPress
      itself up to date; the template switches on its automatic updates (Association
      ruling 28).
    later: unchanged
    status: not-yet-tried — rewritten 11-08-26 for the Association's website rulings.
    source: Association rulings 26 to 29 and 34 (business-mentors-association, DECISIONS.md)

  - id: "6.2"
    name: Publish the website
    summary: >-
      On the full path, a small Cloudways server on DigitalOcean runs WordPress at
      the chapter's website domain, with a free security certificate. On the basic
      path, the chapter's existing site only needs to load securely at its domain.
    who: chapter
    first: ["6.1", "5.10", "3.7"]
    needs: []
    produces: [website_base_url]
    mode: guided
    actions:
      - do: "Basic path only: open https://WEBSITE-DOMAIN/ in a private browser window, check it shows with no security warning, and skip to step 6.4."
      - do: "In Cloudways (https://platform.cloudways.com), signed in as admin@EMAIL-DOMAIN, open Servers and click Launch (or Add Server)."
        see: "A form with an application list, three name fields, a list of cloud providers, a server size and a location."
      - do: "Fill the launch form with these values:"
        items:
          - "Application: WordPress, the plain one (not WooCommerce, Multisite or Clean)"
          - "Application name: SHORT-LABEL-site"
          - "Server name: SHORT-LABEL-web"
          - "Project: the chapter's name"
          - "Cloud provider: DigitalOcean"
          - "Server size: the smallest offered, 1 GB"
          - "Location: the one nearest the chapter"
      - do: "Read the monthly price Cloudways shows beside the size, then click Launch Now."
        see: "A message that the server is being prepared. It takes 7 to 10 minutes; the server then shows a green mark on the Servers page."
      - do: "In Cloudways, open the server, then Master Credentials, and copy the Public IP."
        see: "Four numbers separated by dots."
      - do: "In Cloudflare, open the website domain, then DNS, then Records, and add a record with these values, then Save:"
        items:
          - "Type: A"
          - "Name: @ for the domain itself, or the part before the domain for an address under it"
          - "IPv4 address: the Public IP from Cloudways"
          - "Proxy status: DNS only (grey cloud), so the certificate in the next action can be issued"
        see: "The record listed as DNS only."
      - do: "In Cloudways, open Applications, then SHORT-LABEL-site, then Domain Management. Click Add Domain, enter WEBSITE-DOMAIN, tick Make primary if offered, and save."
        see: "WEBSITE-DOMAIN listed as the primary domain."
      - do: "In the same application, open SSL Certificate, choose Let's Encrypt, enter admin@EMAIL-DOMAIN as the contact and WEBSITE-DOMAIN as the domain, and click Install Certificate. Then switch on HTTPS Redirection if offered."
        see: "After a minute or two, a message that the certificate is installed."
      - do: "Open https://WEBSITE-DOMAIN/ in a private browser window."
        see: "A plain WordPress site with a padlock and no security warning."
    done_when: >-
      The site loads at the chapter's website domain over a secure connection.
    check:
      how: The site opens in a private browser window at https:// and the chapter's domain, with no security warning.
      probe: The app fetches the website's address and checks it answers over a secure connection with a valid certificate.
    if_not:
      - "The certificate fails because the domain does not point at the server: wait ten minutes for the DNS record to be seen, and try once more."
      - "Anything else: stop, and ask the Association before going on."
    goes_wrong: >-
      A new Cloudways account held for a manual check before it can launch a server
      ("Your account activation is pending", 11-08-26): email the address Cloudways
      gives, and wait. And a site meant only for testing left open to search
      engines: switch on WordPress's Discourage search engines setting (Settings,
      then Reading) on any test site.
    later: The onboarding app launches the server through the Cloudways interface and writes the DNS record with the chapter's Cloudflare token.
    status: not-yet-tried — rewritten 11-08-26; the Cloudways screens are from the Association's test website runbook, not yet walked through.
    source: business-mentors-association, docs/runbooks/test-website-runbook.html

  - id: "6.3"
    name: Install the template and the chapter connector
    summary: >-
      The chapter connector is the Association's WordPress add-on. It carries the
      template's pages, header and footer, and it fetches the colours, key pages and
      forms from the chapter's applications. It needs no password (Association
      ruling 34). Until the chapter's applications are deployed, it can point at the
      Association's shared test system.
    who: chapter, with the Association on request
    first: ["6.2"]
    needs: [website_base_url]
    produces: []
    mode: guided
    actions:
      - do: "Basic path only: skip this step. The embed code is added at stage 13."
      - do: "In Cloudways, open the application's Access Details and copy the WordPress Admin Panel address, username and password into the chapter's Operations vault, in an item titled WordPress administrator."
      - do: "Sign in at https://WEBSITE-DOMAIN/wp-admin with those details."
        see: "The WordPress Dashboard."
      - do: "Open Appearance, then Themes, and check the active theme is Twenty Twenty-Five, the template's starter theme; activate it if not."
      - do: "Open Plugins, then Add New Plugin. Search for Chapter Connector and install the Association's chapter connector. Until it is published in WordPress's add-on directory (Association ruling 36), choose Upload Plugin instead and upload the zip file the Association supplies."
        see: "Chapter Connector in the Plugins list, and a Chapter connector item in the left menu, once you click Activate."
      - do: "Open Chapter connector. In the Chapter applications address field, enter the chapter's applications address (APP-ADDRESS, with https://), or, until those are deployed, the address the Association names for its shared test system. Click Save address."
      - do: "On the same screen, click Install the template's pages, header and footer."
        see: "A message that the template's pages, header and footer are installed."
      - do: "Open Settings, then General, and set Site Title to the chapter's name. Open Settings, then Reading: on a test site, tick Discourage search engines from indexing this site."
      - do: "Open https://WEBSITE-DOMAIN/ in a private browser window."
        see: "The template's home page, with a Request a Mentor button. The colours, logo and key pages appear once the Website group is filled in (stage 13)."
    done_when:
      - "The chapter connector is installed and active."
      - "The template's pages, header and footer are installed."
      - "The chapter connector names the chapter's applications address, or the shared test system's."
    check:
      how: The home page shows the template, and the Chapter connector screen shows the applications address.
      probe: The app fetches the website's home page and checks for the chapter connector's marker.
    goes_wrong: >-
      A cache that still shows the plain theme after installing: in Cloudways, open
      the application and purge its cache (Varnish), then reload. And the chapter's
      applications not yet naming the website among their allowed addresses: the
      framed forms then stay empty until stage 13 adds it.
    later: The chapter connector installed from WordPress's add-on directory, with updates the chapter chooses to take automatically or not (Association ruling 36).
    status: not-yet-tried — this step replaced the redirect check on 11-08-26, because the events page is now a key page the chapter connector serves (Association rulings 34 and 35). The template install was rehearsed on a plain WordPress on 11-07-26.
    source: business-mentors-association, docs/runbooks/test-website-runbook.html

  - id: "6.4"
    name: Confirm someone at the chapter can edit the website
    why: The policy documents (stage 7) and the chapter's own pages need changes on the site, made by someone at the chapter with a sign-in of their own.
    who: chapter
    first: ["6.3"]
    needs: []
    produces: []
    mode: guided
    actions:
      - do: "On WordPress, signed in as the administrator from step 6.3, open Users, then Add New User, and create a user for the named person from step 6.1 with their own chapter address and the Editor role (Administrator if they also maintain WordPress). On another platform, use its own way of adding an editor."
      - do: The named person signs in with their own sign-in, changes one word on the home page and publishes it.
      - do: They open https://WEBSITE-DOMAIN/ in a private browser window.
        see: The changed word.
      - do: They change the word back, publish, and reload the private window.
        see: The original word again.
    done_when: >-
      A named person at the chapter has signed in and made a change.
    check:
      how: The change appeared on the public site.
      probe: none
    goes_wrong: >-
      The only sign-in belongs to the person or company who built the site.
    later: unchanged
    status: not-yet-tried
    source: 9-Methods-Hosting-Website-Policies.md#6.4

  - id: "6.5"
    name: Choose the chapter's colours, fonts and header graphic
    summary: >-
      The chapter's look is set once, in the Website group of System Settings, and
      the chapter connector applies it to the whole site; the applications build
      their own colours from the same values (Association ruling 34). This step only
      chooses the values; they are entered at stage 13. A separate colour file is no
      longer needed.
    who: chapter
    first: ["6.1"]
    needs: [website_base_url]
    produces: [chapter_tokens_url]
    mode: offline
    actions:
      - do: "Choose eight colours as six-digit codes: base (the background), contrast (the text), and accent 1 to accent 6 (headings, buttons, links and highlights). Start from the template's defaults, shown in the Website group, and change only what the chapter wants."
      - do: "Choose the heading font and the body font from the fonts the Website group offers."
      - do: "Produce the header graphic: a wide image shown tall on the home page and as a narrow strip on every other page (Association rulings 67 and 69)."
      - do: "Write all of these in a note in the chapter's shared drive, for stage 13."
      - do: "On the chapter information form, leave the question Web address (URL) of the colour file empty. It becomes CHAPTER_TOKENS_URL, now an override for a chapter that already has its own colour file."
    done_when:
      - "The chapter's eight colours and two fonts are chosen and written down."
      - "The header graphic exists."
    check:
      how: The note and the image are in the chapter's shared drive.
      probe: none
    goes_wrong: >-
      Colours with too little contrast. The template must meet the Web Content
      Accessibility Guidelines (WCAG) version 2.2 at level AA (Association ruling
      64), so text on its background must stay readable.
    later: The colours entered straight into the Website group, without the note.
    status: not-yet-tried — rewritten 11-08-26; the Website group of System Settings was built in v0.314.0.
    source: prds/chapter-website-plan.md, decision 4.2

  - id: "6.6"
    name: Produce the chapter's logo image
    why: The logo shows on the website, uploaded in the Website group, and in the CRM.
    who: chapter
    first: ["1.1"]
    needs: []
    produces: [crm_logo_file]
    mode: offline
    actions:
      - do: Produce the chapter's logo as a PNG image file. Name it SHORT-LABEL-logo.png, for example lakeside-logo.png.
      - do: The best size and shape are not specified yet (work list item 4). Until they are, open Cleveland's CRM, note the size the logo shows at, and make the chapter's the same shape.
        see: A PNG file that opens.
      - do: "Put the file in the chapter's shared drive folder, and write its file name on the chapter information form under crm: logo_file. It is loaded into the CRM as its company logo in step 9.7, and uploaded to the Website group at stage 13."
    done_when: >-
      An image file of the chapter's logo exists in a form the CRM system and the
      Website group accept.
    check:
      how: The file exists and opens.
      probe: The app checks the file is an image of an accepted type.
    goes_wrong: >-
      A logo that only works on a white background. The website shows it on the
      header's colour, so check it there at stage 13.
    later: A written specification of the file type, the size and where it is loaded.
    status: not-yet-tried
    source: 9-Methods-Hosting-Website-Policies.md#6.6

  - id: "6.7"
    name: Decide where the chapter's help documentation lives
    why: The applications' portal and the CRM's navigation bar both link to the help documentation, and leaving it undecided sends the chapter's staff to Cleveland's.
    who: both — the chapter, with the Association
    first: ["6.2"]
    needs: []
    produces: [docs_site_url]
    mode: guided
    actions:
      - do: "Decide one of two answers, then write it on the chapter information form under web: docs_site_url:"
        items:
          - "The chapter's own documentation site's full address, beginning https://."
          - "none yet — until the open question of shared or per-chapter documentation is settled."
        see: An address or "none yet" on the form. Never blank.
      - do: "If an address was written, run exactly:"
        items:
          - "curl -sI DOCS-ADDRESS"
        see: A first line of HTTP/2 200.
      - do: The answer becomes the setting DOCS_SITE_URL. Its default is Cleveland's, https://docs.clevelandbusinessmentors.org, so it must never be left unset.
    done_when: >-
      Either the chapter has its own documentation site published at its own
      address, or it is recorded that the chapter points at a shared one. Two later
      steps link to this address, so it cannot be left undecided.
    check:
      how: The form carries an address or "none yet".
      probe: If an address is given, the app fetches it and checks it answers.
    goes_wrong: >-
      Leaving the setting DOCS_SITE_URL at its default. The chapter's staff are then
      sent to Cleveland's documentation, which names Cleveland throughout.
    later: Depends on the answer to the open question.
    status: not-yet-tried
    source: 9-Methods-Hosting-Website-Policies.md#6.7

  - id: "6.8"
    name: Turn on visitor statistics without cookies
    summary: >-
      Cloudflare Web Analytics counts visitors without cookies, so the website needs
      no consent banner (Association ruling 63). It is free in the Cloudflare
      account the chapter already owns.
    who: chapter
    first: ["6.2"]
    needs: [website_base_url]
    produces: []
    mode: guided
    actions:
      - do: "In Cloudflare, open Analytics, then Web analytics, and add the website's domain. For a site whose address is proxied through Cloudflare, choose the automatic setup; for a DNS only address, choose the JavaScript snippet. The exact labels have not been checked for this guide."
      - do: "If Cloudflare gives a snippet, paste it into the site: on WordPress, in the chapter connector's settings if it offers a box for it, otherwise in the footer of the template through Appearance, then Editor. On another platform, in its place for code in the page footer."
      - do: "Open the website in a private browser window, then wait an hour and open Web analytics in Cloudflare."
        see: "At least one visit counted."
    done_when: >-
      Cloudflare Web Analytics counts the website's visits, and the site sets no
      tracking cookie.
    check:
      how: Cloudflare's Web analytics shows visits, and the browser's site data shows no analytics cookie.
      probe: The app fetches the home page and checks for the Web Analytics beacon.
    goes_wrong: >-
      A second statistics service, such as Google Analytics, added as well. It sets
      cookies, and the site then needs a consent banner after all.
    later: The chapter connector adds the snippet itself from a Website group setting.
    status: not-yet-tried — added 11-08-26 for Association ruling 63.
    source: Association ruling 63 (business-mentors-association, DECISIONS.md)

changes:
  - version: "0.7"
    date: "11-08-26 10:05"
    change: >-
      Rewritten for the Association's website rulings (review finding 1; plan association-setup-plan.md, batch 3, approved by Doug 11-08-26). The site is WordPress from the Association's template on Cloudways, with the chapter connector, or the chapter's own platform with the embed code (Association rulings 26 to 29 and 34). Step 6.2 launches the Cloudways server, the DNS record and the certificate. Step 6.3, formerly the redirect check, now installs the template and the chapter connector: the events page is a key page the chapter connector serves. Step 6.4 adds the editor's own WordPress user. Step 6.5, formerly the colour file, now chooses the eight colours, two fonts and header graphic the Website group of System Settings will hold; the colour file becomes an optional override. Step 6.6 notes the logo is also uploaded to the Website group. New step 6.8 turns on Cloudflare Web Analytics (Association ruling 63). No step number changed.
  - version: "0.6"
    date: "11-07-26 15:21"
    change: >-
      Corrected while the Business Mentors Association is set up as a chapter (plan association-setup-plan.md, approved by Doug 11-07-26): "the central support organization" is now "the Association", and "the central committee" is "the central technical committee".
  - version: "0.5"
    date: "09-23-26 20:40"
    change: >-
      References to stage 9 follow its renumbering from twenty steps to nine
      (stage 9 version 0.11).
  - version: "0.4"
