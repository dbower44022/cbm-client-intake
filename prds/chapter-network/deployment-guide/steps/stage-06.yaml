stage: 6
name: Build the chapter's public website
version: "0.5"
updated: "09-23-26 20:40"
why: >-
  The public website is the chapter's own marketing site. The software does not
  build it, but it needs four things from it. The policy documents need addresses
  on it. The chapter's colour file needs a place to live on it. The public
  application forms need a link from it. And visitors need to be sent from it to
  the events page the applications serve. This stage makes sure the site can do
  all four, and that someone at the chapter can change it.
who: >-
  The chapter. The central support organization writes the colour file and helps
  with the help documentation decision.
time: >-
  Not known. A chapter that already has a website finishes in an hour; building a
  new site can take weeks.
before_you_start:
  - The chapter's domain names (stage 3)
  - The chapter's name (step 1.1)
unlocks: >-
  The policy documents (stage 7) can be published on the site, and the chapter
  information form (stage 8) can be filled in with the site's addresses.
steps:
  - id: "6.1"
    name: Choose the website platform
    why: The site must be able to publish pages, host a small file and redirect one address to another, and someone must own it.
    who: chapter
    first: ["3.4"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: "If the chapter already has a website, keep it. Otherwise choose a platform that can do all three of these:"
        items:
          - "Publish ordinary pages at addresses the chapter chooses, such as /privacy-policy/."
          - "Send one address to another site by a temporary redirect, the kind numbered 302."
          - "Serve a small stylesheet file with the file type text/css, or link to one hosted elsewhere."
      - do: For reference, Cleveland's website runs on WordPress with the Elementor page builder. That is an example, not a requirement.
      - do: "Add a line to the chapter's account list (step 5.7) with exactly these entries:"
        items:
          - "Account: the website"
          - "Platform: the platform's name"
          - "Sign-in address: the address the site's editors sign in at"
          - "Built and maintained by: the named person"
        see: The website on the account list, with a named person.
    done_when: >-
      The choice is made and someone is named to build and maintain the site.
    check:
      how: The platform and the person's name are on the chapter's account list.
      probe: none
    goes_wrong: >-
      Nobody named to maintain it. A website built by a volunteer who then leaves is
      a website nobody can change.
    later: unchanged
    status: not-yet-tried
    source: 9-Methods-Hosting-Website-Policies.md#6.1

  - id: "6.2"
    name: Publish the website
    why: Every later page the software links to lives on this site, and it must load securely.
    who: chapter
    first: ["6.1"]
    needs: []
    produces: [website_base_url]
    mode: guided
    actions:
      - do: Publish the site at https://WEBSITE-DOMAIN/, where WEBSITE-DOMAIN is the chapter's website domain from stage 3, for example lakesidebusinessmentors.org.
      - do: "Open a terminal and run exactly:"
        items:
          - "curl -sI https://WEBSITE-DOMAIN/"
        see: A first line of HTTP/2 200, or a 301 redirect to the same site with www added, which is also fine.
      - do: Open https://WEBSITE-DOMAIN/ in a private browser window.
        see: The site, with no security warning.
    done_when: >-
      The site loads at the chapter's website domain over a secure connection.
    check:
      how: The site opens in a private browser window at https:// and the chapter's domain, with no security warning.
      probe: The app fetches the website's address and checks it answers over a secure connection with a valid certificate.
    goes_wrong: >-
      A certificate that is not renewed. The site then shows a security warning to
      every visitor.
    later: unchanged
    status: not-yet-tried — the trial chapter had no website.
    source: 9-Methods-Hosting-Website-Policies.md#6.2

  - id: "6.3"
    name: Confirm the website can redirect an address to another site
    why: The chapter's events page will be a redirect to the page the applications serve, so the site must be able to do one.
    who: chapter
    first: ["6.2"]
    needs: [website_base_url]
    produces: []
    mode: guided
    actions:
      - do: "On the website, add a temporary redirect with exactly these values. On WordPress the free Redirection plugin does this; on other platforms look for a setting named redirects:"
        items:
          - "From: /redirect-test"
          - "To: https://example.com/"
          - "Type: 302 (temporary)"
      - do: "In a terminal, run exactly:"
        items:
          - "curl -sI https://WEBSITE-DOMAIN/redirect-test"
        see:
          - "A first line of HTTP/2 302 (or HTTP/1.1 302)."
          - "A line location: https://example.com/"
      - do: Delete the /redirect-test redirect.
      - do: "Run the same command again:"
        items:
          - "curl -sI https://WEBSITE-DOMAIN/redirect-test"
        see: A first line of HTTP/2 404. The test redirect is gone.
    done_when: >-
      A test address on the site sends the visitor to a page on another site, by a
      temporary redirect. (Checking that the site can embed a page returns once the
      public mentor directory page is built and its method is decided.)
    check:
      how: The test address lands on the other site's page.
      probe: The app requests the test address without following redirects and checks it answers 302 with the expected target.
    goes_wrong: >-
      A website platform that cannot redirect one address without a paid plan. Find
      out now, not at stage 13.
    later: unchanged
    status: not-yet-tried — this step replaced an embedding check on 09-18-26, after the 09-11-26 ruling that the events page is reached by a redirect.
    source: 9-Methods-Hosting-Website-Policies.md#6.3

  - id: "6.4"
    name: Confirm someone at the chapter can edit the website
    why: The policy documents (stage 7) and the events redirect (stage 13) both need changes on the site, made by someone at the chapter.
    who: chapter
    first: ["6.2"]
    needs: []
    produces: []
    mode: guided
    actions:
      - do: The named person from step 6.1 signs in to the website's editor at its sign-in address, with their own sign-in, not a shared one.
      - do: They change one word on the home page and publish the change.
      - do: They open https://WEBSITE-DOMAIN/ in a private browser window.
        see: The changed word.
      - do: They change the word back, publish, and reload the private window.
        see: The original word again.
    done_when: >-
      A named person at the chapter has signed in and made a change.
    check:
      how: The change appeared on the public site.
      probe: none
    goes_wrong: >-
      The only sign-in belongs to the person or company who built the site.
    later: unchanged
    status: not-yet-tried
    source: 9-Methods-Hosting-Website-Policies.md#6.4

  - id: "6.5"
    name: Choose the chapter's colours and publish the colour file
    why: Colours are the only visual difference between chapters in the software, so a chapter that skips this looks exactly like Cleveland.
    who: both — the chapter chooses the colours, the central support organization writes the file
    first: ["6.2"]
    needs: [website_base_url]
    produces: [chapter_tokens_url]
    mode: guided
    actions:
      - do: "The chapter chooses four colours, each as a six-digit colour code, and enters them in the four colour questions on the chapter information page (step 8.3). Cleveland's are shown for comparison:"
        items:
          - "Primary colour, used for headings. Cleveland: #173B60 (navy)."
          - "Button colour. Cleveland: #CB963B (gold)."
          - "Button colour when the mouse is over it, about ten per cent darker. Cleveland: #b8842f."
          - "Body text colour. Cleveland: #7A7A7A (grey)."
      - do: "The central support organization writes a file named chapter-tokens.css containing exactly these lines, with the chapter's four colour codes in place of the capitalised words. The values-file writer in step 8.10 produces this file from the page's answers, as prds/chapter-network/chapters/SHORT-LABEL-chapter-tokens.css:"
        items:
          - ":root {"
          - "  --cbm-navy: PRIMARY-COLOUR;"
          - "  --cbm-gold: BUTTON-COLOUR;"
          - "  --cbm-btn-bg-hover: BUTTON-HOVER-COLOUR;"
          - "  --cbm-text: BODY-TEXT-COLOUR;"
          - "}"
      - do: Add nothing else to the file. It may only set names that start --cbm-, and only inside :root. Every name it leaves out keeps Cleveland's value from frontend/shared/tokens.css, where the full list of names is.
      - do: Publish the file so it has its own address, for example https://WEBSITE-DOMAIN/chapter-tokens.css. Whether the chapter's platform can serve a .css file has not been checked for any platform. If it cannot, the central support organization hosts the file elsewhere.
      - do: "In a terminal, run exactly:"
        items:
          - "curl -sI https://WEBSITE-DOMAIN/chapter-tokens.css"
        see:
          - "A first line of HTTP/2 200."
          - "A line content-type: text/css. Browsers ignore a stylesheet from another site served with any other type."
      - do: "Enter the file's full address on the chapter information page, in the question Web address (URL) of the colour file. It becomes the setting CHAPTER_TOKENS_URL."
    done_when:
      - "The chapter's colours are chosen."
      - "The colours are written into a small stylesheet."
      - "The stylesheet is published at a web address the software can load."
    note: "Colours are the only visual difference between chapters in the software, so a chapter that skips this looks exactly like Cleveland."
    check:
      how: The file's address shows the stylesheet's text in a browser. Once the applications are deployed, the public forms show the chapter's colours.
      probe: The app fetches the file, checks it is served as a stylesheet, and checks it sets only --cbm- names on :root.
    goes_wrong: >-
      Three things. The file sets something other than a colour name, which the rule
      forbids so a chapter's file cannot break the pages. Some website platforms
      refuse to host a stylesheet, or serve it as a download; this has not been
      checked for any platform. And the colour file changes only the applications -
      the CRM and the public events page keep their own look (work list item 11).
    later: A starter file listing every colour name with Cleveland's values, which the chapter edits.
    status: not-yet-tried
    source: 9-Methods-Hosting-Website-Policies.md#6.5

  - id: "6.6"
    name: Produce the chapter's logo image
    why: The CRM shows the chapter's logo, and it is the only per-chapter image in the whole system.
    who: chapter
    first: ["1.1"]
    needs: []
    produces: [crm_logo_file]
    mode: offline
    actions:
      - do: Produce the chapter's logo as a PNG image file, the type Cleveland's CRM logo uses. Name it SHORT-LABEL-logo.png, for example lakeside-logo.png.
      - do: The best size and shape are not specified yet (work list item 4). Until they are, open Cleveland's CRM, note the size the logo shows at, and make the chapter's the same shape.
        see: A PNG file that opens.
      - do: "Put the file in the chapter's shared drive folder, and write its file name on the chapter information form under crm: logo_file. It is loaded into the CRM as its company logo in step 9.7."
    done_when: >-
      An image file of the chapter's logo exists in a form the CRM system accepts.
      The applications carry no logo; the CRM system does, and it is the only
      per-chapter image in the whole system.
    check:
      how: The file exists and opens.
      probe: The app checks the file is an image of an accepted type.
    goes_wrong: >-
      A chapter that expects its logo on the application pages. The applications
      carry no logo and no browser tab icon, by a ruling of 26 August 2026. Tell the
      chapter this before it asks.
    later: A written specification of the file type, the size and where it is loaded.
    status: not-yet-tried
    source: 9-Methods-Hosting-Website-Policies.md#6.6

  - id: "6.7"
    name: Decide where the chapter's help documentation lives
    why: The applications' portal and the CRM's navigation bar both link to the help documentation, and leaving it undecided sends the chapter's staff to Cleveland's.
    who: both — the chapter, with the central support organization
    first: ["6.2"]
    needs: []
    produces: [docs_site_url]
    mode: guided
    actions:
      - do: "Decide one of two answers, then write it on the chapter information form under web: docs_site_url:"
        items:
          - "The chapter's own documentation site's full address, beginning https://."
          - "none yet — until the open question of shared or per-chapter documentation is settled."
        see: An address or "none yet" on the form. Never blank.
      - do: "If an address was written, run exactly:"
        items:
          - "curl -sI DOCS-ADDRESS"
        see: A first line of HTTP/2 200.
      - do: The answer becomes the setting DOCS_SITE_URL. Its default is Cleveland's, https://docs.clevelandbusinessmentors.org, so it must never be left unset.
    done_when: >-
      Either the chapter has its own documentation site published at its own
      address, or it is recorded that the chapter points at a shared one. Two later
      steps link to this address, so it cannot be left undecided.
    check:
      how: The form carries an address or "none yet".
      probe: If an address is given, the app fetches it and checks it answers.
    goes_wrong: >-
      Leaving the setting DOCS_SITE_URL at its default. The chapter's staff are then
      sent to Cleveland's documentation, which names Cleveland throughout.
    later: Depends on the answer to the open question.
    status: not-yet-tried
    source: 9-Methods-Hosting-Website-Policies.md#6.7

