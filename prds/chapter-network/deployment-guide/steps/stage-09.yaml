stage: 9
name: Build the CRM system
version: "0.11"
updated: "09-23-26 20:40"
why: >-
  The CRM is the chapter's system of record. Every client, mentor, partner,
  funder and meeting lives in it, and every application reads and writes it.
  This stage builds the chapter's own CRM on the chapter's own server, and makes
  it identical to every other chapter's CRM, so that one release of the software
  works for all of them.
who: >-
  The central support organization, working inside the chapter's accounts.
time: >-
  About half a day when nothing goes wrong.
before_you_start:
  - The chapter information form, complete and reviewed, saved as the chapter's values file (step 8.10)
  - The chapter's hosting account, with the central support organization's access (steps 5.1 and 5.4)
  - The chapter's domain names in its Cloudflare account, or at its own DNS provider with manual DNS (step 3.7)
  - The chapter's own DigitalOcean token, and its Cloudflare token unless it uses manual DNS, entered in CRMBuilder (step 5.8)
  - The chapter's vault in Proton Pass, for every secret this stage creates (step 2.7)
owed:
  - "Duplicate checking, saved views and automated rules. The standard does not yet say what these are, because nobody has examined them on Cleveland's systems (work list item 3). A chapter's CRM is built without them for now."
  - "Five event email templates. They exist on no system yet (work list item 18), so the checking tool in step 9.9 reports them missing. That result is expected."
  - "The server size. Step 9.3 uses 2 processors and 4 GB of memory. That is a recommendation, not yet ruled."
unlocks: >-
  The Google permissions (stage 10) and the applications (stage 11) can start.
  The applications need the CRM key that step 9.7 creates.
steps:
  - id: "9.1"
    name: Write down the versions to build with
    why: Two paid add-on products and one release of the standard configuration go onto the CRM, and later steps check against their version numbers.
    who: central
    first: []
    needs: []
    produces: [addon_versions, standard_release]
    mode: automated
    actions:
      - do: "In the chapter's Operations vault in Proton Pass, create a note named CRM build versions. Everything this step writes down goes in it."
      - do: "Write down the two add-on products and the versions Cleveland's production CRM runs. To read them, sign in to Cleveland's production CRM as an administrator and open Administration, then Extensions. On 31 August 2026 they were:"
        items:
          - "Advanced Pack 3.12.1"
          - "Google Integration 1.8.4"
        see: The two product names and version numbers in the note.
      - do: "On each product maker's website, check that the version supports CRM version 10."
        see: Both versions marked as supporting version 10.
      - do: "Write down the release of the standard configuration. There is no published version number yet (work list item 15). Until there is, write: Cleveland's test system on today's date, with roles and teams as captured on 31 August 2026."
      - do: "Do not write down a CRM version. CRMBuilder always installs the current release, and step 9.4 records the exact number once the server exists."
    done_when:
      - "The CRM build versions note names both add-on products and their versions."
      - "Both versions support CRM version 10."
      - "The note names the release of the standard configuration."
    check:
      how: Open the CRM build versions note in the vault.
      probe: The app reads the versions from the published standard and shows them before the build starts.
    if_not: If either add-on version does not support CRM version 10, do not start the build. Ask the maker which version does, and write that one down instead.
    goes_wrong: >-
      Writing down 9.3.4 as the CRM version, the version Cleveland's test system
      runs. A new chapter never runs it: CRMBuilder installs the current release,
      and Cleveland moves up later.
    later: The standard is published with a version number that the checking tool compares against.
    status: not-yet-tried — the August build had no standard to obtain.
    source: 3-Methods-CRM-Google-Applications.md#9.1

  - id: "9.2"
    name: Prepare the build computer
    why: The deploy wizard in step 9.3 needs a sign-in key and an administrator password that already exist, and the scripts in later steps need a settings file.
    who: central
    first: ["2.7", "8.10"]
    needs: [crm_base_url]
    produces: [crm_ssh_key]
    mode: guided
    actions:
      - do: "Work at the build computer. The build computer is the central support organization's own computer, the one with CRMBuilder installed. Every command in this stage is typed in a terminal window on the build computer. Two folders on it are used:"
        items:
          - "CRMBuilder's folder: ~/Dropbox/Projects/crmbuilder"
          - "The client intake software's folder: ~/Dropbox/Projects/cbm-client-intake"
      - do: "Create the server sign-in key. This is an SSH key: a pair of files that lets a person open a command line on the server. Type the line below and press Enter. Then press Enter twice more, to leave the key without a passphrase:"
        items:
          - "ssh-keygen -t ed25519 -f ~/.ssh/crm-SHORT-LABEL -C crm-SHORT-LABEL"
        see: "Two new files: ~/.ssh/crm-SHORT-LABEL, the private half, which later steps call KEY-FILE; and ~/.ssh/crm-SHORT-LABEL.pub, the public half."
      - do: "Show the public half, so it can be copied. Type the line below and press Enter:"
        items:
          - "cat ~/.ssh/crm-SHORT-LABEL.pub"
        see: One line beginning ssh-ed25519 and ending crm-SHORT-LABEL. Copy the whole line.
      - do: "Add the public half to the chapter's DigitalOcean account. Sign in to the chapter's DigitalOcean account, open Settings, then Security, then add an SSH key. Paste the line, and name the key crm-SHORT-LABEL. The exact wording on DigitalOcean's screen has not been checked for this guide."
        see: The key crm-SHORT-LABEL in the account's list of SSH keys.
      - do: "Create the CRM administrator password. In the chapter's Operations vault in Proton Pass, create a login item named CRM administrator. Set the user name to admin. Generate a password of 24 characters with symbols switched off, so it holds letters and numbers only."
        see: A password of letters and numbers only.
      - do: "Create the folder for the chapter's settings file. Type the line below and press Enter:"
        items:
          - "mkdir -p ~/.config/cbm-SHORT-LABEL"
      - do: "Create the chapter's settings file. In a text editor, make a new file with the three lines below, with the password pasted from the CRM administrator item. Save it as ~/.config/cbm-SHORT-LABEL/SHORT-LABEL.env. Later steps call this file CHAPTER-ENV-FILE."
        items:
          - "ESPO_ADMIN_BASE=https://CRM-ADDRESS"
          - "ESPO_ADMIN_USER=admin"
          - "ESPO_ADMIN_PASS=the password"
        see: The file holds exactly three lines, with no spaces around the equals signs.
    done_when:
      - "The server sign-in key exists on the build computer, and its public half is in the chapter's DigitalOcean account."
      - "The CRM administrator password is in the vault, and holds letters and numbers only."
      - "The chapter's settings file holds the CRM's address and the administrator's name and password."
    check:
      how: The key crm-SHORT-LABEL is listed in DigitalOcean, and the settings file opens with its three lines.
      probe: The app finds the key in the hosting account through the chapter's token.
    if_not: If ssh-keygen says the file already exists, a key for this chapter was made before. Use that key, and skip to adding it to DigitalOcean.
    goes_wrong: >-
      Using CRMBuilder's Generate button for the password. It can add a hyphen or an
      underscore, and the settings file is read by several programs that must all
      read the password the same way. Letters and numbers only are safe everywhere.
    later: The deployment tool makes the key and writes it to the chapter's vault itself.
    status: not-yet-tried — the key, password and settings-file actions are new since the August build.
    source: 3-Methods-CRM-Google-Applications.md#9.2

  - id: "9.3"
    name: Run CRMBuilder's deploy wizard
    why: The wizard creates the server in the chapter's hosting account, installs the CRM on it, and gives the CRM its web address.
    who: central, inside the chapter's hosting account
    first: ["5.4", "5.8", "3.7", "9.2"]
    needs: [digitalocean_token, cloudflare_token, alert_email_to, crm_ssh_key]
    produces: [crm_server_ip]
    mode: automated
    actions:
      - do: "Start CRMBuilder. Type each line below and press Enter:"
        items:
          - "cd ~/Dropbox/Projects/crmbuilder"
          - "./start-v2.sh"
        see: "CRMBuilder's main window. If a window titled Cloud backend not configured appears instead, the build computer is not connected to CRMBuilder's online service. Connect it before going on."
      - do: "Choose the chapter. Click the strip across the top of the window, which names the current engagement, and choose the chapter's engagement."
        see: The chapter's engagement named in the strip. If it is not in the list, step 5.8 is not finished.
      - do: "Open the deploy wizard. Click the tab 11 · CRM Deployment, then Instances in the side bar, then Deploy new… on the toolbar. Do not use New Instance: it only records a CRM that already exists."
        see: A window titled Deploy a new CRM instance, at Step 1 of 5 — Providers.
      - do: "Screen 1, Providers. In the DNS list, choose the entry that matches the DNS provider item in the chapter's Operations vault:"
        items:
          - "Cloudflare — the run creates the record. Choose this when the chapter's DNS is at Cloudflare."
          - "Manual DNS — I add the record at the domain's own DNS provider. Choose this when the chapter kept its own DNS provider."
        see: The entry that matches the vault.
      - do: "Screen 1, Providers. Check the token lines, then click Next:"
        items:
          - "DigitalOcean must read: ✓ Configured — crmbuilder-SHORT-LABEL"
          - "Cloudflare must read: ✓ Configured — crmbuilder-SHORT-LABEL. With manual DNS it may read Not set."
        see: "The labels exactly as above. Any other label means the server would be built in someone else's account: click Set credentials… and do step 5.8 again."
      - do: "Screen 2, Server. Fill in each box, then click Next. The lists take a moment to fill."
        items:
          - "Instance name: SHORT-LABEL CRM"
          - "Region: the region nearest the chapter. For Boston, New York."
          - "Size: s-2vcpu-4gb (2 vCPU, 4096 MB)"
          - "Image: the newest Ubuntu LTS release in the list"
          - "Extra SSH keys: tick crm-SHORT-LABEL"
        see: crm-SHORT-LABEL ticked. Without it, nobody can open a command line on the server, and steps 9.4 and 9.6 cannot be done.
      - do: "Screen 3, Domain, when you chose Cloudflare. Fill in each box, then click Next:"
        items:
          - "Cloudflare zone: the chapter's domain that the CRM's address ends in"
          - "Subdomain: the CRM's address up to the first dot. For crm.example.org, crm."
          - "Let's Encrypt email: ALERT-ADDRESS"
        see: Instance address showing CRM-ADDRESS exactly.
      - do: "Screen 3, Domain, when you chose manual DNS. Fill in each box, then click Next:"
        items:
          - "CRM address: CRM-ADDRESS. For Boston, crm.bbmentors.org."
          - "Let's Encrypt email: ALERT-ADDRESS"
        see: A note saying the run will show the record to add at the domain's DNS provider.
      - do: "Screen 4, Accounts. Fill in each box, then click Next:"
        items:
          - "Administrator username: admin"
          - "Administrator email: ALERT-ADDRESS"
          - "Administrator password: paste it from the CRM administrator item in the vault"
          - "Generate database passwords automatically (recommended): leave ticked"
      - do: "Screen 5, Review. Check that Extra SSH keys reads crm-SHORT-LABEL, not (generated key only). Then click Deploy."
        see: A window titled Deploy run DEP-NNN, with a progress bar and a log.
      - do: "Manual DNS only: add the CRM's record while the run waits. When the status line reads Waiting for DNS, it shows the record to add. The log shows the same line. In the chapter's DNS provider account, add a record with exactly:"
        items:
          - "Type: A"
          - "Host or name: only the first part of the CRM's address, for crm.bbmentors.org just crm. Squarespace and most providers add the domain themselves, so typing the full address makes the record crm.bbmentors.org.bbmentors.org and the run never sees it. Only if the screen shows the domain is not added (no .bbmentors.org beside the box and no note saying so) type the full address."
          - "Value, data or points to: the server's address from the status line"
          - "Proxy or forwarding: off"
          - "TTL: the provider's default, or the shortest it offers"
        see: Within a few minutes, the status line moves on to Preparing server. The run waits up to 30 minutes for the record.
      - do: "Wait for the run to finish. It takes place on CRMBuilder's online service, so closing the window does not stop it. To reopen it, click Deploy History, then Open progress…."
        see: The status line reading Deployment complete.
      - do: "Record the server's address. The log shows it on the line beginning Server active at. Add it to the CRM administrator item in the vault, as a note headed Server address. Later steps call it SERVER-IP."
    done_when:
      - "The run reads Deployment complete."
      - "The server's address is in the vault."
    check:
      how: The new instance is listed on CRMBuilder's Instances page, with the same address under Droplet IP.
      probe: The app lists the chapter's hosting account through its token and finds the new server.
    if_not:
      - "The run names the stage that failed and keeps what it built. Do not delete anything. The server is billed until the run finishes or the server is deleted."
      - "Failed at Preparing server, and the log mentions Could not get lock: the new server was still setting itself up. Wait five minutes and click Retry. Retry starts again at the stage that failed."
      - "Manual DNS, failed at Waiting for DNS: the record was not seen within 30 minutes. Compare the record at the DNS provider with the status line, character by character, then click Retry."
      - "Deployment complete with verification gaps: the CRM is installed but a check failed. Read the log, and do not go on until the failed check is understood."
      - "Any other failure: click Retry once. If it fails again, stop the build and keep the log."
    goes_wrong: >-
      Not ticking crm-SHORT-LABEL under Extra SSH keys. CRMBuilder's own key never
      leaves its online service, so without the tick nobody can open a command line
      on the server. Also, a run left on CRMBuilder's own tokens builds the server in
      CRMBuilder's hosting account, and nothing says so until someone looks. With
      manual DNS, typing the full address as the record's host: the provider adds the
      domain again, the name the run waits for never appears, and the run fails at
      Waiting for DNS after 30 minutes. Boston's first run did this at Squarespace
      (09-23-26).
    later: unchanged
    status: done-for-real — the August build ran the wizard. The screen labels were read from CRMBuilder's code on 09-23-26 and have not all been seen on screen.
    source: 3-Methods-CRM-Google-Applications.md#9.2

  - id: "9.4"
    name: Confirm the server works
    why: Before anything is copied onto the server, four things must be true. You can open a command line on it, its web address leads to it, its certificate renews by itself, and its CRM version is recorded.
    who: central
    first: ["9.3"]
    needs: [crm_ssh_key, crm_server_ip, crm_base_url]
    produces: [crm_version]
    mode: guided
    actions:
      - do: "Open a command line on the server. Type the line below and press Enter:"
        items:
          - "ssh -i ~/.ssh/crm-SHORT-LABEL root@SERVER-IP"
        see: "A prompt ending root@ followed by the server's name. The first time, it asks whether to continue connecting: type yes and press Enter."
      - do: "List the programs running on the server. Type the line below and press Enter:"
        items:
          - "docker ps --format '{{.Names}}'"
        see:
          - One name is espocrm, the CRM itself. Later steps call it CRM-CONTAINER. If it is named differently, use that name.
          - One name includes letsencrypt or certbot. That is what renews the certificate.
      - do: "Close the command line. Type exit and press Enter."
      - do: "Check that the CRM's address leads to the server. Type the line below and press Enter:"
        items:
          - "dig +short CRM-ADDRESS"
        see: SERVER-IP, and nothing else.
      - do: "Check the certificate's expiry date. Type the line below and press Enter:"
        items:
          - "echo | openssl s_client -connect CRM-ADDRESS:443 -servername CRM-ADDRESS 2>/dev/null | openssl x509 -noout -enddate"
        see: A line beginning notAfter= with a date about ninety days away.
      - do: "Open https://CRM-ADDRESS in a private browser window, and sign in as admin with the password from the vault."
        see: The CRM's home screen, with no certificate warning.
      - do: "Read the CRM's version. Open Administration. The version number is shown on that page. Add it to the CRM administrator item in the vault, as a note headed CRM version."
        see: A version number of 10 or higher.
      - do: "Store the server sign-in key. In the chapter's Operations vault, create an item named CRM server sign-in key, and attach the file ~/.ssh/crm-SHORT-LABEL to it. Share the vault with a second named person."
        see: The item in the vault, and the second person able to open it.
    done_when:
      - "A command runs on the server over the chapter's sign-in key, and the key is in the vault where a second person can open it."
      - "The CRM's address leads to the server."
      - "The CRM loads at its address with no certificate warning, and the certificate renews by itself."
      - "The CRM's version, 10 or higher, is in the vault."
    check:
      how: Each action above showed what it should.
      probe: The app runs one harmless command over the key, looks up the address, reads the certificate's expiry and the CRM's version.
    if_not:
      - "The ssh line asks for a password or says Permission denied: the key was not ticked in step 9.3. Stop the build."
      - "dig shows an address other than SERVER-IP: the record is proxied. In Cloudflare, set the record to DNS only (a grey cloud). At another DNS provider, switch off proxy or forwarding."
      - "No letsencrypt or certbot program is running: the certificate will not renew. Stop the build."
      - "A version below 10: something other than CRMBuilder installed the CRM. Stop the build."
    goes_wrong: >-
      A proxied record, shown as an orange cloud in Cloudflare. The certificate is
      issued by a direct check against the server, and the proxy blocks it. Also, the
      sign-in key left on one person's laptop only.
    later: The deployment tool writes the key to the chapter's vault itself.
    status: done-for-real — except storing the key in a vault, which did not exist in August.
    source: 3-Methods-CRM-Google-Applications.md#9.3 to #9.6

  - id: "9.5"
    name: Install the two paid add-on products
    why: The standard permission roles refer to features inside these two products, and the CRM refuses a whole role that names a missing feature.
    who: central, with the chapter paying for the licences
    first: ["9.1", "9.4"]
    needs: [addon_versions, crm_version]
    produces: []
    mode: guided
    actions:
      - do: "Buy a licence for each product, Advanced Pack and Google Integration, in the chapter's name and paid by the chapter."
      - do: "Download each product's installation file, at the version in the CRM build versions note."
      - do: "In the CRM, open Administration, then Extensions. Upload the first file and click Install. Then do the same with the second."
        see: Both products listed as installed, at the versions in the note.
    done_when:
      - "Both products are installed at the versions in the CRM build versions note."
      - "Both are licensed to this chapter."
    note: "They must be installed before step 9.7, because the roles that step creates refer to them."
    check:
      how: Both appear under Administration, then Extensions, at the right versions.
      probe: The app reads the CRM's installed products and compares them with the standard.
    if_not: If the CRM refuses a file, check that its version supports the CRM version recorded in step 9.4.
    goes_wrong: >-
      Installing them after step 9.7 instead of before. The CRM then refuses every
      role that names one of their features, and the run finishes half done.
    later: unchanged — these are paid products and cannot be copied between chapters.
    status: not-yet-tried — the August build did not install them, which is how the failure was found.
    source: 3-Methods-CRM-Google-Applications.md#9.7

  - id: "9.6"
    name: Copy the standard configuration onto the server
    why: The standard's record types, fields, links, screen layouts and rules arrive as two folders of files, copied from Cleveland's test system, and the CRM must be rebuilt to take them in.
    who: central
    first: ["9.4", "9.5"]
    needs: [standard_release]
    produces: []
    mode: automated
    actions:
      - do: "Find the two configuration folders on Cleveland's test system, at 104.131.45.208. Type the line below and press Enter:"
        items:
          - "ssh root@104.131.45.208 \"find /var/www/espocrm -type d \\( -path '*Espo/Custom' -o -path '*client/custom/src' \\) -not -path '*/vendor/*'\""
        see: "Two folder paths. The one ending Espo/Custom holds the configuration; later actions call it SOURCE-CONFIG. The one ending client/custom/src holds the screen code; later actions call it SOURCE-SCREEN-CODE."
      - do: "Find the same two folders on the new server. Type the line below and press Enter:"
        items:
          - "ssh -i ~/.ssh/crm-SHORT-LABEL root@SERVER-IP \"find / -type d \\( -path '*Espo/Custom' -o -path '*custom/src' \\) -path '*espocrm*' 2>/dev/null\""
        see: "Two folder paths. Later actions call the Espo/Custom one TARGET-CONFIG and the custom/src one TARGET-SCREEN-CODE. If only one appears, stop the build."
      - do: "Copy both folders from the test system to the build computer. Type each line below and press Enter:"
        items:
          - "mkdir -p ~/cbm-standard/config ~/cbm-standard/screen-code"
          - "rsync -a root@104.131.45.208:SOURCE-CONFIG/ ~/cbm-standard/config/"
          - "rsync -a root@104.131.45.208:SOURCE-SCREEN-CODE/ ~/cbm-standard/screen-code/"
        see: Each line returning to the prompt with no error.
      - do: "Copy both folders from the build computer to the new server. Type each line below and press Enter:"
        items:
          - "rsync -a -e 'ssh -i ~/.ssh/crm-SHORT-LABEL' ~/cbm-standard/config/ root@SERVER-IP:TARGET-CONFIG/"
          - "rsync -a -e 'ssh -i ~/.ssh/crm-SHORT-LABEL' ~/cbm-standard/screen-code/ root@SERVER-IP:TARGET-SCREEN-CODE/"
        see: Each line returning to the prompt with no error.
      - do: "Give both folders to the web server's user, number 33. Type the line below and press Enter:"
        items:
          - "ssh -i ~/.ssh/crm-SHORT-LABEL root@SERVER-IP \"chown -R 33:33 TARGET-CONFIG TARGET-SCREEN-CODE\""
      - do: "Rebuild the CRM. Type the line below and press Enter:"
        items:
          - "ssh -i ~/.ssh/crm-SHORT-LABEL root@SERVER-IP \"docker exec -u www-data CRM-CONTAINER php command.php rebuild\""
        see: The line returning with no error, in a few seconds.
      - do: "Delete the copies on the build computer. Type the line below and press Enter:"
        items:
          - "rm -rf ~/cbm-standard"
      - do: "Reload the CRM in the browser."
        see: The normal working screen, with the navigation bar across the top.
    done_when:
      - "Both folders are on the server and owned by the web server's user."
      - "The rebuild finished without errors."
      - "The CRM shows its normal working screen."
    note: "There are two folders, not one."
    check:
      how: The CRM's navigation bar and home screen appear.
      probe: The app runs the rebuild and reads its result.
    if_not:
      - "A blank page: the screen code folder is missing. Copy it again, give it to user 33, rebuild, and reload."
      - "An error from the rebuild: stop the build and keep the error."
    goes_wrong: >-
      Copying only one of the two folders. The applications still work, but the
      CRM's own screen is blank. Also, Cleveland's test system changes under the
      applications, so two chapters built a week apart can get different
      configurations until the standard is versioned (work list item 15).
    later: The configuration is packaged, versioned and applied by the applier (work list item 15) rather than copied.
    status: done-for-real
    source: 3-Methods-CRM-Google-Applications.md#9.8 and #9.9

  - id: "9.7"
    name: Apply the standard with one script
    why: One script creates the teams, the permission roles, the email templates, the CRM's own settings and two accounts, and reads each one back to prove it.
    who: central
    first: ["9.6", "6.7"]
    needs: [standard_release, chapter_name, crm_application_name, crm_outbound_from_name, crm_outbound_from_address, crm_base_url, crm_logo_file, timezone, currency, locale, docs_site_url]
    produces: [ESPO_API_KEY, ESPO_PROVISION_USERNAME, ESPO_PROVISION_PASSWORD]
    mode: automated
    actions:
      - do: "Go to the client intake software's folder. Type the line below and press Enter:"
        items:
          - "cd ~/Dropbox/Projects/cbm-client-intake"
      - do: "Run the script without changing anything, to see what it would do. Type the line below and press Enter:"
        items:
          - "uv run python scripts/rehearsal/apply_api_half.py --env ~/.config/cbm-SHORT-LABEL/SHORT-LABEL.env --values prds/chapter-network/chapters/SHORT-LABEL-values.yaml"
        see:
          - Nine teams
          - Twelve permission roles
          - Each role attached to its team
          - The email templates
          - The CRM's settings, including the tab bar and the chapter's documentation link
          - Two accounts, customapps and SHORT-LABEL.provision
      - do: "Run it for real. Type the line below and press Enter:"
        items:
          - "uv run python scripts/rehearsal/apply_api_half.py --env ~/.config/cbm-SHORT-LABEL/SHORT-LABEL.env --values prds/chapter-network/chapters/SHORT-LABEL-values.yaml --apply"
        see: "Each item reported applied and read back identical. Three new lines at the end of CHAPTER-ENV-FILE: ESPO_API_KEY, ESPO_PROVISION_USERNAME and ESPO_PROVISION_PASSWORD. Lines marked unapplyable are explained under If it didn't work."
      - do: "Give the Client Assignment Role the permission it needs to assign a mentor: read all users and edit its own user. The roles captured on 31 August do not include it. First see what would change. Type the line below and press Enter:"
        items:
          - "uv run --env-file ~/.config/cbm-SHORT-LABEL/SHORT-LABEL.env python scripts/migrate_client_assignment_role.py"
        see: A plan to raise Client Assignment Role, User, to read all and edit own.
      - do: "Apply it. Type the line below and press Enter:"
        items:
          - "uv run --env-file ~/.config/cbm-SHORT-LABEL/SHORT-LABEL.env python scripts/migrate_client_assignment_role.py --apply"
        see: The permission reported applied.
      - do: "Put the new secrets in the chapter's Operations vault, as three items:"
        items:
          - "CRM build settings: the whole of CHAPTER-ENV-FILE"
          - "CRM key for the applications: the value after ESPO_API_KEY="
          - "CRM provisioning administrator: the values after ESPO_PROVISION_USERNAME= and ESPO_PROVISION_PASSWORD="
      - do: "Test the applications' key. Type the line below and press Enter, with the key in place of CRM-KEY:"
        items:
          - "curl -s -o /dev/null -w '%{http_code}\\n' -H 'X-Api-Key: CRM-KEY' https://CRM-ADDRESS/api/v1/CMentorProfile?maxSize=1"
        see: "200"
      - do: "Test the provisioning administrator. Sign in at https://CRM-ADDRESS with its name and password from the vault, then sign out."
        see: The CRM's home screen, with Administration in the menu.
      - do: "Look over the result in the CRM, signed in as admin:"
        items:
          - "Administration, then Teams: every team shows a role."
          - "Email Templates: the templates are listed."
          - "The documentation tab in the tab bar: it opens this chapter's help documentation, not Cleveland's."
    done_when:
      - "The script reports every team, role, attachment, template, setting and account applied and read back identical, apart from the expected leftovers described under If it didn't work."
      - "The Client Assignment Role can read all users."
      - "The applications' key answers a test request, and is in the vault."
      - "The provisioning administrator signs in, and its password is in the vault."
      - "Every team carries a role."
    check:
      how: Each test above showed what it should.
      probe: The conformance check compares teams, roles, templates and settings with the standard, and the app makes one read request with the key.
    if_not:
      - "Exit 4 with only roleField lines, such as Standard User: Account.cCompanyPartnerProfile: a finished run. Those lines name fields Cleveland's test system has since deleted, and leaving them out is correct."
      - "A roleScope line: an add-on product is missing. Do step 9.5, then run the script for real again. It skips what it already made."
      - "curl shows 401: the key was copied wrong. Copy it again from CHAPTER-ENV-FILE. curl shows 403: a permission is missing. Run the script for real again and read its unapplyable lines."
      - "A team with no role: run the script for real again. If the team is still empty, stop the build."
    goes_wrong: >-
      Creating, renaming or editing anything here by hand. Each application page
      looks for an exact team name, and a team with no role gives its members
      nothing. Neither shows an error: the feature behind it just shows nothing.
      The email templates carry no chapter name on purpose and stay identical.
    later: The same work moves inside the applier, with the same checks.
    status: done-for-real — except the Client Assignment Role permission, added after the August build.
    source: 3-Methods-CRM-Google-Applications.md#9.10 to #9.18

  - id: "9.8"
    name: Stamp the configuration version
    why: The applications report which version of the standard their CRM holds, and they read it from a record this step creates.
    who: central
    first: ["9.7"]
    needs: [ESPO_API_KEY]
    produces: []
    mode: automated
    actions:
      - do: "In the client intake software's folder, see what the stamp would be. Type the line below and press Enter:"
        items:
          - "uv run --env-file ~/.config/cbm-SHORT-LABEL/SHORT-LABEL.env python scripts/build_networkstandard.py"
        see: A plan, and a line giving its fingerprint of sixteen letters and numbers. The next action calls it FINGERPRINT.
      - do: "Create the record. Type the line below and press Enter:"
        items:
          - "uv run --env-file ~/.config/cbm-SHORT-LABEL/SHORT-LABEL.env python scripts/build_networkstandard.py --apply --production --expect FINGERPRINT"
        see: The record created, and read back with the applications' key.
    done_when: The record exists, and the applications' key can read it.
    check:
      how: The script reports the record read back.
      probe: The app reads the record with the applications' key.
    if_not: If it says the plan moved, run the first line again and use the new fingerprint.
    goes_wrong: >-
      Stamping a CRM that step 9.7 did not finish. A CRM claiming a version it does
      not hold is worse than one claiming nothing. Also, running the script without
      --env-file: it then falls back to the settings of Cleveland's test system.
    later: The applier writes the record itself, and only after a completely successful run.
    status: done-for-real
    source: 3-Methods-CRM-Google-Applications.md#9.19

  - id: "9.9"
    name: Run the checking tool
    why: This is the proof that the chapter's CRM matches the standard, and so that the next release of the software will work on it.
    who: central
    first: ["9.8"]
    needs: [ESPO_API_KEY]
    produces: []
    mode: automated
    actions:
      - do: "In the client intake software's folder, run the check and read its report. Type the line below and press Enter:"
        items:
          - "uv run --env-file ~/.config/cbm-SHORT-LABEL/SHORT-LABEL.env sh -c 'python scripts/preflight_crm.py --url \"$ESPO_ADMIN_BASE\" --key \"$ESPO_API_KEY\"'"
        see: "A last line beginning RESULT:. Today the expected result is DRIFT, listing only the five missing event email templates."
      - do: "Save the result as a file. Type the line below and press Enter:"
        items:
          - "uv run --env-file ~/.config/cbm-SHORT-LABEL/SHORT-LABEL.env sh -c 'python scripts/preflight_crm.py --url \"$ESPO_ADMIN_BASE\" --key \"$ESPO_API_KEY\" --json' > ~/.config/cbm-SHORT-LABEL/preflight.json"
      - do: "Attach ~/.config/cbm-SHORT-LABEL/preflight.json to the CRM build settings item in the vault."
      - do: "Write each difference that is allowed on purpose, with its reason, in the chapter's entry in the list of watched systems (step 12.5)."
    done_when: The checking tool reports that the CRM matches the standard, apart from differences that are written down with their reasons.
    check:
      how: The report lists nothing that is not written down in the list of watched systems.
      probe: The app runs the conformance check and shows its result.
    if_not:
      - "RESULT: DRIFT with anything other than the five event email templates: go back to the step that makes the missing item, usually step 9.7, and run it again."
      - "RESULT: UNCHECKED: the tool could not reach the CRM or its key was refused. Check the address and key in CHAPTER-ENV-FILE."
    goes_wrong: >-
      Running the tool without --env-file. It then checks Cleveland's test system
      instead of the chapter's CRM, and reports on the wrong system.
    later: The same check runs before every release and refuses a CRM that does not match.
    status: done-for-real — with the event template difference.
    source: 3-Methods-CRM-Google-Applications.md#9.20

changes:
  - version: "0.11"
    date: "09-23-26 20:40"
    change: >-
      Rewritten and renumbered from twenty steps to nine (Doug, 09-23-26: the stage was
      terribly hard to understand and use). The old step list hid the work: step 9.10
      ran one script that did seven steps, and six steps said only "nothing extra to
      run". Old to new: 9.1 → 9.1; 9.2 → 9.2 (the key, the password and the settings
      file) and 9.3 (the wizard); 9.3, 9.4, 9.5 and 9.6 → 9.4; 9.7 → 9.5; 9.8 and
      9.9 → 9.6; 9.10 to 9.15, 9.17 and 9.18 → 9.7; 9.19 → 9.8; 9.20 → 9.9. Step
      9.16, which could not be done, moved to a list of what is still owed at the top
      of the stage, with the missing event templates and the unruled server size. The
      wizard's Cloudflare and manual DNS screens are written as separate actions. The
      settings file is made before the wizard, so the password rule is stated once.
      Scripts read the settings file through uv's --env-file rather than a shell
      pipeline. The manual DNS record's host is now only the first part of the CRM's
      address, from Boston's first run at Squarespace (a fix from the CRMBuilder
      session, 09-23-26). Each failure case has its own line. The August build's history moved
      out of the actions; it stays in 3-Methods-CRM-Google-Applications.md, which
      keeps the old numbers.
  - version: "0.10"
    date: "09-23-26 14:27"
    change: >-
      The placeholder CHAPTER-SLUG is now SHORT-LABEL, the form's own name for it (Doug, 09-23-26: slug is a terrible name for a user). The guide's index lists every shared placeholder.
  - version: "0.9"
    date: "09-23-26 13:54"
    change: >-
      Manual DNS added (Doug, 09-23-26): CRMBuilder's wizard now asks on its first page whether the
      CRM's address is managed through Cloudflare or by hand at the chapter's own DNS provider. Step 9.2
      chooses from the DNS provider item in the vault, fills in the CRM address box that manual DNS
      shows, and adds the A record by hand when the run shows it; its failure advice covers the
      30-minute wait and Retry. Step 9.5 checks the record at the chapter's DNS provider. Screen labels
      read from CRMBuilder's code (commit 7b1a5062); the first page's DNS list was seen on screen by
      Doug on 09-23-26.
  - version: "0.8"
    date: "09-23-26 13:51"
    change: >-
      Step 9.2 rewritten in executive register (Doug, 09-23-26: it said "this computer" without saying which). It names the build computer, the central support organization's own computer with CRMBuilder installed, and uses that name for every command; defines an SSH key at first use; gives the change of folder its own action; and moves explanations out of the actions into what the reader should see. Step 9.8's two "this computer" now say the build computer.
  - version: "0.7"
    date: "09-23-26 13:41"
    change: >-
      Steps 9.1 and 9.3 brought in line with the ruling that a new chapter runs the current CRM release and Cleveland moves up later (Doug, 09-23-26). Step 9.1 writes down "the current release CRMBuilder installs" rather than Cleveland's version, and checks each add-on supports version 10. Step 9.3 records the exact number instead of comparing it, since CRMBuilder cannot install any other. Both finishing tests changed with the step list (version 0.18).
  - version: "0.6"
    date: "09-23-26 13:39"
    change: >-
      Step 9.2 points to step 5.8 for the chapter's engagement, which 5.8 now creates, instead of stopping to ask.
  - version: "0.5"
    date: "09-23-26 13:35"
    change: >-
      Step 9.2 rewritten click by click from CRMBuilder's deploy wizard (Doug, 09-23-26: the step was not clear). Named every screen, box and stage, and three facts the old text hid: CRMBuilder's own sign-in key never leaves its service, so the key ticked under Extra SSH keys must first be made and added to the chapter's DigitalOcean account; the wizard's Generate button can put - or _ in the password, which step 9.10 cannot take; and a Preparing server failure on a fast run is cured by Retry. Step 9.4 now names that key.
  - version: "0.4"
    date: "09-23-26 00:55"
    change: >-
      Step 9.11 now runs scripts/migrate_client_assignment_role.py. The roles captured on 31 August give the Client Assignment Role no User permission, so a client administrator on that team alone was refused on Assign (ruled 09-07-26). Its If it didn't work now tells an expected exit 4 (a field the source deleted) from a real one (an add-on missing); the old advice to install the add-ons and run again never ended. Found in the review before the first real chapter.
  - version: "0.3"
    date: "09-19-26 00:50"
    change: >-
      The script now reads the chapter's name, CRM settings and provisioning account (SHORT-LABEL.provision) from the chapter information form through --values; the step that edited Lakeside's name out of the script by hand is gone.
  - version: "0.2"
    date: "09-19-26 00:07"
    change: >-
      Every command-line action made exact (Doug, 09-19-26: sweep every step): the ssh, docker, find, rsync, chown and rebuild commands for copying the configuration; the trial scripts' exact options, including the name the provisioning account takes and the production option the version record needs; the test request for the applications' key; and the conformance check with its exit codes. Two traps written in: the scripts fill missing values from the repository's own settings, which are Cleveland's, and the settings file's password must be letters and numbers only.
  - version: "0.1"
    date: "09-18-26 17:05"
    change: >-
      First version as data, converted from the methods for building the CRM
      (3-Methods-CRM-Google-Applications.md, version 0.5) with the step list's
      finishing tests. Numbered actions, a reason per step, and a check an app can
      run were added.
