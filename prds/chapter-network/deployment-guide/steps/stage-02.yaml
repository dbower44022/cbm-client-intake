stage: 2
name: Sign the agreement with the central support organization
version: "0.3"
updated: "09-23-26 13:54"
why: >-
  Everything after this stage involves one organization spending money and
  holding administrative access inside another organization's accounts. The
  agreement sets out what the central support organization does, what it costs,
  the rule that every chapter runs identical software, what access is held, and
  what the chapter takes if it leaves. The stage ends by setting up the chapter's
  password vault, so every account created from stage 3 onward has a safe home.
who: >-
  The chapter's board and the central support organization together.
time: >-
  Not known yet. A draft of the standard agreement exists and is in review
  (09-18-26).
before_you_start:
  - The chapter's board, bylaws and named signers (step 1.4)
  - The person who acts for the chapter during setup (step 1.7)
unlocks: >-
  The chapter's domain names can be registered (stage 3), and every account
  created from then on goes into the chapter's vault.
steps:
  - id: "2.1"
    name: Agree what the central support organization does
    why: The chapter needs to know what it will get, what it will not, and how to ask for help, before it relies on anyone.
    who: both
    first: ["1.7"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: "Open the standard agreement's schedule of services. A draft of the standard agreement exists and is in review; until it is final, the central support organization supplies the current draft. Check the schedule says what is provided:"
        items:
          - Building and running the CRM and the applications.
          - The weekly software release.
          - Support.
      - do: "Check the schedule says what is not provided:"
        items:
          - The chapter's legal, tax and banking work.
          - Its website's content.
          - Its own training beyond the first sessions.
      - do: "Check the schedule says how requests are made. All three kinds go into one ClickUp system, managed by the whole support team:"
        items:
          - Feature requests.
          - Defect reports.
          - Support requests.
      - do: "Check the schedule says how requests are answered:"
        items:
          - No response time is committed.
          - No request is treated as urgent.
          - Everyday requests, such as adding a person or resetting a password, are handled as they arrive.
          - Feature requests and defects are reviewed and scheduled by the central committee every two weeks.
      - do: Give the chapter's board a copy of the schedule.
        see: The board's copy, with the four checks above all present.
    done_when:
      - "The chapter has in writing the list of what is provided."
      - "The chapter has in writing what is not provided."
      - "The chapter has in writing how quickly ordinary requests are answered."
    check:
      how: The chapter can answer, from the document, "who do I ask to add a new staff member, and how is it handled?"
      probe: none
    goes_wrong: >-
      Slow answers to everyday requests. A chapter that waits too long asks for its
      own administrator account, and granting one ends the identical-software rule.
    later: A standard schedule attached to every chapter's agreement.
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#2.1

  - id: "2.2"
    name: Agree the cost
    why: The chapter's treasurer must know every recurring cost and who it is paid to, so the budget has no surprises.
    who: both
    first: ["2.1"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: "Make a cost sheet with one line per supplier. Look up each current price on the supplier's own page on the day the sheet is made, and write the date beside it. Prices change, so this guide does not state them:"
        items:
          - "Hosting: DigitalOcean, https://www.digitalocean.com/pricing/droplets. One server for the CRM, plus the application and its managed database."
          - "Google Workspace: https://www.google.com/nonprofits/offerings/workspace/. Nonprofits may get it free or discounted once step 4.13 is approved."
          - "Domain names: the registrar's price for each name per year. Cleveland uses Porkbun, https://porkbun.com/products/domains."
          - "Cloudflare: the free plan, https://www.cloudflare.com/plans/. No cost unless a paid plan is ever needed. A chapter that keeps its own DNS provider (manual DNS, step 3.7) writes that provider's price instead, often included with the domain name."
          - "Proton Pass: Pass Professional, https://proton.me/business/pass. Priced per user per month, with a minimum of three users. Professional is the plan that includes the command-line tool the settings generator needs."
          - "Zoom: only for a chapter that runs public webinars (step 5.5)."
      - do: "Add one line for the fee paid to the central support organization. The amount comes from the standard agreement. It is proposed, not ruled, that the fee covers labour only."
      - do: "Add one line marked \"open\" for the two paid CRM add-on products. Whether they are part of the standard is not decided (work list item 2). Do not quote a total without saying this line is open."
      - do: Have the chapter's treasurer and the central support organization both initial the cost sheet.
        see: A cost sheet with every line priced or marked open, dated and initialled by both.
    done_when: >-
      The fee is agreed in writing, and it is clear which costs the chapter pays
      directly to other companies rather than through the fee.
    check:
      how: The chapter's treasurer can name every recurring cost and who it is paid to.
      probe: none
    goes_wrong: >-
      The CRM add-on products. The permission roles depend on two paid products that a
      chapter would have to license, and whether they are part of the standard is still
      open.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#2.2

  - id: "2.3"
    name: Accept the identical-software rule
    why: One release works for every chapter only if every chapter runs the same software, with no local additions.
    who: both — the central support organization explains, the chapter's board accepts
    first: ["2.1"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: "Send the board this rule in writing, as a page of its own: \"Core or nothing. A change a chapter wants becomes part of the software for every chapter, or it does not happen. No chapter gets its own custom fields, form questions or list choices. There is no third answer.\""
      - do: "Show the board how to raise a feature request in the ClickUp system, and that the central committee reviews and schedules feature requests every two weeks."
      - do: "At its next meeting, the board minutes a resolution in words like these: \"The board has read the identical-software rule and accepts it. Any change the chapter wants will be raised as a feature request for every chapter.\""
        see: The signed minute.
      - do: Send a copy of the minute to the central support organization.
    done_when: >-
      The chapter's board has been told in writing that no chapter gets its own
      custom fields, form questions or list choices, and has been shown how to ask for
      a change that would apply to every chapter.
    check:
      how: The board minutes record that the rule was read and accepted.
      probe: none
    goes_wrong: >-
      A promise made in conversation that one field can be added "just for you". The
      first exception ends the rule for everyone.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#2.3

  - id: "2.4"
    name: Agree the access the central support organization will hold
    why: The central support organization works inside the chapter's accounts, so the chapter must know which ones, and that it can withdraw that access.
    who: both
    first: ["2.1"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: "Write an access schedule into the agreement, one line per account, naming the access each account gives the central support organization and the step that grants it:"
        items:
          - "The hosting account (DigitalOcean): a team member able to create and manage resources. Granted in step 5.4."
          - "The Cloudflare account, or with manual DNS the chapter's DNS provider account: a member able to edit DNS. Granted in step 3.7."
          - "Google Workspace: an administrator account of the central support organization's own. Created in step 4.6."
          - "The video meeting account (Zoom), if there is one: an administrator. Granted in step 5.5."
          - "The chapter's vault (Proton Pass): a member of the Operations vault only, never the Board vault. Granted in step 2.7."
          - "The CRM: the only administrator accounts. Created in steps 9.2 and 9.18."
      - do: "Write in the rule: the central support organization holds the only CRM administrator accounts, and chapter staff hold ordinary accounts."
      - do: "Write in the other half of the rule: the chapter can always get in through the server it owns, and can withdraw the central support organization's access to any account at any time, by removing its members."
    done_when: >-
      It is written down which of the chapter's accounts the central support
      organization will administer, and that the chapter may withdraw that access at
      any time.
    check:
      how: The list is in the agreement, and each account on it has a named later step that grants the access.
      probe: none
    goes_wrong: >-
      Promising emergency access with no written way to use it. The emergency access
      procedure is on the work list (item 5).
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#2.4

  - id: "2.5"
    name: Agree the leaving terms
    why: A chapter must be able to leave with all its data, and the central support organization must never be able to lock it out.
    who: both
    first: ["2.4"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: "Write the notice period into the agreement as a number of days, for example 90. The standard agreement sets the number; the draft is in review."
      - do: "Write in the wind-down: what the central support organization keeps doing during the notice period (the weekly release, backups and support) and what stops on the last day."
      - do: "Write in the leaving kit, with who produces each part:"
        items:
          - "A copy of the CRM's database. Produced by the central support organization."
          - "An export of the application's own database. Produced by the central support organization."
          - "A transfer of the chapter's documents in Google Drive. Nothing to produce: they are already in the chapter's own Google Workspace."
          - "The chapter's own files, such as its logo and colour file. Produced by the central support organization."
      - do: Write in a perpetual licence to the last version of the software the chapter received.
      - do: Write in that the central support organization may stop working for a chapter that stops paying, but can never lock it out.
    done_when:
      - "The notice period is written into the agreement."
      - "The wind-down is written into the agreement."
      - "The list of everything the chapter takes with it is written into the agreement."
    check:
      how: Each item in the leaving kit names what it is and who produces it.
      probe: none
    goes_wrong: >-
      Leaving out the application's own database. Some of the chapter's records live
      only there. The partner and funder discussion notes are there. So is the full
      history of every submission. So are any analytics pages the chapter built.
    later: unchanged
    status: not-yet-tried — the leaving procedure has never been rehearsed either.
    source: 8-Methods-Organization-Domains-Google.md#2.5

  - id: "2.6"
    name: Sign the agreement
    why: Nothing after this stage should happen inside the chapter's accounts without a signed agreement.
    who: both
    first: ["2.1", "2.2", "2.3", "2.4", "2.5", "1.4"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: "Check the final agreement includes all four attachments:"
        items:
          - The schedule of services (step 2.1).
          - The cost sheet (step 2.2).
          - The access schedule (step 2.4).
          - The leaving terms (step 2.5).
      - do: The officers the board minute names as signers (step 1.4) sign for the chapter, with the date. An authorised person signs for the central support organization.
      - do: "Save the signed copy as a PDF named \"YYYY-MM-DD agreement with the central support organization.pdf\" in a place at least two chapter officers can reach, and send the central support organization its copy."
        see: Both sides holding a copy signed and dated by both.
    done_when: >-
      Both sides have signed and each holds a copy.
    check:
      how: Both copies are signed and dated.
      probe: The app records the date the agreement was signed.
    goes_wrong: nothing known yet
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#2.6

  - id: "2.7"
    name: Set up the chapter's password vault
    why: Every sign-in, recovery code and machine secret needs one safe place that the chapter owns and the central support organization can reach.
    who: both — the chapter owns the vault; the central support organization sets it up alongside
    first: ["2.6"]
    needs: []
    produces: [chapter_vault]
    mode: guided
    actions:
      - do: "Open https://proton.me/business/pass and buy Pass Professional in the chapter's name, paid with the chapter's card (step 1.6). Choose Professional, not Essentials: Professional includes the command-line tool the settings generator needs. The plan has a minimum of three users."
        see: A Proton business organization named after the chapter.
      - do: "Sign up the first owner with the founding email address (step 3.1 names it; the chapter has no mailbox of its own until stage 4). Step 4.14 moves the organization's contact address to a chapter mailbox later."
      - do: "In the organization's settings, make two chapter officers administrators of the organization. The exact screen labels have not been checked; look for the organization's user or member settings."
        see: Two chapter officers listed with administrator rights.
      - do: "Create two vaults, spelled exactly:"
        items:
          - "Operations — shared with the central support organization's named people. Every sign-in, recovery code and machine secret the system runs on goes here."
          - "Board — kept to the chapter, for anything the central support organization has no need to see."
      - do: "Invite at least two named people from the central support organization as members of the Operations vault only, with the editor role (able to add and change items, not to manage sharing)."
        see: Their names listed as members of the Operations vault, and not of the Board vault.
      - do: Turn on two-step sign-in for every chapter owner, and store each owner's Proton recovery phrase in that owner's own safekeeping, not in the vault it unlocks.
    done_when: >-
      The chapter owns a Proton Pass business organization with at least two chapter
      owners, and at least two named people from the central support organization are
      members of its shared operations vault (ruled 09-18-26).
    check:
      how: A second chapter owner and a second central member each sign in and open the Operations vault without help.
      probe: The app reads the Operations vault's member list through Proton Pass's command-line tool and counts the owners and central members.
    goes_wrong: >-
      A vault owned by the central support organization instead of the chapter. The
      chapter could then lose access to its own credentials in a dispute. Also, from
      stage 3 on, every account must go into the vault the moment it is created, not
      gathered up afterwards. Use named sign-ins wherever a system allows; the vault
      holds only what cannot belong to one person.
    later: The settings generator reads the machine secrets straight from the vault with Proton Pass's command-line tool.
    status: not-yet-tried — Proton Pass chosen on 09-18-26.
    source: 8-Methods-Organization-Domains-Google.md#2.7

