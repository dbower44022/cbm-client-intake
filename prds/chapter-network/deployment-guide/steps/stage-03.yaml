stage: 3
name: Register the chapter's domain names
version: "0.1"
updated: "09-18-26 17:20"
why: >-
  Every address the chapter uses hangs off its domain names: its email, its
  website, its CRM and its applications. This stage buys them in the chapter's
  name, protects the account that holds them, and moves their DNS to Cloudflare,
  the only DNS provider CRMBuilder can build with. Losing the account that holds
  the domain names loses the chapter's email and website together.
who: >-
  The chapter's setup contact, with the central support organization for the
  Cloudflare step.
time: >-
  About an hour of work. A change of name servers can take up to a day to be seen
  everywhere.
before_you_start:
  - The chapter's name (step 1.1) and bank account (step 1.6)
  - The person who acts for the chapter during setup (step 1.7)
  - The chapter's vault (step 2.7)
unlocks: >-
  Google Workspace and the chapter's email can be set up on the domain (stage 4).
steps:
  - id: "3.1"
    name: Choose the founding email address used for setup
    why: The chapter has no email of its own until stage 4, so the first accounts must be opened with someone's existing address, and everyone must know it is temporary.
    who: chapter — the setup contact
    first: ["1.7"]
    needs: []
    produces: [founding_email]
    mode: offline
    actions:
      - do: Use the setup contact's own existing email address.
      - do: Write down the address, the person's name, and that the address is temporary. Step 4.14 replaces it.
    done_when: >-
      One named person's existing working email address is recorded as the address
      that will create the first accounts, and it is understood that this is
      temporary.
    check:
      how: The address and the person's name are written down, marked temporary.
      probe: The app records the founding address and flags it until step 4.14 replaces it.
    goes_wrong: >-
      Forgetting the address is temporary. The domain names then stay tied to one
      volunteer's personal email for years.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#3.1

  - id: "3.2"
    name: Decide how many domain names the chapter needs, and choose them
    why: The email domain name becomes part of every mentor's address for good, so it has to be chosen deliberately.
    who: chapter, advised by the central support organization
    first: ["1.1"]
    needs: [chapter_name]
    produces: [primary_domain, website_domain, mentor_email_domain]
    mode: guided
    actions:
      - do: "Explain both choices to the chapter. Cleveland uses two domain names: one for the public website, and a second, shorter one for email addresses and mentor logins. One domain name for everything is simpler, but ties the email addresses to the marketing name for good. Whether a chapter needs one or two is an open question in the plan."
      - do: Record which the chapter chose.
      - do: Choose the names. The CRM and the applications get names under a domain the chapter owns, such as crm. and apps., not new domain names.
      - do: Search a domain registrar for each chosen name.
        see: Each name shown as available.
    done_when: >-
      The names are chosen and confirmed available. See the open question in the
      plan document about whether a chapter needs one domain name or two.
    check:
      how: The chosen names are written down, and a registrar's search shows each one available.
      probe: The app checks that each chosen name is still unregistered.
    goes_wrong: >-
      A long email domain name. Every mentor's address is their first and last name at
      that domain name, so a long domain name makes long addresses.
    later: The plan's open question is ruled, and this step states the answer.
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#3.2

  - id: "3.3"
    name: Create the domain registrar account
    why: The domain names must sit in an account that belongs to the chapter, not to a person.
    who: chapter — the setup contact
    first: ["3.1", "3.2"]
    needs: [founding_email, chapter_name]
    produces: []
    mode: guided
    actions:
      - do: Open an account at an ordinary domain registrar.
      - do: Enter the chapter's legal name as the account holder, not the setup contact's own name.
      - do: Use the founding email address from step 3.1.
      - do: Put the sign-in in the chapter's vault, in the Operations vault.
        see: The registrar's account page shows the chapter's legal name.
    done_when:
      - "The account exists."
      - "The account is in the chapter's name."
      - "The account uses the founding email address."
    check:
      how: The registrar's account page shows the chapter's legal name.
      probe: none
    goes_wrong: >-
      An account in a person's own name. If that person leaves, the registrar may
      refuse to hand the domain names to the chapter.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#3.3

  - id: "3.4"
    name: Register and pay for the domain names
    why: The domain names must be bought in the chapter's name and paid for by the chapter, so they do not lapse when one person's card expires.
    who: chapter — the setup contact
    first: ["3.3", "1.6"]
    needs: [primary_domain, website_domain]
    produces: []
    mode: guided
    actions:
      - do: Register each domain name chosen in step 3.2, for at least a year.
      - do: Pay with the chapter's own payment card, not a personal one.
      - do: Look up the ownership of each domain name.
        see: The chapter as the registrant. If the registrar hides the owner behind a privacy service, the registrar's own account page is the check.
    done_when: >-
      A public ownership lookup returns the chapter as the registrant, and the
      registration runs at least a year ahead.
    check:
      how: An ownership lookup, or the registrar's account page, shows the chapter as registrant and an expiry date at least a year ahead.
      probe: The app looks up each domain name's registration and reads its expiry date.
    goes_wrong: >-
      Paying with a personal card. When that card expires, the renewal fails, and
      nobody at the chapter is told.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#3.4

  - id: "3.5"
    name: Turn on automatic renewal
    why: A lapsed domain name stops the chapter's email, website, CRM and applications all at once.
    who: chapter — the setup contact
    first: ["3.4"]
    needs: []
    produces: []
    mode: guided
    actions:
      - do: In the registrar account, turn on automatic renewal for every domain name.
        see: Each domain name shows automatic renewal as on.
      - do: Check the expiry date of the payment card on file.
    done_when: >-
      Every domain name is set to renew automatically and a working payment method
      is on file.
    check:
      how: Each domain name shows automatic renewal as on, and the card on file is in date.
      probe: The app warns when a domain name's expiry date is under sixty days away.
    goes_wrong: >-
      A lapsed domain name. The chapter's email and website stop together, and so do
      the CRM and the applications, whose addresses are under that domain name.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#3.5

  - id: "3.6"
    name: Turn on two-step sign-in for the registrar account
    why: Whoever signs in to the registrar account controls every address the chapter has.
    who: chapter — the setup contact
    first: ["3.3"]
    needs: [chapter_vault]
    produces: []
    mode: guided
    actions:
      - do: In the registrar account, turn on two-step sign-in.
        see: Signing in now asks for a second step.
      - do: Put the recovery codes in the chapter's vault, where at least two officers can reach them.
    done_when: >-
      Signing in requires a second factor, and the recovery codes are stored where
      more than one person can reach them.
    check:
      how: Signing in asks for the second step, and a second officer can open the recovery codes in the vault.
      probe: The app checks that the vault holds an entry for the registrar's recovery codes.
    goes_wrong: >-
      The second step tied to one person's phone, and the recovery codes held by the
      same person.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#3.6

  - id: "3.7"
    name: Move the domain names' DNS to the chapter's Cloudflare account
    why: CRMBuilder writes the CRM's address into Cloudflare itself, so the chapter's domain names must live in a Cloudflare account the chapter owns.
    who: both — the chapter's setup contact, with the central support organization
    first: ["3.4", "3.6", "2.7"]
    needs: [primary_domain, website_domain, chapter_vault]
    produces: [cloudflare_account]
    mode: guided
    actions:
      - do: Create a Cloudflare account in the chapter's name. The free plan is enough. The chapter has no mailbox of its own yet, so sign up with the founding email address and change it to a chapter mailbox after stage 4, as step 4.14 does for the registrar.
      - do: Add each domain name to the Cloudflare account.
        see: Cloudflare reads the existing records and gives two name servers ending in ns.cloudflare.com.
      - do: In the registrar account, replace the name servers with Cloudflare's two.
      - do: Turn on two-step sign-in in Cloudflare. Put the sign-in and recovery codes in the chapter's vault.
      - do: Invite the central support organization's named people as members of the Cloudflare account.
      - do: Wait for Cloudflare to report each domain name as active. It can take up to a day.
        see: Each domain name shown as active in Cloudflare.
    done_when:
      - "Each domain name is a zone in a Cloudflare account the chapter owns."
      - "The registrar points at Cloudflare's name servers."
      - "Two-step sign-in is on."
      - "The central support organization's named people are members."
      - "The sign-in and recovery codes are in the chapter's vault."
      - "CRMBuilder supports no other DNS provider."
    check:
      how: Cloudflare shows each domain name as active, and a name-server lookup on each domain name returns Cloudflare's two servers.
      probe: The app looks up each domain name's name servers and confirms they are Cloudflare's.
    goes_wrong: >-
      From now on every DNS record is made in Cloudflare, not at the registrar. And
      Cloudflare's proxy must stay off for the CRM and the applications: both addresses
      are "DNS only", with the grey cloud, or their certificates fail to issue or renew.
      The public website can use the proxy; Cleveland's does.
    later: unchanged
    status: not-yet-tried — Cleveland's two domains and the trial chapter's domain are all on Cloudflare this way.
    source: 8-Methods-Organization-Domains-Google.md#3.7

changes:
  - version: "0.1"
    date: "09-18-26 17:20"
    change: >-
      First version as data, converted from the methods for registering the domain
      names (8-Methods-Organization-Domains-Google.md, version 0.5) with the step
      list's finishing tests. Step 3.7 now signs up to Cloudflare with the founding
      address, because the chapter has no mailbox until stage 4.
