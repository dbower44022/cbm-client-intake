stage: 3
name: Register the chapter's domain names
version: "0.2"
updated: "09-19-26 00:35"
why: >-
  Every address the chapter uses hangs off its domain names: its email, its
  website, its CRM and its applications. This stage buys them in the chapter's
  name, protects the account that holds them, and moves their DNS to Cloudflare,
  the only DNS provider CRMBuilder can build with. Losing the account that holds
  the domain names loses the chapter's email and website together.
who: >-
  The chapter's setup contact, with the central support organization for the
  Cloudflare step.
time: >-
  About an hour of work. A change of name servers can take up to a day to be seen
  everywhere.
before_you_start:
  - The chapter's name (step 1.1) and bank account (step 1.6)
  - The person who acts for the chapter during setup (step 1.7)
  - The chapter's vault (step 2.7)
unlocks: >-
  Google Workspace and the chapter's email can be set up on the domain (stage 4).
steps:
  - id: "3.1"
    name: Choose the founding email address used for setup
    why: The chapter has no email of its own until stage 4, so the first accounts must be opened with someone's existing address, and everyone must know it is temporary.
    who: chapter — the setup contact
    first: ["1.7"]
    needs: []
    produces: [founding_email]
    mode: offline
    actions:
      - do: "Use the setup contact's own existing email address. It must be an address the setup contact reads every day, because the registrar, Cloudflare and Proton Pass send their confirmation codes to it."
      - do: "Create an item in the chapter's vault, in the Operations vault, titled \"Founding email address — temporary\", holding:"
        items:
          - The address.
          - The setup contact's name.
          - "The words \"Replace in step 4.14\"."
        see: The item in the Operations vault.
    done_when: >-
      One named person's existing working email address is recorded as the address
      that will create the first accounts, and it is understood that this is
      temporary.
    check:
      how: The address and the person's name are written down, marked temporary.
      probe: The app records the founding address and flags it until step 4.14 replaces it.
    goes_wrong: >-
      Forgetting the address is temporary. The domain names then stay tied to one
      volunteer's personal email for years.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#3.1

  - id: "3.2"
    name: Decide how many domain names the chapter needs, and choose them
    why: The email domain name becomes part of every mentor's address for good, so it has to be chosen deliberately.
    who: chapter, advised by the central support organization
    first: ["1.1"]
    needs: [chapter_name]
    produces: [primary_domain, website_domain, mentor_email_domain]
    mode: guided
    actions:
      - do: "Explain the two choices to the chapter's board. Whether a chapter needs one domain name or two is an open question in the plan:"
        items:
          - "Two domain names, as Cleveland has: one for the public website (clevelandbusinessmentors.org) and a second, shorter one for email and mentor logins (cbmentors.org). Mentors' addresses are short, but there are two names to renew."
          - "One domain name for everything. Simpler and cheaper, but the email addresses are tied to the website's name for good."
      - do: "Write down the choice as three values:"
        items:
          - "The website domain name, for example akronbusinessmentors.org."
          - "The email domain name, for example akronmentors.org. With one domain name, it is the same as the website domain name."
          - "The mentor email domain name. For every chapter so far it is the same as the email domain name."
      - do: "Do not buy separate domain names for the CRM or the applications. They get names under the email or website domain name, created in later steps:"
        items:
          - "crm. for the CRM, for example crm.akronbusinessmentors.org."
          - "apps. for the applications, for example apps.akronbusinessmentors.org."
      - do: Search the registrar the chapter will use for each domain name chosen.
        see: Each name shown as available to register.
    done_when: >-
      The names are chosen and confirmed available. See the open question in the
      plan document about whether a chapter needs one domain name or two.
    check:
      how: The chosen names are written down, and a registrar's search shows each one available.
      probe: The app checks that each chosen name is still unregistered.
    goes_wrong: >-
      A long email domain name. Every mentor's address is their first and last name at
      that domain name, so a long domain name makes long addresses.
    later: The plan's open question is ruled, and this step states the answer.
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#3.2

  - id: "3.3"
    name: Create the domain registrar account
    why: The domain names must sit in an account that belongs to the chapter, not to a person.
    who: chapter — the setup contact
    first: ["3.1", "3.2"]
    needs: [founding_email, chapter_name]
    produces: []
    mode: guided
    actions:
      - do: "Choose the registrar. Any ordinary registrar works, because the domain's DNS moves to Cloudflare in step 3.7. Cleveland uses Porkbun (https://porkbun.com); the trial chapter's domain is at GoDaddy. The actions below were written against Porkbun, and its screen labels have not been checked."
      - do: "Open the registrar's sign-up page and create the account with:"
        items:
          - "Email: the founding email address from step 3.1."
          - "Password: a new random password of at least 20 characters, generated by Proton Pass."
      - do: "In the account's contact or profile details, enter the chapter as the account holder:"
        items:
          - "Organization: the chapter's legal name, exactly as in the stamped articles (step 1.2)."
          - "Name: the setup contact's name, as the person acting for the chapter."
          - "Address: the chapter's registered address."
      - do: "Create an item in the Operations vault titled \"Domain registrar\", holding the registrar's web address, the sign-in email and the password."
        see: The registrar's account page shows the chapter's legal name.
    done_when:
      - "The account exists."
      - "The account is in the chapter's name."
      - "The account uses the founding email address."
    check:
      how: The registrar's account page shows the chapter's legal name.
      probe: none
    goes_wrong: >-
      An account in a person's own name. If that person leaves, the registrar may
      refuse to hand the domain names to the chapter.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#3.3

  - id: "3.4"
    name: Register and pay for the domain names
    why: The domain names must be bought in the chapter's name and paid for by the chapter, so they do not lapse when one person's card expires.
    who: chapter — the setup contact
    first: ["3.3", "1.6"]
    needs: [primary_domain, website_domain]
    produces: []
    mode: guided
    actions:
      - do: "In the registrar account, search for each domain name chosen in step 3.2 and add it to the basket."
      - do: "For each domain name, set:"
        items:
          - "Registration period: at least 1 year. Two or more years lowers the risk of a lapse."
          - "Registrant: the chapter's legal name, from the account's contact details."
          - "Privacy (hiding the owner's details from public lookups): on, if the registrar offers it free. Porkbun does."
      - do: Pay with the chapter's own payment card from step 1.6, not a personal one.
        see: Each domain name listed in the account, with an expiry date at least a year ahead.
      - do: "Check the owner of each domain name in the registrar's domain details."
        see: The chapter as the registrant. With privacy on, a public lookup shows the privacy service instead, so the registrar's own page is the check.
    done_when: >-
      A public ownership lookup returns the chapter as the registrant, and the
      registration runs at least a year ahead.
    check:
      how: An ownership lookup, or the registrar's account page, shows the chapter as registrant and an expiry date at least a year ahead.
      probe: The app looks up each domain name's registration and reads its expiry date.
    goes_wrong: >-
      Paying with a personal card. When that card expires, the renewal fails, and
      nobody at the chapter is told.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#3.4

  - id: "3.5"
    name: Turn on automatic renewal
    why: A lapsed domain name stops the chapter's email, website, CRM and applications all at once.
    who: chapter — the setup contact
    first: ["3.4"]
    needs: []
    produces: []
    mode: guided
    actions:
      - do: "In the registrar account, open the list of domain names. For each one, turn automatic renewal on. The switch is usually labelled auto-renew; the exact label has not been checked."
        see: Each domain name shows automatic renewal as on.
      - do: "Open the account's payment methods and check the chapter's card is the default, and its expiry date is more than a year away."
      - do: Put a reminder in the chapter treasurer's calendar for one month before the card's expiry date, to update the card at the registrar.
    done_when: >-
      Every domain name is set to renew automatically and a working payment method
      is on file.
    check:
      how: Each domain name shows automatic renewal as on, and the card on file is in date.
      probe: The app warns when a domain name's expiry date is under sixty days away.
    goes_wrong: >-
      A lapsed domain name. The chapter's email and website stop together, and so do
      the CRM and the applications, whose addresses are under that domain name.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#3.5

  - id: "3.6"
    name: Turn on two-step sign-in for the registrar account
    why: Whoever signs in to the registrar account controls every address the chapter has.
    who: chapter — the setup contact
    first: ["3.3"]
    needs: [chapter_vault]
    produces: []
    mode: guided
    actions:
      - do: "In the registrar account's security settings, turn on two-step sign-in with an authenticator code, not a text message. Use Proton Pass as the authenticator: add the code to the \"Domain registrar\" item in the Operations vault, so any owner can produce it."
        see: Signing in now asks for a six-digit code, and the vault item shows the same code.
      - do: "Save the recovery codes the registrar shows into the same \"Domain registrar\" item in the Operations vault."
        see: A second chapter officer can open the item and see the recovery codes.
    done_when: >-
      Signing in requires a second factor, and the recovery codes are stored where
      more than one person can reach them.
    check:
      how: Signing in asks for the second step, and a second officer can open the recovery codes in the vault.
      probe: The app checks that the vault holds an entry for the registrar's recovery codes.
    goes_wrong: >-
      The second step tied to one person's phone, and the recovery codes held by the
      same person.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#3.6

  - id: "3.7"
    name: Move the domain names' DNS to the chapter's Cloudflare account
    why: CRMBuilder writes the CRM's address into Cloudflare itself, so the chapter's domain names must live in a Cloudflare account the chapter owns.
    who: both — the chapter's setup contact, with the central support organization
    first: ["3.4", "3.6", "2.7"]
    needs: [primary_domain, website_domain, chapter_vault]
    produces: [cloudflare_account]
    mode: guided
    actions:
      - do: "Open https://dash.cloudflare.com/sign-up and create the account with:"
        items:
          - "Email: the founding email address from step 3.1. Step 4.14 changes it to a chapter mailbox."
          - "Password: a new random password generated by Proton Pass."
      - do: Create an item in the Operations vault titled "Cloudflare", holding the sign-in email and the password.
      - do: "Add each domain name to the account. The button is labelled Add a domain or Onboard a domain, depending on the dashboard's version. Enter the domain name, and choose the Free plan."
        see: Cloudflare lists the DNS records it found at the registrar, and then shows two name servers, each ending in ns.cloudflare.com.
      - do: "Compare Cloudflare's list of records with the registrar's. Any record missing from Cloudflare's list, add in Cloudflare now, or it stops working when the name servers change."
      - do: "In the registrar account, open the domain's name server settings (at Porkbun, the domain's name server details; the exact label has not been checked). Delete the registrar's name servers and enter Cloudflare's two, exactly as Cloudflare shows them."
      - do: "In Cloudflare, open your profile's authentication settings and turn on two-step sign-in with an authenticator code, stored in the \"Cloudflare\" item in the vault. Save Cloudflare's backup codes into the same item."
      - do: "In Cloudflare, open the account's members page and invite each of the central support organization's named people by email, with the Administrator role. The exact page and role names have not been checked."
        see: Each invited person listed as a member once they accept.
      - do: "Wait for Cloudflare to report each domain name as active. It can take up to a day. From a terminal, this command shows the name servers the world sees; put the domain name in place of DOMAIN:"
        items:
          - "dig +short NS DOMAIN"
        see: Cloudflare's two name servers from the command, and each domain name shown as active in Cloudflare.
    done_when:
      - "Each domain name is a zone in a Cloudflare account the chapter owns."
      - "The registrar points at Cloudflare's name servers."
      - "Two-step sign-in is on."
      - "The central support organization's named people are members."
      - "The sign-in and recovery codes are in the chapter's vault."
    note: "CRMBuilder supports no other DNS provider."
    check:
      how: Cloudflare shows each domain name as active, and a name-server lookup on each domain name returns Cloudflare's two servers.
      probe: The app looks up each domain name's name servers and confirms they are Cloudflare's.
    goes_wrong: >-
      From now on every DNS record is made in Cloudflare, not at the registrar. And
      Cloudflare's proxy must stay off for the CRM and the applications: both addresses
      are "DNS only", with the grey cloud, or their certificates fail to issue or renew.
      The public website can use the proxy; Cleveland's does.
    later: unchanged
    status: not-yet-tried — Cleveland's two domains and the trial chapter's domain are all on Cloudflare this way.
    source: 8-Methods-Organization-Domains-Google.md#3.7

changes:
  - version: "0.2"
    date: "09-19-26 00:35"
    change: >-
      Every action made precise (Doug, 09-19-26): what goes in the vault for each
      account and under what title; the registrar account's fields, with Porkbun as
      the worked example (Cleveland's registrar, checked by lookup on 09-19-26); the
      registration settings; an authenticator code held in Proton Pass for two-step
      sign-in; the Cloudflare sign-up, plan, record check, name server change and
      member invitation; and the command that confirms the name servers. Registrar
      and Cloudflare screen labels are not checked, and the steps say so.
  - version: "0.1"
    date: "09-18-26 17:20"
    change: >-
      First version as data, converted from the methods for registering the domain
      names (8-Methods-Organization-Domains-Google.md, version 0.5) with the step
      list's finishing tests. Step 3.7 now signs up to Cloudflare with the founding
      address, because the chapter has no mailbox until stage 4.
