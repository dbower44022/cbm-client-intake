stage: 1
name: Set up the chapter as a legal organization
version: "0.2"
updated: "09-19-26 00:15"
why: >-
  The chapter has to exist in law before it can own accounts, sign an agreement or
  claim nonprofit discounts. This stage creates the organization, names who can act
  for it, and starts the nonprofit application, which is the longest wait in the
  whole guide. The central support organization does not do this work; the chapter
  gets legal, tax and banking advice elsewhere.
who: >-
  The chapter's founding group and board, with their own legal and accounting
  advice.
time: >-
  Weeks to months. Incorporation and the employer identification number are quick.
  Nonprofit tax status typically takes weeks to a few months on the short federal
  form, and several months or longer on the full form.
before_you_start:
  - A founding group that has agreed to form the chapter
unlocks: >-
  The agreement with the central support organization (stage 2) can be signed.
  The nonprofit evidence from this stage is needed later for the Google Workspace
  discount (step 4.13) and the hosting credits (step 5.3).
steps:
  - id: "1.1"
    name: Choose the chapter's name
    why: The name appears on every page the software shows and in the legal filing, so it is chosen once and not revisited.
    who: chapter
    first: []
    needs: []
    produces: [chapter_name]
    mode: offline
    actions:
      - do: "Agree one name as a founding group. Write it down exactly as it will appear everywhere, for example:"
        items:
          - "Akron Business Mentors"
          - "Capital letters exactly as they will be printed"
          - "No abbreviation, unless the abbreviation is the name"
      - do: "Search the state's register of business and nonprofit names. Each state runs its own search, usually through the Secretary of State. Search the web for the state's name followed by \"Secretary of State business search\". For Ohio the search is at https://businesssearch.ohiosos.gov/. Search for:"
        items:
          - The full name.
          - The distinctive word or words in the name on their own, for example "Akron Mentors".
        see: No registered organization with the same or a confusingly similar name. Take a screenshot of the results.
      - do: "Open the United States Patent and Trademark Office's trademark search at https://tmsearch.uspto.gov/ and search for:"
        items:
          - The full name.
          - The distinctive word or words on their own.
        see: No live trademark for the same or a similar name used for mentoring, business advice or education. Take a screenshot of the results.
      - do: "Open the domain registrar the chapter will use (Cleveland uses Porkbun, at https://porkbun.com) and search for each domain name the chapter would want. Step 3.2 explains whether a chapter needs one domain name or two."
        see: Each domain name shown as available to register.
      - do: "Save the three sets of results in one folder, each file named with the search and the date, for example:"
        items:
          - "2026-10-01 state name search.png"
          - "2026-10-01 trademark search.png"
          - "2026-10-01 domain search.png"
    done_when:
      - "The founding group has agreed one name."
      - "A search of state business registrations and trademarks shows no conflict."
      - "The matching domain names are still available to buy."
    check:
      how: All three searches came back clear, and the results are saved with the date.
      probe: The app checks that the domain names are still unregistered.
    if_not: Choose another name and search again. Do not file anything under a name that conflicts. If a result is unclear, the chapter's own adviser decides whether it conflicts.
    goes_wrong: >-
      Changing the name later. The software can change it in one setting, but the
      legal filing, the domain names and the bank account cannot be changed so
      easily.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#1.1

  - id: "1.2"
    name: Incorporate the chapter
    why: A corporation can own accounts and sign agreements in its own name, so nothing depends on one founder.
    who: chapter, with its own legal advice
    first: ["1.1"]
    needs: [chapter_name]
    produces: []
    mode: offline
    actions:
      - do: "Find the state's form for incorporating a nonprofit corporation on the Secretary of State's website. In most states it is called the articles of incorporation for a nonprofit corporation. Ohio's filing is made through the Ohio Secretary of State. The chapter's own adviser confirms the right form for its state."
      - do: "Fill in the form. It usually asks for:"
        items:
          - The chapter's name, exactly as chosen in step 1.1.
          - The name and address of the statutory agent, also called the registered agent, who receives legal papers.
          - The names of the incorporators who sign the form.
          - The organization's purpose.
      - do: "Add two clauses the Internal Revenue Service looks for in step 1.5. The Internal Revenue Service's Publication 557 (https://www.irs.gov/pub/irs-pdf/p557.pdf) gives sample wording for both. The chapter's own adviser confirms the final wording."
        items:
          - "A purpose clause limiting the organization to charitable and educational purposes under section 501(c)(3) of the Internal Revenue Code."
          - "A dissolution clause saying that, if the organization closes, its assets go to another section 501(c)(3) organization."
      - do: File the form with the state and pay the state's filing fee, which the form states.
        see: The state returns a stamped or certified copy of the articles, with a filing date and a charter or entity number.
      - do: Save the stamped copy in the chapter's files, and write down the entity number.
    done_when: >-
      The state has accepted the articles of incorporation and returned a stamped
      copy.
    check:
      how: The stamped articles are in the chapter's files, with the state's entity number.
      probe: none
    goes_wrong: >-
      Articles written without the purpose and dissolution clauses the Internal
      Revenue Service expects. Fixing them means filing an amendment, which delays
      step 1.5.
    later: unchanged — this stays outside the software.
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#1.2

  - id: "1.3"
    name: Get a federal employer identification number
    why: The bank account and the nonprofit application both need this number.
    who: chapter
    first: ["1.2"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: "Open the Internal Revenue Service's own application page at https://www.irs.gov/businesses/small-businesses-self-employed/apply-for-an-employer-identification-number-ein-online and start the online application. Applying there is free. The page lists the hours the tool is open; on 09-19-26 they were weekdays from 6 a.m. to 1 a.m. Eastern time, with shorter hours at weekends."
      - do: "Answer the questions. Have these ready:"
        items:
          - "The type of organization: choose the option for a nonprofit or tax-exempt organization. The exact wording on the screen has not been checked."
          - The chapter's legal name and address, exactly as in the stamped articles.
          - The name and Social Security number of the responsible party, who must be an officer of the chapter.
          - The date the articles were filed.
        see: The employer identification number, shown at the end of the session.
      - do: Download the confirmation letter the site offers at the end of the session, before closing the page.
        see: A letter from the Internal Revenue Service, known as the CP 575, showing the number and the chapter's name.
      - do: Save the letter in the chapter's files, and put the number in the chapter's vault once it exists (step 2.7).
    done_when: >-
      The number has been issued and the confirmation letter is filed.
    check:
      how: The confirmation letter from the Internal Revenue Service is in the chapter's files.
      probe: none
    goes_wrong: >-
      Paying a third-party website to apply. Several charge a fee for a free service.
      Also, the online tool issues only one number per responsible party per day.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#1.3

  - id: "1.4"
    name: Appoint a board and adopt bylaws
    why: The bank and the central support organization will both ask which officers may sign for the chapter.
    who: chapter, with its own legal advice
    first: ["1.2"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: "Draft bylaws with the chapter's own adviser. The state's nonprofit association often publishes a model. At the least they say:"
        items:
          - How many directors there are, and how they are elected.
          - Which officers there are.
          - How a meeting is called, and how many directors make a quorum.
          - Who may sign contracts and open accounts for the chapter.
      - do: "Hold the first board meeting, and put these items on its agenda:"
        items:
          - Adopt the bylaws.
          - Elect the directors and officers.
          - "Name the officers who may sign contracts and open accounts, by name and office."
          - Name the person who acts for the chapter during setup (step 1.7).
      - do: Write up the minutes, and have the secretary sign them.
        see: Signed minutes that name the signers.
      - do: Save the signed bylaws and minutes in the chapter's files.
    done_when:
      - "Bylaws are adopted."
      - "Directors are named."
      - "The minutes record which officers may sign contracts."
    check:
      how: Signed minutes of the first meeting are in the chapter's files, naming who may sign.
      probe: none
    goes_wrong: >-
      Minutes that do not name who may sign. The bank (step 1.6) and the agreement
      (step 2.6) both need that minute.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#1.4

  - id: "1.5"
    name: Obtain nonprofit tax status, or a sponsorship arrangement
    why: The nonprofit discounts for Google Workspace and hosting are claimed against this status, and it is the longest wait in the guide.
    who: chapter, with its own legal or accounting advice
    first: ["1.3", "1.4"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: "Decide the route with the chapter's own adviser:"
        items:
          - "Route one: the chapter applies for its own recognition as a charity under section 501(c)(3)."
          - "Route two: an existing charity takes the chapter in under its own status, usually called fiscal sponsorship."
      - do: "For route one, first work out which form the chapter may use. Read the eligibility worksheet in the instructions for Form 1023-EZ, linked from https://www.irs.gov/forms-pubs/about-form-1023-ez. A chapter that passes every question may file the shorter Form 1023-EZ. Any other chapter files the full Form 1023."
      - do: "File the chosen form online. Both forms are filed only through Pay.gov:"
        items:
          - Create an account at https://www.pay.gov/.
          - Search for "1023-EZ" or "1023", whichever applies.
          - Complete the form, attaching the stamped articles and the bylaws for Form 1023.
          - Pay the user fee Pay.gov shows. It is paid when the form is filed.
        see: A Pay.gov confirmation with a tracking number. Save it.
      - do: "File within 27 months of the date the articles were filed. Recognition then counts from the date of incorporation. The chapter's own adviser confirms this."
      - do: Wait for the determination letter.
        see: A determination letter from the Internal Revenue Service. Typically weeks to a few months on the short form, and several months or longer on the full form.
      - do: "For route two, tell the central support organization before choosing it. See what usually goes wrong, below. Then sign a fiscal sponsorship agreement with the sponsoring charity, naming it."
        see: A signed sponsorship agreement naming the sponsoring nonprofit.
    done_when: >-
      Either the determination letter from the tax authority has arrived, or a
      signed sponsorship agreement is in place naming the sponsoring nonprofit.
    check:
      how: The determination letter or the signed sponsorship agreement is in the chapter's files.
      probe: none
    goes_wrong: >-
      Choosing sponsorship without seeing what it does to the accounts. The nonprofit
      discounts (steps 4.13 and 5.3) are claimed against a nonprofit's own status, so a
      sponsored chapter's accounts may have to sit under the sponsor. That cuts against
      the rule that each chapter owns its own accounts. It is an open question in the
      plan, and nothing yet says how to handle it.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#1.5

  - id: "1.6"
    name: Open a bank account
    why: Every account the chapter owns is paid from here, and more than one officer must be able to pay.
    who: chapter
    first: ["1.3", "1.4"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: Call or visit the bank and ask for its list of documents for opening a nonprofit account. Banks set their own list.
      - do: "Take the documents banks usually ask for:"
        items:
          - The stamped articles of incorporation (step 1.2).
          - The employer identification number letter (step 1.3).
          - The signed board minutes naming the signers (step 1.4).
          - Photo identification for each signer.
      - do: Open the account with at least two officers as signers, each able to authorise a payment on their own.
      - do: Order a payment card in the chapter's name, for the domain names, Google Workspace, hosting and vault bills.
        see: Two officers can each sign in to the bank's online service and approve a payment.
      - do: Put the bank's online sign-in details for each officer in their own care, not in the shared vault. Each signer has their own sign-in.
    done_when: >-
      The account is open and at least two officers can authorise a payment.
    check:
      how: Two officers can each see and approve a payment.
      probe: none
    goes_wrong: >-
      One person as the only signer. If that person leaves, nobody can pay the domain
      name renewal, the Google Workspace bill or the hosting bill.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#1.6

  - id: "1.7"
    name: Name the person who acts for the chapter during setup
    why: Setup needs one person with authority to open accounts and grant access, so work does not wait on a board meeting each time.
    who: chapter's board
    first: ["1.4"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: "Put a resolution in the board minutes, in words like these:"
        items:
          - "NAME is appointed the chapter's setup contact."
          - "NAME may open accounts in the chapter's name with the domain registrar, Cloudflare, Google Workspace, DigitalOcean, Proton Pass and Zoom."
          - "NAME may grant the central support organization's named people access to those accounts."
      - do: Email a copy of the signed minute to the central support organization.
        see: The central support organization replies confirming it holds the copy.
    done_when: >-
      One named person is recorded as the chapter's main contact for the whole
      setup, with authority to open accounts and grant access to others.
    check:
      how: The minute exists, and the central support organization has a copy.
      probe: The app records the setup contact's name as the chapter's first contact.
    goes_wrong: >-
      A setup contact who is also the only person holding the accounts. Stages 3 and
      4 each end with a step that removes the founder's personal hold on an account,
      for this reason.
    later: unchanged
    status: not-yet-tried
    source: 8-Methods-Organization-Domains-Google.md#1.7

