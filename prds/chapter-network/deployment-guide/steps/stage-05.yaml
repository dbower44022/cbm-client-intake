stage: 5
name: Open the chapter's service accounts
version: "0.13"
updated: "11-08-26 01:33"
why: >-
  The chapter's CRM server, its applications and their database all run in a
  hosting account, and the public webinar programme runs through a video meeting
  account. This stage opens both in the chapter's own name, so the chapter owns
  its system and can withdraw access at any time. It makes the two tokens
  CRMBuilder needs to build the CRM inside the chapter's accounts, and links the
  hosting account to the code repository the applications are built from. Its
  last three steps open the other services a chapter runs: the website host, the
  mailing service and the payment service for donations.
who: >-
  The chapter opens and pays for the accounts. The Association
  is invited in, and creates the two tokens.
time: >-
  About two hours of work. The nonprofit hosting credits can take weeks to be
  answered, but nothing waits on them.
before_you_start:
  - The chapter's mailboxes on its own domain (stage 4)
  - The chapter's bank account (step 1.6)
  - The agreement on what access the Association holds (step 2.4)
  - The chapter's vault (step 2.7)
  - The chapter's domain names in its Cloudflare account, or at its own DNS provider with manual DNS (step 3.7)
unlocks: >-
  Building the CRM (stage 9) can start once the chapter information form is
  complete, because CRMBuilder now holds the chapter's own tokens. The website
  (stage 6) is built in the website host account opened in step 5.10.
steps:
  - id: "5.1"
    name: Create the server hosting account
    why: The chapter's servers must sit in an account the chapter owns, not in anyone else's.
    who: chapter
    first: ["4.9"]
    needs: [alert_email_to]
    produces: [hosting_account]
    mode: guided
    actions:
      - do: "In a browser, go to https://cloud.digitalocean.com/registrations/new and sign up with email, not with a Google or GitHub sign-in. Use admin@EMAIL-DOMAIN, the chapter's administrators group from step 4.9, so every password reset reaches the chapter's two owners. Never use a personal address. The exact wording of DigitalOcean's screens has not been checked for this guide."
      - do: "Set a new password, and put it in the chapter's Operations vault straight away."
      - do: "Open the confirmation message DigitalOcean sends to admin@EMAIL-DOMAIN and confirm the address."
      - do: "DigitalOcean does not ask for a team name at sign-up; it names the team My Team (seen 11-08-26). Open https://cloud.digitalocean.com/account/team, click Edit beside Team Name, enter the chapter's name exactly as chosen in step 1.1, and click Update."
        see: "Team Name shows the chapter's name, and Team Email shows admin@EMAIL-DOMAIN."
        see: "A new, empty DigitalOcean account named after the chapter."
      - do: "Write the account on the chapter's account list (step 5.7): https://cloud.digitalocean.com, signed in as admin@EMAIL-DOMAIN."
    done_when: >-
      The account exists in the chapter's name, signed in with the chapter's administrators group.
    check:
      how: The chapter's setup contact signs in, and the account's profile shows the chapter's name and admin@EMAIL-DOMAIN.
      probe: none — the app cannot reach the account until the token in step 5.8 exists.
    goes_wrong: >-
      Signing up with a founder's personal email address. The account then belongs,
      in practice, to whoever reads that inbox.
    later: unchanged — the account is the chapter's by ruling, so the chapter creates it.
    status: not-yet-tried — the trial chapter was built inside Doug's own hosting account.
    source: 9-Methods-Hosting-Website-Policies.md#5.1

  - id: "5.2"
    name: Set up billing on the hosting account
    why: The chapter pays its own hosting, and a bill tied to a volunteer's card stops being paid when that volunteer leaves.
    who: chapter
    first: ["5.1", "1.6"]
    needs: []
    produces: []
    mode: guided
    actions:
      - do: "Sign in at https://cloud.digitalocean.com as admin@EMAIL-DOMAIN and open Billing. The exact wording of DigitalOcean's screens has not been checked for this guide."
      - do: "Add a payment method: the chapter's own card, or its bank account, from step 1.6. Never a volunteer's personal card."
        see: "The chapter's payment method listed as the default."
      - do: "Set the billing email to an address the chapter's treasurer reads, such as admin@EMAIL-DOMAIN or the treasurer's own chapter address."
        see: "The chapter address shown as the billing contact."
      - do: "Open Billing, then the Spend alerts tab, and click Create alert. Enter Alert name Monthly budget and the monthly budget amount the cost agreement names (step 2.2); leave the thresholds at 50, 75 and 100 percent, and click Create alert. The Association set $75 on 11-08-26."
        see: "The alert listed with its monthly budget and the three thresholds. Alerts go to the team's owners until billing contacts are added."
    done_when: >-
      A chapter payment method is on file and the billing contact is a chapter
      mailbox.
    check:
      how: The billing settings show the chapter's payment method and the chapter mailbox.
      probe: none
    goes_wrong: >-
      A volunteer's personal card on the account. When that person leaves, the bills
      stop being paid and the hosting provider eventually switches the chapter's
      system off.
    later: unchanged
    status: not-yet-tried
    source: 9-Methods-Hosting-Website-Policies.md#5.2

  - id: "5.3"
    name: Apply for the nonprofit hosting credits
    why: Nonprofit credits lower the chapter's hosting bill, and they belong to the chapter only if the chapter applies in its own name.
    who: chapter, with the Association's help
    first: ["5.2", "1.5"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: "Find the current nonprofit route for DigitalOcean credits. Two are known: DigitalOcean's own programme for nonprofits, and the DigitalOcean offer on TechSoup (https://www.techsoup.org). Neither has been checked for this guide, and the terms change. Ask the Association which is open now."
      - do: "Apply in the chapter's own name, with the employer identification number from step 1.3 and the determination letter from step 1.5. Use info@EMAIL-DOMAIN as the contact."
      - do: "Write on the chapter's account list (step 5.7):"
        items:
          - "The route used"
          - "The date the application went in"
          - "The expected answer date"
        see: "The route and both dates on the list."
    done_when: >-
      The application is submitted and the expected answer date is recorded.
    check:
      how: The confirmation of the application and the answer date are on the chapter's account list.
      probe: none
    goes_wrong: >-
      A chapter under a sponsoring nonprofit has no nonprofit status of its own to
      apply with. That case is an open question. Until it is answered, such a
      chapter should budget for the full price.
    later: unchanged
    status: not-yet-tried
    source: 9-Methods-Hosting-Website-Policies.md#5.3

  - id: "5.4"
    name: Grant the Association access to the hosting account
    why: The Association builds and runs the chapter's servers, and must do it under its own named sign-in so the chapter can see who did what and remove access.
    who: both — the chapter grants, the Association accepts
    first: ["5.1", "2.4"]
    needs: []
    produces: []
    mode: guided
    actions:
      - do: "The Association's named person first creates their own DigitalOcean sign-in, at https://cloud.digitalocean.com/registrations/new, with their own work address, and turns on two-step sign-in for it."
      - do: "The chapter signs in at https://cloud.digitalocean.com as admin@EMAIL-DOMAIN, opens the team's settings, and chooses to invite a member. The exact wording of DigitalOcean's screens has not been checked for this guide."
      - do: "Enter the Association's support person's own address, and give them a role that can create and manage servers, databases, applications, domains and tokens. DigitalOcean's role names have changed over time; choose the role that manages every resource but is not Owner, and write its name on the chapter's account list."
        see: "The invitation listed as pending."
      - do: "Keep the Owner role with the chapter's own sign-in, admin@EMAIL-DOMAIN."
      - do: "The invited person accepts from the message DigitalOcean sends, and switches to the chapter's team from their own sign-in."
        see: "The chapter's team, reached from the invited person's own sign-in."
      - do: "The chapter opens the team's member list."
        see: "The Association's support person listed, with a remove option beside them. Do not press it."
    done_when: >-
      The Association can create and manage servers in the
      account under its own named sign-in, and the chapter can remove that access
      itself.
    check:
      how: The Association's named person sees the chapter's account, and the chapter's owner can see the remove button beside that person's name. There is no need to press it.
      probe: none
    goes_wrong: >-
      Sharing the chapter's own sign-in instead of inviting a named person. Nobody
      can tell who did what, and the chapter cannot withdraw access without changing
      its own password.
    later: unchanged — the fleet console works inside the chapter's account using this same access.
    status: not-yet-tried — the August build worked inside Doug's own account, so no access was ever granted.
    source: 9-Methods-Hosting-Website-Policies.md#5.4

  - id: "5.5"
    name: Create the video meeting account, or record that it is not needed
    why: The public webinar programme schedules its meetings through the chapter's own Zoom account; mentoring sessions never use it.
    who: both — the chapter decides, the Association sets up the connection
    first: ["4.7"]
    needs: []
    produces: [zoom_host_email, zoom_account_id, zoom_client_id, ZOOM_CLIENT_SECRET]
    mode: guided
    actions:
      - do: "Decide whether the chapter will run public webinars through the software. If not, write \"No public webinars through Zoom\" on the chapter's account list (step 5.7) and stop here. Mentoring sessions never need this account."
      - do: "Create a licensed user for the webinar host in the chapter's Google Workspace, exactly as in step 4.7, with Last name Webinars and Primary email webinars@EMAIL-DOMAIN. Zoom will send its host mail there."
      - do: "In a browser, go to https://zoom.us/signup and create a Zoom account with webinars@EMAIL-DOMAIN. Put the password in the chapter's Operations vault."
      - do: "Buy a paid Zoom plan with a Zoom Webinars licence, and assign that licence to webinars@EMAIL-DOMAIN. Automatic attendance also needs the plan to allow webinar reports. Which plan the chapter needs, and its price, is not decided yet: write it as ZOOM-PLAN on the chapter's account list (step 5.7) until the Association confirms it."
      - do: "Signed in to Zoom as webinars@EMAIL-DOMAIN, go to https://marketplace.zoom.us and open Develop, then Build App. Choose Server-to-Server OAuth and name the app after the chapter, for example Akron Business Mentors Webinars."
      - do: "On the app's Information page, fill in the company name (the chapter's name) and a developer contact (info@EMAIL-DOMAIN)."
      - do: "On the Scopes page, add the scopes the software uses:"
        items:
          - "Webinars: read and write"
          - "Webinar registrants: read and write"
          - "Reports: read"
          - "Users: read"
        see: "Four groups of scopes added. Zoom's exact scope names have changed over time; pick the ones matching these four descriptions, and the Association checks them later with scripts/probe_zoom.py, which names any missing scope."
      - do: "On the Activation page, activate the app."
        see: "The app shown as activated."
      - do: "From the app's App Credentials page, copy three values:"
        items:
          - "Account ID: write it on the chapter information form as the Zoom account identifier"
          - "Client ID: write it on the form as the Zoom client identifier"
          - "Client Secret: put it only in the chapter's Operations vault, never on the form"
      - do: "On the chapter information form, write webinars@EMAIL-DOMAIN as the Zoom host address. The software reads it as ZOOM_HOST_EMAIL, which otherwise defaults to Cleveland's host."
        see: "The three values on the form and the secret in the vault."
    done_when: >-
      Either the account exists with a chapter mailbox as its host address and an
      app that lets the software schedule webinars through it, or a note records
      that this chapter runs no public webinars.
    check:
      how: The chapter's host mailbox signs in to Zoom, and the three values are recorded. The connection itself cannot be checked until the applications are deployed.
      probe: Once the applications run, the app asks Zoom for an access token with the three values.
    goes_wrong: >-
      The host address setting in the software defaults to Cleveland's. A chapter
      that forgets to change it would create its webinars under Cleveland's Zoom
      host. The Zoom connection has never been run against a real Zoom account.
    later: unchanged
    status: not-yet-tried
    source: 9-Methods-Hosting-Website-Policies.md#5.5

  - id: "5.6"
    name: Turn on two-step sign-in for both accounts
    why: A stolen password must not be enough to take over the chapter's servers or its meetings, and losing one phone must not lock the chapter out.
    who: chapter
    first: ["5.1", "5.5"]
    needs: []
    produces: []
    mode: guided
    actions:
      - do: "In DigitalOcean, signed in as admin@EMAIL-DOMAIN, open the account's security settings and turn on two-factor authentication with an authenticator app. The exact wording of DigitalOcean's screens has not been checked for this guide."
        see: "Signing in now asks for a code."
      - do: "Save DigitalOcean's recovery codes straight into the chapter's Operations vault."
      - do: "Set up the same authenticator on a second named person's device, from the same set-up code, so one lost phone does not lock the chapter out. Or store the set-up code itself in the vault."
      - do: "In Zoom, signed in as webinars@EMAIL-DOMAIN, open the account's security settings and turn on two-factor authentication with an authenticator app. The exact wording of Zoom's screens has not been checked for this guide."
        see: "Signing in to Zoom now asks for a code."
      - do: "Save Zoom's recovery codes in the chapter's Operations vault."
      - do: "A second named person opens the vault and finds both sets of recovery codes."
        see: "Both sets present, reachable by two people."
    done_when: >-
      Two-step sign-in is on and recovery does not depend on one person.
    check:
      how: Signing in to each account asks for the second step, and a second named person confirms they can reach the recovery codes.
      probe: none
    goes_wrong: >-
      Recovery codes kept only on the phone of the person who turned two-step
      sign-in on. When that phone is lost, so is the account.
    later: unchanged
    status: not-yet-tried
    source: 9-Methods-Hosting-Website-Policies.md#5.6

  - id: "5.7"
    name: Write down every account the chapter now owns
    why: Every account must be findable by a second person, so no account depends on the one who opened it.
    who: chapter, checked by the Association
    first: ["5.1", "5.2", "5.3", "5.4", "5.5", "5.6"]
    needs: []
    produces: [account_list]
    mode: guided
    actions:
      - do: "Make one list, held by the chapter in its Operations vault as a secure note, where the Association's named members can read it, with one line per account:"
        items:
          - "The domain registrar"
          - "Cloudflare, or with manual DNS the chapter's DNS provider"
          - "Google Workspace"
          - "The Proton Pass vault itself"
          - "The hosting account"
          - "The Zoom account, if there is one"
          - "The website host account (step 5.10)"
          - "The Constant Contact account (step 5.11)"
          - "The Stripe account (step 5.12)"
      - do: "Steps 5.10 to 5.12 open their accounts after this list is made. Leave a line for each, and each of those steps fills its line in."
      - do: "On each line write:"
        items:
          - "The web address to sign in at"
          - "Who holds the top-level sign-in"
          - "Who else has access"
          - "Where the recovery codes are"
          - "Any nonprofit discount or credit applied, or applied for"
        see: "No passwords on the list. Passwords and recovery codes are in the chapter's vault (step 2.7)."
    done_when:
      - "One list names each account."
      - "The list gives each account's web address."
      - "The list says who holds the top-level sign-in."
      - "The list says who else has access."
    check:
      how: A second person at the chapter finds every account on the list without asking anyone.
      probe: The app compares the list with the accounts it holds tokens for.
    goes_wrong: >-
      The list goes stale. It is handed over again at the end (step 18.4), and that
      is the moment to check it.
    later: The fleet console holds the list for every chapter.
    status: not-yet-tried
    source: 9-Methods-Hosting-Website-Policies.md#5.7

  - id: "5.8"
    name: Create the two tokens CRMBuilder builds with
    why: CRMBuilder creates the chapter's CRM server and its web address itself, and must do it inside the chapter's own accounts so the chapter can revoke access and keep everything.
    who: central, inside the chapter's accounts
    first: ["5.4", "3.7"]
    needs: [hosting_account, cloudflare_account]
    produces: [digitalocean_token, cloudflare_token]
    mode: guided
    actions:
      - do: "Sign in to DigitalOcean under your own named sign-in from step 5.4, and choose the chapter's team in the team switcher. Then open API, then Tokens, and choose to generate a new token. The exact wording of DigitalOcean's screens has not been checked for this guide. The token must be made under this sign-in, not the chapter's own: DigitalOcean ties its GitHub authorization to a sign-in, not to a team, and step 11.5 builds the applications from GitHub with this token."
        see: "The chapter's team named as the current team, and the Tokens page."
      - do: "Enter:"
        items:
          - "Token name: crmbuilder-SHORT-LABEL, using the chapter's short label from step 8.2"
          - "Expiration: the longest the screen offers, or no expiry"
          - "Scopes: full read and write access"
        see: "A new token, shown once only."
      - do: "Copy the DigitalOcean token straight into the chapter's Operations vault, named DigitalOcean token for CRMBuilder."
      - do: "With manual DNS (step 3.7), skip every Cloudflare action below: there is no Cloudflare token to make, and the Cloudflare box in CRMBuilder stays empty. Go on to the action that begins Work at the build computer."
      - do: "In Cloudflare, open My Profile, then API Tokens, and choose Create Token. Use the Edit zone DNS template."
      - do: "Set exactly:"
        items:
          - "Token name: crmbuilder-SHORT-LABEL"
          - "Permissions: Zone, DNS, Edit (the template sets this)"
          - "A second permission line: Zone, Zone, Read. CRMBuilder lists the chapter's zones with it, and the template does not add it."
          - "Zone resources: Include, Specific zone, and each of the chapter's domain names; never All zones"
          - "Client IP address filtering: leave empty"
          - "TTL: leave empty, for no expiry"
      - do: "Choose to continue to the summary, then create the token."
        see: "A new token, shown once only, covering only the chapter's zones."
      - do: "Copy the Cloudflare token straight into the chapter's Operations vault, named Cloudflare DNS token for CRMBuilder."
      - do: "Work at the build computer: the Association's own computer, the one with CRMBuilder installed. Open a terminal window on it, type the line below and press Enter:"
        items:
          - "cd ~/Dropbox/Projects/crmbuilder"
      - do: "Start CRMBuilder. Type the line below and press Enter:"
        items:
          - "./start-v2.sh"
        see: "CRMBuilder's main window. If a window titled Cloud backend not configured appears instead, the build computer is not connected to CRMBuilder's online service: stop and ask."
      - do: "Create the chapter's engagement, which holds the two tokens. Click the strip across the top of the window, which names the current engagement, then Manage engagements… at the bottom of the list. On the Engagements page, click New Engagement."
        see: A window titled New engagement, with four boxes.
      - do: "Fill in each box, then save:"
        items:
          - "Code: the chapter's short label from step 8.2, in capital letters: for Boston, BOSTON. Two to ten capital letters and digits, starting with a letter. It cannot be changed later."
          - "Name: the chapter's full name from step 8.2"
          - "Purpose: Build and run the chapter's CRM and applications."
          - "Status: active"
        see: "The new engagement listed with an identifier of the form ENG-NNN, and named in the strip across the top of the window. If another engagement is named there, click the strip and choose the chapter's."
      - do: "Open the tab 11 · CRM Deployment, click Instances in the side bar, then Deploy new…, and on Step 1 of 5 — Providers click Set credentials…."
        see: A window titled Provider credentials, with one box for DigitalOcean and one for Cloudflare.
      - do: "In each box, paste the token into Token, type crmbuilder-SHORT-LABEL into Label, and click Save token. Then click Close, and click Cancel to leave the deploy window; step 9.3 runs it."
        see: "Step 1 reading DigitalOcean: ✓ Configured — crmbuilder-SHORT-LABEL, and the same for Cloudflare. The token itself is never shown again."
    done_when:
      - "A DigitalOcean API token from the chapter's hosting account exists."
      - "A Cloudflare API token limited to editing DNS in the chapter's zones exists, unless the chapter uses manual DNS."
      - "Both tokens are in the chapter's vault."
      - "Both tokens are entered in CRMBuilder as the chapter's provider credentials."
    note: "CRMBuilder builds the chapter's CRM with the chapter's own accounts, never its own (ruled 09-18-26)."
    check:
      how: CRMBuilder's provider credentials screen shows both configured for the chapter's engagement, and lists the chapter's Cloudflare zones. With manual DNS, only the DigitalOcean line needs to be configured.
      probe: The app lists the chapter's hosting account through the DigitalOcean token and the chapter's zones through the Cloudflare token.
    goes_wrong: >-
      A Cloudflare token with more permission than it needs, or one covering every
      zone in the account. Also, leaving the engagement on CRMBuilder's own tokens
      by mistake. The server then appears in the wrong hosting account, and nothing
      says so until someone looks. And a DigitalOcean token made under the
      chapter's own sign-in: it builds the CRM server, but step 11.5 fails with
      GitHub user not authenticated, because the GitHub link from step 5.9 belongs
      to the Association's support person's sign-in (Boston, 09-24-26).
    later: unchanged
    status: not-yet-tried
    source: 9-Methods-Hosting-Website-Policies.md#5.8

  - id: "5.9"
    name: Link the hosting account to the code repository
    why: The applications are built from the code repository on GitHub, and the hosting account can fetch it, and take each weekly release by itself, only after GitHub has given it access.
    who: central, inside the chapter's hosting account, signed in to GitHub as the repository's owner
    first: ["5.4"]
    needs: [hosting_account]
    produces: [repository_link]
    mode: guided
    actions:
      - do: "Sign in at https://cloud.digitalocean.com under your own named sign-in from step 5.4."
        see: The DigitalOcean control panel.
      - do: "Open the team switcher and choose the chapter's team. The exact placement of the team switcher has not been checked for this guide."
        see: The chapter's team name shown as the current team. If the chapter's team is not in the list, the step 5.4 invitation has not been accepted yet.
      - do: "Choose Create, then App Platform."
        see: The Create App screen, with a list of places to take code from, including GitHub.
      - do: "Choose GitHub."
        see: "Either a Repository box, or a button to connect GitHub. The button's label may be Connect GitHub account or Manage Access. If the Repository box is already there, go on to the action that types the repository's name."
      - do: "Choose the button to connect GitHub. If GitHub asks you to sign in, sign in as the repository's owner, today dbower44022."
        see: A GitHub page asking you to authorize or install DigitalOcean.
      - do: "Give DigitalOcean access to the repository cbm-client-intake only. If the page offers All repositories or Only select repositories, choose Only select repositories and pick cbm-client-intake. Then choose the Authorize or Install button the page shows. If GitHub says the DigitalOcean app is already installed, check that cbm-client-intake is listed under Repository access, and add it and choose Save if it is not."
        see: GitHub returning you to DigitalOcean's Create App screen.
      - do: "Click into the Repository box and type cbm-client-intake."
        see: "dbower44022/cbm-client-intake offered in a short list under the Repository box. If it is not offered, stop: step 11.5 will fail."
      - do: "Choose dbower44022/cbm-client-intake from that list."
        see: "The Repository box reads dbower44022/cbm-client-intake, and a Branch drop-down appears below it, most likely reading main. Do not change it."
      - do: "Click the Branch drop-down to open its list. Do not pick anything from it."
        see: "release among the branch names. That is the whole test."
      - do: "Press Esc to close the list."
        see: The Branch list closed. Nothing on this screen is saved.
      - do: "Do not choose Next or Create. Choose App Platform in the left menu to leave the screen. Going on would create a billed application with the wrong settings."
        see: "The chapter's App Platform page, with no application. An empty page may show a getting-started panel or a Create App button instead of a list."
    done_when:
      - "The chapter's DigitalOcean team is authorized to read the code repository on GitHub."
      - "The repository's release branch is offered on the chapter's Create App screen."
      - "No application was created."
    note: "Today the link runs through one personal GitHub account, the repository owner's. Once the Association has its own GitHub organization, the repository moves there and this link is made by that organization's account instead."
    check:
      how: The release branch appears in the Branch list on the chapter's Create App screen.
      probe: none — doctl apps propose accepts a repository no account has authorized (checked 09-23-26), so no terminal command tests the link. Step 11.5 is the first automatic test.
    goes_wrong: >-
      Skipping this step. Nothing complains until step 11.5, where creating the
      application fails in the middle of the build. Also, every chapter's builds
      then depend on the GitHub account that made the link: if that account
      revokes DigitalOcean's access, the chapter's running application keeps
      working but stops building and stops taking weekly releases. Until the
      repository moves to the Association's own GitHub
      organization, that account is one person's.
    later: The link is made by the Association's GitHub organization, not a personal account.
    status: done-for-real — Boston, 09-23-26, signed in as dbower44022. Lakeside and Cleveland were built in accounts already linked, so no step existed until Boston.
    source: TASKS.md § work owed, item 12

  - id: "5.10"
    name: Open the website host account
    summary: >-
      The chapter's WordPress website runs on Cloudways, a lightly managed host on
      DigitalOcean that keeps the server's operating system and PHP up to date,
      takes backups, provides the security certificate and a staging copy
      (Association ruling 29). This step opens the account in the chapter's own
      name; stage 6 builds the website in it. The website never shares a server
      with the CRM.
    who: chapter, with the Association invited in
    first: ["4.9", "2.4", "2.7"]
    needs: [alert_email_to]
    produces: []
    mode: guided
    actions:
      - do: "In a browser, go to https://platform.cloudways.com/signup and sign up with email, not with a Google or GitHub sign-in. Use admin@EMAIL-DOMAIN, the chapter's administrators group from step 4.9, so every password reset reaches the chapter's two owners. The exact wording of Cloudways's screens has not been checked for this guide."
      - do: "Set a new random password generated by Proton Pass, and save it in the chapter's Operations vault in an item titled Website host (Cloudways), with the sign-in address https://platform.cloudways.com."
      - do: "Open the confirmation message Cloudways sends to admin@EMAIL-DOMAIN and confirm the address."
        see: "The Cloudways dashboard, signed in as admin@EMAIL-DOMAIN."
      - do: "Open the account's billing settings and add the chapter's own payment card from step 1.6. Never a volunteer's personal card."
      - do: "Open the account's security settings and turn on two-factor authentication with an authenticator code. Add the code to the Website host (Cloudways) item in the vault, and save any recovery codes there too."
        see: "Signing in now asks for a six-digit code, and the vault item shows the same code."
      - do: "Open the account's team settings and invite the Association's named person by their own email address, with a role that can manage servers and applications. Cloudways's role names have not been checked for this guide."
        see: "The Association's named person listed as a team member once they accept."
      - do: "Do not create a server yet. Stage 6 creates it, on DigitalOcean, and names it."
      - do: "Fill in the website host line on the chapter's account list (step 5.7)."
    done_when:
      - "The website host account exists in the chapter's name, signed in with the chapter's administrators group."
      - "It is paid with the chapter's own card."
      - "Two-step sign-in is on, and the sign-in and codes are in the chapter's vault."
      - "The Association's named person is a team member."
    check:
      how: A second person at the chapter signs in to Cloudways from the vault item, and the team page lists the Association's named person.
      probe: none
    goes_wrong: >-
      A server created now, before stage 6 has chosen its size and region, starts
      billing at once. Leave the account empty until stage 6.
    later: unchanged
    status: not-yet-tried — added 11-07-26 for Association ruling 29; first followed for the Association itself.
    source: Association rulings 29 and 33 (business-mentors-association, DECISIONS.md)

  - id: "5.11"
    name: Open the Constant Contact account and its developer application
    summary: >-
      Constant Contact is the mailing service the applications keep in step with
      the CRM: a newsletter subscriber lands in the CRM first, and the applications
      pass them on. This step opens the chapter's own account and registers the
      developer application the software connects through. The connection itself
      is made later, from System Settings, once the applications are running
      (MAILING-SETUP.md at the repository root, sections 2 and 3).
    who: chapter — the account must be opened by the Constant Contact user who will later connect the software
    first: ["4.9", "2.7"]
    needs: [alert_email_to]
    produces: []
    mode: guided
    actions:
      - do: "In a browser, go to https://www.constantcontact.com and sign up with admin@EMAIL-DOMAIN, the chapter's administrators group from step 4.9. Choose the plan the Association names; which plan, and its price, is not decided yet, so write it as MAILING-PLAN on the account list until it is. The exact wording of the sign-up screens has not been checked for this guide."
      - do: "Set a new random password generated by Proton Pass, and save it in the chapter's Operations vault in an item titled Constant Contact."
      - do: "Add the chapter's own payment card from step 1.6, and turn on two-step sign-in in the account's security settings, with the codes in the Constant Contact item."
      - do: "Signed in as admin@EMAIL-DOMAIN, open https://app.constantcontact.com/pages/dma/portal."
        see: "A page headed My Applications, with a New Application button."
      - do: "Click New Application, name it after the chapter, for example Akron Business Mentors applications, select Authorization Code Flow and Implicit Flow, select Rotating Refresh Tokens, and click Create."
        see: "The new application listed under Applications."
      - do: "Next to the new application, click edit. Copy the API Key into the Constant Contact item in the vault, labelled API key."
      - do: "In the Redirect URI box, replace what is there with the address below, putting the applications' web address in place of APP-ADDRESS. It is apps. followed by the website domain name chosen in step 3.2, for example apps.akronbusinessmentors.org:"
        items:
          - "https://APP-ADDRESS/api/setup/mailing/callback"
        see: "Exactly that address, with https at the start and callback at the end."
      - do: "Click Generate Client Secret and copy the secret straight into the Constant Contact item in the vault, labelled client secret. It is shown only once."
      - do: "Click Save, and fill in the Constant Contact line on the chapter's account list (step 5.7)."
    done_when:
      - "The Constant Contact account exists in the chapter's name, signed in with the chapter's administrators group."
      - "Its developer application exists, with the applications' callback address as its redirect address."
      - "The API key and client secret are in the chapter's vault."
    note: "A developer application is private to the Constant Contact user who created it, so the account the software connects to must be the one that created it."
    check:
      how: The application's details page shows the redirect address ending in /api/setup/mailing/callback, and the vault item holds both values.
      probe: none
    goes_wrong: >-
      An application created under a volunteer's own Constant Contact sign-in. Only
      that person can then connect the software, and the connection stops when they
      leave. Every other service that sends mail as the chapter's domain must be in
      its sender records too; Constant Contact's own sending address setup is not
      covered by this guide yet.
    later: The connection from System Settings is added to the applications stage when it is next corrected.
    status: not-yet-tried — added 11-07-26; the developer application screens were read on crm-test's own account on 10-08-26 (MAILING-SETUP.md section 1).
    source: MAILING-SETUP.md sections 0 and 1

  - id: "5.12"
    name: Open the Stripe account and create the donation link
    summary: >-
      A chapter takes online donations through a Stripe Payment Link in its own
      Stripe account (Association ruling 30). The website's Donate button opens the
      link; card details stay with Stripe. This step opens the account and creates
      the link. The link's address is later entered in the Website group of System
      Settings, which supplies it to the website.
    who: chapter — the treasurer, or the person the board names
    first: ["4.9", "1.6", "2.7"]
    needs: [alert_email_to]
    produces: []
    mode: guided
    actions:
      - do: "In a browser, go to https://dashboard.stripe.com/register and create the account with admin@EMAIL-DOMAIN, the chapter's administrators group from step 4.9. The exact wording of Stripe's screens has not been checked for this guide."
      - do: "Set a new random password generated by Proton Pass, and save it in the chapter's Operations vault in an item titled Stripe."
      - do: "Turn on two-step sign-in in the account's security settings, with the codes in the Stripe item."
      - do: "Complete Stripe's business details with the chapter's legal name, its employer identification number from step 1.3 and the chapter's bank account from step 1.6 for payouts. A chapter that is not yet able to take real payments stays in test mode and skips this action."
      - do: "Open Payment Links and create a new link for donations, letting the donor choose the amount. Name it Donation to CHAPTER-NAME."
        see: "A link address beginning https://buy.stripe.com/. In test mode Stripe marks the link as a test link."
      - do: "Copy the link's address into the Stripe item in the vault, labelled Donation link, and fill in the Stripe line on the chapter's account list (step 5.7)."
    done_when:
      - "The Stripe account exists in the chapter's name, signed in with the chapter's administrators group."
      - "Two-step sign-in is on, and the sign-in and codes are in the chapter's vault."
      - "A donation Payment Link exists, and its address is in the vault."
    check:
      how: Opening the link's address in a private browser window shows Stripe's payment page with the chapter's name.
      probe: none
    goes_wrong: >-
      Payouts to a volunteer's personal bank account. Stripe pays out to the account
      entered here, so it must be the chapter's own (step 1.6). Until the chapter
      applications record gifts automatically, staff enter each gift by hand and the
      chapter sends donors' tax acknowledgments itself (Association ruling 30).
    later: Stripe notifies the chapter applications of each completed payment, and they create the donor and the contribution record, once the feature request of Association ruling 30 is built.
    status: not-yet-tried — added 11-07-26 for Association ruling 30; first followed for the Association itself, in test mode.
    source: Association ruling 30 (business-mentors-association, DECISIONS.md)

