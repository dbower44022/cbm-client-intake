stage: 12
name: Set up backups and monitoring
version: "0.4"
updated: "09-23-26 20:40"
why: >-
  This stage makes sure the chapter's records can be got back after a mistake or a
  failure, and that a person finds out when the system stops working. It comes
  before any real records are loaded, because a backup taken afterwards is too late
  for whatever went wrong before it.
who: >-
  The central support organization, working inside the chapter's hosting account.
  The chapter names who reads the alerts.
time: >-
  About two hours, most of it waiting for a restored copy to be built.
before_you_start:
  - The CRM server (stage 9)
  - The applications and their database (stage 11)
  - Outgoing mail working, for the alert emails (step 11.15)
  - The decision about who receives warning messages (step 4.9)
unlocks: >-
  The chapter's pages can go on its website (stage 13), and real records can be
  loaded (stage 15).
steps:
  - id: "12.1"
    name: Back up the CRM server on a schedule
    why: A backup of the whole server holds the CRM's database, its uploaded files and its configuration together, so one restore brings back all three.
    who: central, inside the chapter's hosting account
    first: ["9.3"]
    needs: [digitalocean_token]
    produces: []
    mode: automated
    actions:
      - do: "In a terminal signed in to the chapter's DigitalOcean account (`doctl auth init` with the chapter's DigitalOcean token), list the servers and note the CRM server's ID:"
        items:
          - "doctl compute droplet list --format ID,Name,Features"
        see: The CRM server's row. Its Features column does not yet include backups.
      - do: "Switch on daily backups, putting the CRM server's ID in place of SERVER-ID:"
        items:
          - "doctl compute droplet-action enable-backups SERVER-ID --backup-policy-plan daily --backup-policy-hour 4 --wait"
        see: The action reported as completed.
      - do: "Read the policy back:"
        items:
          - "doctl compute droplet backup-policies get SERVER-ID"
        see: "Enabled true, Plan daily, Hour 4, Retention Period Days 7. Cleveland's production CRM reads exactly this."
      - do: "Write on the chapter's entry in the list of watched systems (step 12.5):"
        items:
          - "Schedule: daily"
          - "Backup window: from 04:00 UTC, four hours long"
          - "Kept for: seven days"
    done_when: >-
      Backups run automatically, and the schedule and how long backups are kept
      are written down.
    check:
      how: The next morning, the Backups tab lists a backup taken overnight.
      probe: The app reads the server's backup policy and the date of its latest backup.
    goes_wrong: >-
      Two things. Seven days is short: a mistake nobody notices for eight days
      cannot be undone from these backups. And backups cost extra and are easy to
      leave off, because the deployment wizard does not switch them on.
    later: The deployment tool switches backups on when it creates the server.
    status: not-yet-tried on a chapter — done for real on Cleveland's production CRM (daily, kept seven days).
    source: 6-Methods-Backups-Monitoring.md#12.1

  - id: "12.2"
    name: Back up the application database on a schedule
    why: Submissions that have arrived but not yet reached the CRM exist only in this database, so losing it loses them.
    who: central, inside the chapter's hosting account
    first: ["11.4"]
    needs: [digitalocean_token]
    produces: []
    mode: automated
    actions:
      - do: "In the chapter's DigitalOcean account, list the databases and note the application database's ID:"
        items:
          - "doctl databases list --format ID,Name,Engine,Size"
        see: "A row for the application's database. If there is no row at all, the database is a development database, which this command does not list and which takes no backups."
      - do: "If there is no row, convert the database: in the DigitalOcean web console, open the application, then Settings, then the database component, and choose to convert it to a managed database at the smallest size. This label was the one Cleveland used on 07-23-26 and has not been checked since."
        see: The application keeps running, and the database now appears in the list above.
      - do: "List the database's backups, putting the database's ID in place of DATABASE-ID:"
        items:
          - "doctl databases backups DATABASE-ID"
        see: A backup dated within the last day. Backups are daily and kept seven days.
      - do: "Write on the chapter's entry in the list of watched systems:"
        items:
          - "Schedule: daily"
          - "Kept for: seven days, with restore to any moment in that week"
    done_when: >-
      Backups run automatically, and the schedule and retention are written down.
    check:
      how: The database's Backups tab lists a backup taken in the last day.
      probe: The app lists the database's backups and reads the newest date.
    goes_wrong: >-
      A development database that nobody notices. Everything works, no error
      appears, and there are no backups. The trial chapter's database is in this
      state.
    later: The settings generator creates a managed database from the start.
    status: not-yet-tried on a chapter — done for real on Cleveland's production database.
    source: 6-Methods-Backups-Monitoring.md#12.2

  - id: "12.3"
    name: Restore from a backup once
    why: A backup nobody has restored is only a hope, so each kind is restored once into a separate copy and checked.
    who: central
    first: ["12.1", "12.2"]
    needs: [digitalocean_token]
    produces: []
    mode: guided
    actions:
      - do: "Database first. Find the application database's ID:"
        items:
          - "doctl databases list --format ID,Name"
      - do: "Restore it into a new database, putting that ID in place of DATABASE-ID. The output is thrown away on purpose, because it includes the new database's password:"
        items:
          - "doctl databases fork restore-test-SHORT-LABEL --restore-from-cluster-id DATABASE-ID --wait > /dev/null"
        see: The prompt returns after five to fifteen minutes, with nothing printed.
      - do: "Find the new database's ID:"
        items:
          - "doctl databases list --format ID,Name,Status"
        see: A row named restore-test-SHORT-LABEL with status online. Note its ID as RESTORED-ID.
      - do: "Let your own computer through the new database's firewall, which copies the live one and admits only the application. Putting your computer's public address in place of YOUR-IP (find it with `curl -s https://api.ipify.org`):"
        items:
          - "doctl databases firewalls append RESTORED-ID --rule ip_addr:YOUR-IP"
      - do: "Count the submissions in the copy, without ever printing its address. This needs `psql` installed. The application's database is named after the chapter's short label, so put it in place of DATABASE-NAME (list it with `doctl databases db list RESTORED-ID`):"
        items:
          - "psql \"$(doctl databases connection RESTORED-ID --no-header --format URI | sed 's#/defaultdb?#/DATABASE-NAME?#')\" -c 'select count(*), max(received_at) from submission'"
        see: A count of submissions and the date of the newest one, which should be recent. On Cleveland's test on 09-18-26 the newest was eight hours after the last daily backup, because a restore with no date rebuilds to the latest moment.
      - do: "Delete the copy the same hour. It holds the chapter's real personal details:"
        items:
          - "doctl databases delete RESTORED-ID --force"
        see: The copy gone from `doctl databases list`.
      - do: "Now the CRM server. List its backups, putting the CRM server's ID in place of SERVER-ID:"
        items:
          - "doctl compute droplet backups SERVER-ID"
        see: One backup image per day. Note the newest image's ID as BACKUP-IMAGE-ID.
      - do: "Create a new server from that backup, in the same region and size as the CRM server (read both from `doctl compute droplet get SERVER-ID --format Region,SizeSlug`):"
        items:
          - "doctl compute droplet create restore-test-SHORT-LABEL --image BACKUP-IMAGE-ID --region REGION --size SIZE --wait"
        see: A new server with its own public address, NEW-SERVER-IP.
      - do: "Open https://NEW-SERVER-IP in a browser. The certificate warning is expected, because the certificate is for the CRM's real address. Sign in as the central support organization's administrator and open one record changed recently."
        see: The record, as it was at the time of the backup.
      - do: "Delete the new server:"
        items:
          - "doctl compute droplet delete restore-test-SHORT-LABEL --force"
      - do: "Write down on the chapter's entry in the list of watched systems:"
        items:
          - The date.
          - What was checked in each copy.
          - How long each restore took, timed from the command to the copy being usable.
    done_when: >-
      A restore has actually been performed and the result checked. An untested
      backup is not a backup.
    check:
      how: Both copies started and held the expected records, and the test is written down.
      probe: The app runs the database restore into a copy, counts the tables' rows, and deletes the copy.
    goes_wrong: >-
      A restore with no date given rebuilds the database to the latest moment it
      can, not to the last daily backup. That is better, but it means the two are
      the same command. Also, the restored copy holds real personal details, so it
      is printed as counts and dates only and deleted the same hour.
    later: The fleet console runs a restore test on a schedule and reports the result.
    status: not-yet-tried on a chapter — the database half was done for real on Cleveland's production system on 09-18-26; the CRM server half has never been done anywhere.
    source: 6-Methods-Backups-Monitoring.md#12.3

  - id: "12.4"
    name: Confirm alerts reach a person
    why: When the system stops working or submissions pile up, somebody has to be told, and an alert nobody reads is the same as no alert.
    who: both — the central support organization sets it up; the chapter names who reads the alerts
    first: ["4.9", "11.15"]
    needs: [alert_email_from, alert_email_to, app_base_url, crm_base_url]
    produces: []
    mode: guided
    actions:
      - do: "The alert address must belong to a member of the chapter's DigitalOcean team; DigitalOcean refuses any other. Check it is listed under the chapter's team members in the DigitalOcean web console."
      - do: "Create the uptime check on the application's health page, putting the application's address in place of APP-ADDRESS:"
        items:
          - "doctl monitoring uptime create SHORT-LABEL-app-up --target https://APP-ADDRESS/healthz --type https --regions us_east"
        see: A new uptime check with its ID. Note it as APP-CHECK-ID.
      - do: "Add its alert, putting the alert address in place of ALERT-ADDRESS:"
        items:
          - "doctl monitoring uptime alert create APP-CHECK-ID --name SHORT-LABEL-app-down --type down --threshold 1 --comparison less_than --period 2m --emails ALERT-ADDRESS"
        see: The alert with type down and period 2m. These are exactly the settings on Cleveland's production application.
      - do: "Create the uptime check on the CRM's own address, putting it in place of CRM-ADDRESS:"
        items:
          - "doctl monitoring uptime create SHORT-LABEL-crm-up --target https://CRM-ADDRESS/ --type https --regions us_east"
        see: A second uptime check with its ID. Note it as CRM-CHECK-ID.
      - do: "Add its alert:"
        items:
          - "doctl monitoring uptime alert create CRM-CHECK-ID --name SHORT-LABEL-crm-down --type down --threshold 1 --comparison less_than --period 2m --emails ALERT-ADDRESS"
      - do: "Add the three database alerts, putting the application database's ID in place of DATABASE-ID. Run each line on its own:"
        items:
          - "doctl monitoring alert create --type v1/dbaas/alerts/cpu_alerts --compare GreaterThan --value 90 --window 5m --entities DATABASE-ID --emails ALERT-ADDRESS --description 'CPU is running high'"
          - "doctl monitoring alert create --type v1/dbaas/alerts/memory_utilization_alerts --compare GreaterThan --value 90 --window 5m --entities DATABASE-ID --emails ALERT-ADDRESS --description 'Memory Utilization is running high'"
          - "doctl monitoring alert create --type v1/dbaas/alerts/disk_utilization_alerts --compare GreaterThan --value 90 --window 5m --entities DATABASE-ID --emails ALERT-ADDRESS --description 'Disk Utilization is running high'"
        see: Three alert policies. They match Cleveland's database alerts.
      - do: "Send a test alert from the application itself. Open a console on the background worker, putting the application's ID in place of APP-ID:"
        items:
          - "doctl apps console APP-ID delivery-worker"
      - do: "In that console, run:"
        items:
          - "PYTHONPATH=/app .venv/bin/python -c \"import asyncio; from core.config import get_settings; from core.monitoring import send_alert; asyncio.run(send_alert(get_settings(), 'Test alert: checking the alert path'))\""
        see: The line "alert sent (email to ...)" in the output, and the message arrives at the alert address. The line "ALERT (no delivery channel configured/working)" means the alert went only to the log.
      - do: Write down the names of the people who read the alert address.
    done_when: >-
      A test alert arrives at an address somebody reads, and it is recorded who
      reads it.
    check:
      how: The test alert arrives, and a named person confirms they saw it.
      probe: The app sends a test alert and asks the named reader to confirm it arrived.
    if_not: If no test alert arrives, check the Google connection first. The application sends its alerts through the chapter's Google account.
    goes_wrong: >-
      Three things. A chapter with the Google connection switched off gets no alert
      emails at all, and nothing says so. An alert address that nobody reads: use
      one address forwarded to named people, as Cleveland does. And nothing
      watching the CRM directly: without the second uptime check, a CRM outage is
      noticed only when a delivery fails.
    later: A "send a test alert" button on the settings page.
    status: not-yet-tried on a chapter — done for real on Cleveland's production system, including the CRM uptime check added on 09-18-26.
    source: 6-Methods-Backups-Monitoring.md#12.4

  - id: "12.5"
    name: Add the chapter to the list of systems being watched
    why: The central support organization supports every chapter, and needs one place saying where each chapter's systems are and when they were last checked.
    who: central
    first: ["12.1", "12.2", "12.3", "12.4"]
    needs: [crm_base_url, app_base_url, chapter_slug]
    produces: []
    mode: automated
    actions:
      - do: "Open the list of watched systems. It does not exist yet. Until the fleet console exists, create it once as `prds/chapter-network/watched-systems.md` in the software's code repository, one section per chapter."
      - do: "Add a section for the chapter headed with its name, holding one line each for:"
        items:
          - "CRM address: the value of crm_base_url"
          - "Application address: the value of app_base_url"
          - "Hosting account: the DigitalOcean team name"
          - "CRM server backups: the schedule from step 12.1"
          - "Application database backups: the schedule from step 12.2"
          - "Alert readers: the names from step 12.4"
          - "Last restore test: the date from step 12.3"
        see: Every line filled in. No password or key appears anywhere in the file.
    done_when: >-
      The central support organization's list of systems includes this chapter's
      CRM and application.
    check:
      how: The chapter is on the list, with every column filled in.
      probe: The app is the list, and reads each chapter's health address.
    goes_wrong: >-
      The list drifting from the truth. An old restore test date on the list is a
      chapter whose backups nobody has checked lately.
    later: The fleet console is the list.
    status: not-yet-tried — the list does not exist yet.
    source: 6-Methods-Backups-Monitoring.md#12.5

