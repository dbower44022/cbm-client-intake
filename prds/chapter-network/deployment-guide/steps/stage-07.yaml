stage: 7
name: Write and publish the policy documents
version: "0.2"
updated: "09-19-26 00:05"
why: >-
  Every public form carries one required consent box that links to four
  documents. Two are codes: the code of conduct, and the mentor code of ethics.
  Two are legal: the terms of use, and the privacy policy. The links must lead to this chapter's own documents, because
  showing one city's applicants another city's privacy policy is a legal problem.
  The chapter writes the documents with its own legal adviser; this stage covers
  only what the software needs from them.
who: >-
  The chapter, with its own legal adviser. The central support organization
  supplies the list of what personal information the software collects, and gives
  no legal advice.
time: >-
  Not known. It depends on the chapter's legal adviser.
before_you_start:
  - The website, published (step 6.2)
  - A named person at the chapter who can edit the website (step 6.4)
unlocks: >-
  The four addresses go on the chapter information form (stage 8), and from there
  into the consent box on every public form.
steps:
  - id: "7.1"
    name: Write and publish the client code of conduct
    why: The consent box on the client, partner and funder forms links to it as "Code of Conduct".
    who: chapter
    first: ["6.2", "6.4"]
    needs: [website_base_url]
    produces: [policy_client_conduct_url]
    mode: offline
    actions:
      - do: Write the document with the chapter's legal adviser. Give it the title "Client Code of Conduct". The client, partner and funder forms link to it from the words Client Code of Conduct or Code of Conduct, depending on the form.
      - do: "Publish it as a public page on the chapter's website at exactly this address, the same path Cleveland uses: https://WEBSITE-DOMAIN/client-code-of-conduct/"
      - do: "In a terminal, run exactly:"
        items:
          - "curl -sI https://WEBSITE-DOMAIN/client-code-of-conduct/"
        see: A first line of HTTP/2 200. A 302 to a sign-in page means the page is a draft or private.
      - do: Open the same address in a private browser window.
        see: The document, without being asked to sign in.
      - do: "Write the address on the chapter information form under web: policy_client_conduct_url. It becomes the setting POLICY_CLIENT_CONDUCT_URL."
    done_when: >-
      The document is published on the chapter's website and opens without signing
      in.
    check:
      how: The page opens in a private browser window.
      probe: The app fetches the address without signing in and checks it answers with a page.
    goes_wrong: >-
      A page published as a draft, or behind a sign-in. It opens for the person who
      wrote it and for nobody else. The private window is what catches this.
    later: unchanged
    status: not-yet-tried
    source: 9-Methods-Hosting-Website-Policies.md#7.1

  - id: "7.2"
    name: Write and publish the mentor code of ethics
    why: The volunteer application form's "Code of Conduct" link goes to this document, which is different from the client code of conduct.
    who: chapter
    first: ["6.4"]
    needs: [website_base_url]
    produces: [policy_mentor_ethics_url]
    mode: offline
    actions:
      - do: Write the document with the chapter's legal adviser. Give it the title "Mentor Code of Ethics". It is a separate document from the client code of conduct. The volunteer form's link reads Code of Conduct and leads here.
      - do: "Publish it as a public page on the chapter's website at exactly this address, the same path Cleveland uses: https://WEBSITE-DOMAIN/mentor-code-of-ethics/"
      - do: "In a terminal, run exactly:"
        items:
          - "curl -sI https://WEBSITE-DOMAIN/mentor-code-of-ethics/"
        see: A first line of HTTP/2 200. A 302 to a sign-in page means the page is a draft or private.
      - do: Open the same address in a private browser window.
        see: The document, without being asked to sign in.
      - do: "Write the address on the chapter information form under web: policy_mentor_ethics_url. It becomes the setting POLICY_MENTOR_ETHICS_URL."
    done_when: >-
      The document is published and opens without signing in.
    check:
      how: The page opens in a private browser window.
      probe: The app fetches the address without signing in and checks it answers with a page.
    goes_wrong: >-
      Publishing one code for both. The software links two different addresses, and
      a mentor applicant would then agree to the client code of conduct.
    later: unchanged
    status: not-yet-tried
    source: 9-Methods-Hosting-Website-Policies.md#7.2

  - id: "7.3"
    name: Write and publish the terms
    why: The consent box on every public form links to it as "Terms of Use".
    who: chapter
    first: ["6.4"]
    needs: [website_base_url]
    produces: [policy_terms_url]
    mode: offline
    actions:
      - do: Write the document with the chapter's legal adviser. Give it the title "Terms of Use". Every public form's link reads Terms of Use.
      - do: "Publish it as a public page on the chapter's website at exactly this address, the same path Cleveland uses: https://WEBSITE-DOMAIN/legal-notices/"
      - do: "In a terminal, run exactly:"
        items:
          - "curl -sI https://WEBSITE-DOMAIN/legal-notices/"
        see: A first line of HTTP/2 200. A 302 to a sign-in page means the page is a draft or private.
      - do: Open the same address in a private browser window.
        see: The document, without being asked to sign in.
      - do: "Write the address on the chapter information form under web: policy_terms_url. It becomes the setting POLICY_TERMS_URL."
    done_when: >-
      The document is published and opens without signing in.
    check:
      how: The page opens in a private browser window.
      probe: The app fetches the address without signing in and checks it answers with a page.
    goes_wrong: nothing known yet
    later: unchanged
    status: not-yet-tried
    source: 9-Methods-Hosting-Website-Policies.md#7.3

  - id: "7.4"
    name: Write and publish the privacy policy
    why: The consent box on every public form links to it, and it must describe what this chapter's system collects, under this chapter's name.
    who: both — the chapter writes it, the central support organization says what the software collects
    first: ["6.4"]
    needs: [website_base_url]
    produces: [policy_privacy_url]
    mode: offline
    actions:
      - do: "The central support organization gives the chapter's adviser a plain list of what personal information the software collects and where it is kept. There is no finished list yet (work list item 13). Until there is, give this outline:"
        items:
          - "Names, contact details and business details from the public forms, kept in the chapter's CRM."
          - "Every form submission, also held in the application's own database."
          - "Email between mentors and clients, copied onto the client's record in the CRM."
          - "Documents, kept in the chapter's Google shared drive."
      - do: The chapter writes the policy with its legal adviser. Give it the title "Privacy Policy". Every public form's link reads Privacy Policy.
      - do: "Publish it as a public page at exactly this address, the same path Cleveland uses: https://WEBSITE-DOMAIN/privacy-policy/"
      - do: "In a terminal, run exactly:"
        items:
          - "curl -s https://WEBSITE-DOMAIN/privacy-policy/ | grep -c -i cleveland"
        see: The number 0. Any other number means Cleveland's name is still in the page.
      - do: Open the same address in a private browser window and read which organization the policy names.
        see: The document, without a sign-in, naming this chapter.
      - do: "Write the address on the chapter information form under web: policy_privacy_url. It becomes the setting POLICY_PRIVACY_URL."
    done_when:
      - "The document is published."
      - "The document opens without signing in."
      - "The document names this chapter rather than any other organization."
    check:
      how: The page opens in a private browser window, and the organization it names is this chapter.
      probe: The app fetches the address without signing in and checks the page contains the chapter's name and not "Cleveland".
    goes_wrong: >-
      Starting from another chapter's policy and missing a name. The finishing test
      for this step exists for that reason.
    later: The central support organization keeps a standing description of what the software collects, updated with each release that changes it.
    status: not-yet-tried — the plain list of what the software collects does not exist as one document yet.
    source: 9-Methods-Hosting-Website-Policies.md#7.4

  - id: "7.5"
    name: Have the four documents reviewed
    why: The documents are live the moment they are published, and the consent box points at them as soon as the applications are deployed.
    who: chapter
    first: ["7.1", "7.2", "7.3", "7.4"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: Send the chapter's legal adviser the four addresses from steps 7.1 to 7.4.
      - do: The adviser reads all four and replies in writing that they may be published, naming each document.
        see: A written reply naming all four documents.
      - do: Save the reply in the chapter's shared drive, in a folder named Legal, with the date in its file name. The central support organization plays no part in this review.
    done_when: >-
      Whoever advises the chapter on legal matters has read all four and confirmed
      they may be published.
    check:
      how: The written confirmation is kept with the chapter's records.
      probe: none — the app only records that the chapter says it is done.
    goes_wrong: >-
      Publishing first and reviewing later. The documents are live as soon as they
      are published.
    later: unchanged
    status: not-yet-tried
    source: 9-Methods-Hosting-Website-Policies.md#7.5

  - id: "7.6"
    name: Record the four web addresses
    why: The software's four policy settings are filled from these addresses, and every one defaults to Cleveland's documents.
    who: chapter, checked by the central support organization
    first: ["7.5"]
    needs: [policy_client_conduct_url, policy_mentor_ethics_url, policy_terms_url, policy_privacy_url]
    produces: []
    mode: guided
    actions:
      - do: "Open the chapter information form and check the web: section holds exactly these four keys, each with an address copied from the browser's address bar, not typed from memory:"
        items:
          - "policy_client_conduct_url: https://WEBSITE-DOMAIN/client-code-of-conduct/"
          - "policy_mentor_ethics_url: https://WEBSITE-DOMAIN/mentor-code-of-ethics/"
          - "policy_terms_url: https://WEBSITE-DOMAIN/legal-notices/"
          - "policy_privacy_url: https://WEBSITE-DOMAIN/privacy-policy/"
      - do: "In a terminal, run this once for each of the four addresses, putting the address in place of POLICY-ADDRESS:"
        items:
          - "curl -sI POLICY-ADDRESS"
        see: A first line of HTTP/2 200 for all four.
      - do: Check that none of the four addresses contains clevelandbusinessmentors.org. Each setting defaults to Cleveland's document, so a copied Cleveland address would pass every other check.
    done_when: >-
      All four addresses are written on the chapter information form and each one
      has been opened and checked.
    check:
      how: All four open from the form.
      probe: The app fetches all four addresses without signing in and checks none is one of Cleveland's.
    goes_wrong: >-
      A changed address later. If the chapter moves a document on its website, the
      consent box links break silently. Moving a policy document needs a change
      request (step 18.2), so the setting is changed at the same time.
    later: unchanged
    status: not-yet-tried
    source: 9-Methods-Hosting-Website-Policies.md#7.6

