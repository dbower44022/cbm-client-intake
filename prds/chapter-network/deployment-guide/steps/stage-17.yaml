stage: 17
name: Check everything works before going live
version: "0.5"
updated: "09-23-26 20:40"
why: >-
  This stage proves the chapter's system works end to end before any real client
  uses it: each team reaches its own pages and nobody else's, and a public
  application travels from the website through assignment to a mentor. Every
  check is done as an ordinary user. An administrator skips every permission
  check, so a check done as an administrator proves nothing, and several of
  Cleveland's permission faults stayed hidden for weeks for exactly that reason.
who: >-
  The central support organization, signed in as test users; the chapter for the
  website check.
time: >-
  About two hours. Most of the checks can be run by a script.
before_you_start:
  - The staff accounts exist (stage 14)
  - The mentor accounts exist (steps 15.8 to 15.10)
  - The chapter's pages are on its website (stage 13). Only step 17.8 and the website half of step 17.3 need it; everything else can run without it
unlocks: >-
  The handover to normal support (stage 18). The chapter can take real clients.
steps:
  - id: "17.1"
    name: Create one ordinary test user per team
    why: Each team's permissions can only be proven by someone who holds that team and nothing else.
    who: central
    first: ["14.2", "15.9"]
    needs: []
    produces: [test_users]
    mode: automated
    actions:
      - do: "In these steps, CRM-ADDRESS is the chapter's CRM address, APP-ADDRESS is the chapter's application address, and SHORT-LABEL is the chapter's short label, all from the chapter information form."
      - do: "Sign in to CRM-ADDRESS as the central support organization's administrator. Open Administration, then Users, and create these six accounts. The exact labels on the create-user screen are not verified. Use these values:"
        items:
          - "User name SHORT-LABEL.test.clientadmin, team Client Administration Team"
          - "User name SHORT-LABEL.test.mentoradmin, team Mentor Administration Team"
          - "User name SHORT-LABEL.test.partner, team Partner Management Team"
          - "User name SHORT-LABEL.test.funder, team Sponsor Management Team"
          - "User name SHORT-LABEL.test.marketing, team Marketing Admin Team"
          - "User name SHORT-LABEL.test.analytics, team Analytics Admin Team"
      - do: "For each of the six, also set:"
        items:
          - "Type: Regular, never Admin"
          - "Exactly one team, the one named above"
          - "Active: yes"
          - "A password of 20 letters and digits, stored first in the chapter's vault under the user name"
        see: Six accounts in the Users list, each with one team.
      - do: "Create the seventh, the Mentor Team test user, through Mentor Administration so it is linked to a mentor record (step 15.9). Sign in to APP-ADDRESS/mentoradmin/ as a mentor administrator, add a mentor named Test Mentor SHORT-LABEL, fill in the required fields, set Accepting New Clients to yes, and set the status to Active. The exact label of the accepting field on screen is not verified."
        see: The mentor marked Complete, with a login created. Its user name is set by the software from the mentor's name; write it down.
      - do: "Accepting new clients matters: the Assign list in step 17.4 offers only mentors who are Active, accepting new clients and linked to a login. Without it the list is empty and step 17.4 looks broken."
      - do: "If the chapter has Create missing mailboxes switched on, setting the status creates a real Google mailbox for the test mentor, which takes a paid licence. Write the address down; step 17.9 deletes it."
      - do: Store the seventh account's password in the chapter's vault under its user name.
    done_when: >-
      There is one non-administrator test account for each team.
    check:
      how: Each test user signs in at APP-ADDRESS/, and the portal shows tiles for exactly one team.
      probe: The app signs in as each test user and reads back its teams.
    goes_wrong: >-
      Giving test users a second team "to make testing easier". The check then
      proves nothing about the single-team case real staff are in.
    later: The onboarding app creates and later disables a standard set of test users.
    status: done-for-real
    source: 5-Methods-Form-Accounts-Checks.md#17.1

  - id: "17.2"
    name: Confirm each test user sees only what their team allows
    why: A permission gap either locks staff out of their work or shows them records they must not see, and only a per-team test finds it.
    who: central
    first: ["17.1"]
    needs: [test_users]
    produces: []
    mode: automated
    actions:
      - do: "The test uses twelve addresses. Each returns the page's own session check: an allowed user gets an answer, a refused user gets a refusal naming the team needed. They are:"
        items:
          - "APP-ADDRESS/assignments/api/session"
          - "APP-ADDRESS/mentoradmin/api/session"
          - "APP-ADDRESS/mentorprofile/api/session"
          - "APP-ADDRESS/mentorsessions/api/session"
          - "APP-ADDRESS/partnersessions/api/session"
          - "APP-ADDRESS/sponsorsessions/api/session"
          - "APP-ADDRESS/ops/api/session"
          - "APP-ADDRESS/directory/mentors/api/session"
          - "APP-ADDRESS/myemail/api/session"
          - "APP-ADDRESS/analytics/api/session"
          - "APP-ADDRESS/events/api/session"
          - "APP-ADDRESS/setup/api/settings"
      - do: For the first test user, open a private browser window, sign in at APP-ADDRESS/, then open each of the twelve addresses in the same window. Write down for each whether it answered with information or refused. Close the window, and repeat for each of the other six test users.
      - do: "Compare what you wrote with what each test user must be allowed. Every address not listed for a user must be refused:"
        items:
          - "SHORT-LABEL.test.clientadmin: assignments only"
          - "SHORT-LABEL.test.mentoradmin: mentoradmin only"
          - "The Mentor Team test user: mentorprofile, mentorsessions, directory and myemail"
          - "SHORT-LABEL.test.partner: partnersessions and myemail"
          - "SHORT-LABEL.test.funder: sponsorsessions and myemail"
          - "SHORT-LABEL.test.marketing: ops and events"
          - "SHORT-LABEL.test.analytics: analytics only"
          - "setup: refused for all seven"
        see: "The same pattern as the trial chapter's record, prds/chapter-network/rehearsal-2026-08-31/nonadmin-gate-matrix.json, for the first eleven addresses. That record shows Not Found for the setup address, which is not the right answer; the next action says what is."
      - do: "For the setup address, read the refusal. The right answer, when the settings page is switched on, is a refusal saying System Settings is restricted to administrators."
        see: That refusal, not "Not Found".
    done_when: >-
      Every test user can open their own team's pages and is refused on every other
      team's pages. Administrator accounts skip all permission checks, so this must
      be done as ordinary users.
    check:
      how: The pattern written down matches the list above for every test user.
      probe: Fully automatable. The app signs in as each of the seven test users, requests each of the twelve addresses, and compares the answers with the expected table, as the August build did.
    if_not: >-
      A "Not Found" answer is not a refusal. It means the page is switched off or the
      address is wrong. Find out which before calling it a pass. Any other difference
      from the table: stop, and ask the central support organization.
    goes_wrong: >-
      Reading "not found" as "refused". In August the settings page answered "not
      found" to every test user, and the record cannot say why.
    later: The onboarding app runs the table itself.
    status: done-for-real — apart from the settings page, whose answer is unexplained.
    source: 5-Methods-Form-Accounts-Checks.md#17.2

  - id: "17.3"
    name: Submit the public application form
    why: The public form is how clients arrive, so it is tested from the chapter's own website the way a client would use it.
    who: both — the central support organization, or anyone at the chapter
    first: ["17.2"]
    needs: [website_base_url]
    produces: [test_submission]
    mode: guided
    actions:
      - do: Open the chapter's website address in a private browser window and follow its link to the client application form. If stage 13 has not put the link on the website yet, open APP-ADDRESS/client-intake/ directly, carry on, and follow the website's link once stage 13 is done.
        see: The form at APP-ADDRESS/client-intake/.
      - do: Open each of the four policy links beside the consent box.
        see: Each of the chapter's own four policy documents, not Cleveland's.
      - do: "Fill in the form with these made-up values, and write them down; step 17.9 removes them:"
        items:
          - "Business name: Test Bakery DELETE-ME"
          - "First name: Test"
          - "Last name: Applicant DELETE-ME"
          - "Email: an address on a mailbox the chapter controls"
          - "Every other required field: any plausible made-up value"
      - do: Tick the consent box and submit.
        see: A thank-you message with a reference number. Write the reference number down.
    done_when: >-
      A submission made from the public website arrives in the system.
    check:
      how: The submission appears in Submission Admin at APP-ADDRESS/ops/, under its reference number.
      probe: The app can submit a test application through the form's own address and watch for it to arrive, but the path from the website's link needs a person once.
    goes_wrong: >-
      A broken policy link on the consent box.
    later: unchanged — a person should do this once by hand.
    status: done-for-real — from the applications' own address; the trial chapter had no website, so the website's link was not tested.
    source: 5-Methods-Form-Accounts-Checks.md#17.3

  - id: "17.4"
    name: Assign the submission
    why: Assigning a new client to a mentor is the client administrator's main task, and it depends on several permissions at once.
    who: central, signed in as the Client Administration Team test user
    first: ["17.3"]
    needs: [test_submission, test_users]
    produces: []
    mode: guided
    actions:
      - do: Sign in at APP-ADDRESS/ as SHORT-LABEL.test.clientadmin and open Client Administration at APP-ADDRESS/assignments/.
      - do: Find the row for Test Bakery DELETE-ME. Its status is Submitted.
      - do: Use the row's Assign action and choose the Mentor Team test user's mentor, Test Mentor SHORT-LABEL.
        see:
          - The row showing Test Mentor SHORT-LABEL
          - The status Pending Acceptance
          - The email to the mentor opening, ready to send
      - do: Close the email without sending it.
    done_when: >-
      A client administrator test user assigns it to a mentor.
    check:
      how: The engagement shows Test Mentor SHORT-LABEL and the status Pending Acceptance.
      probe: The app can assign through the same request the page makes, as the test user, and read the engagement back.
    goes_wrong: >-
      Two known failures. An empty mentor list: a mentor appears only when Active,
      accepting new clients and linked to an account. And a refusal about users: the
      client administration role needs permission to read users; Cleveland's role
      lacked it, and production still needs the fix.
    later: unchanged
    status: done-for-real
    source: 5-Methods-Form-Accounts-Checks.md#17.4

  - id: "17.5"
    name: Confirm the mentor sees it
    why: The assignment only matters if the mentor can find the client and work with them.
    who: central, signed in as the Mentor Team test user
    first: ["17.4"]
    needs: [test_users]
    produces: []
    mode: guided
    actions:
      - do: In a new private browser window, sign in at APP-ADDRESS/ as the Mentor Team test user and open Client Management at APP-ADDRESS/mentorsessions/.
        see: Test Bakery DELETE-ME in the list, and it opens.
      - do: Open My Mentor Profile at APP-ADDRESS/mentorprofile/.
        see: Test Mentor SHORT-LABEL's own details.
    done_when: >-
      The mentor test user finds the assignment and can open their own profile.
    check:
      how: The engagement opens, and the profile page shows the mentor's own details.
      probe: The app requests the mentor's list of engagements as the test user and looks for the new one.
    goes_wrong: >-
      Client Management is empty. Nearly always the mentor record is not linked to
      the account, or the engagement was assigned to a duplicate mentor record with
      the same name. Check the link first.
    later: unchanged
    status: done-for-real
    source: 5-Methods-Form-Accounts-Checks.md#17.5

  - id: "17.6"
    name: Confirm the submission closes
    why: A submission that never reaches Completed means the background worker is not delivering to the CRM.
    who: central, signed in as the Marketing Admin Team test user
    first: ["17.3"]
    needs: [test_submission]
    produces: []
    mode: automated
    actions:
      - do: In a new private browser window, sign in at APP-ADDRESS/ as SHORT-LABEL.test.marketing and open Submission Admin at APP-ADDRESS/ops/.
      - do: Find the submission by the reference number from step 17.3.
        see:
          - "Intake status: Completed"
          - "Response status: Closed"
          - "Close reason: Process completed"
    done_when: >-
      The submission shows as completed and closed to the user who handles
      submissions.
    check:
      how: The submission reads Completed and Closed.
      probe: The app reads the submission's status as the test user.
    if_not: >-
      A submission stuck at Received means the background worker is not running or
      cannot reach the CRM. Open APP-ADDRESS/healthz and read the worker section:
      a heartbeat older than 180 seconds means the worker is not running.
    goes_wrong: nothing known yet
    later: unchanged
    status: done-for-real
    source: 5-Methods-Form-Accounts-Checks.md#17.6

  - id: "17.7"
    name: Confirm the CRM's own screen works for an ordinary user
    why: Staff also use the CRM directly, and a missing screen file shows an ordinary user a blank page.
    who: central
    first: ["17.1"]
    needs: [test_users, crm_base_url]
    produces: []
    mode: guided
    actions:
      - do: In a new private browser window, open CRM-ADDRESS and sign in as SHORT-LABEL.test.clientadmin.
        see: The CRM's home screen, with the navigation bar across the top.
    done_when: >-
      A non-administrator signs in to the CRM itself and sees a working screen.
    check:
      how: The home screen and navigation bar appear.
      probe: The app can load the CRM's screen code as a test user and confirm it answers, but a person should look once.
    goes_wrong: >-
      A blank page. The CRM's screen code folder was not copied (step 9.6). The trial
      chapter hit exactly this.
    later: The conformance check loads the CRM's screen as an ordinary user.
    status: done-for-real — after the fix.
    source: 5-Methods-Form-Accounts-Checks.md#17.7

  - id: "17.8"
    name: Confirm the website pages work for a member of the public
    why: The public pages are what clients and volunteers see first, on computers and on phones.
    who: chapter
    first: ["13.2"]
    needs: [website_base_url]
    produces: []
    mode: guided
    actions:
      - do: On a computer, open a private browser window, go to the chapter's website address, and follow its link to the events programme.
        see: The page at APP-ADDRESS/webinars/, with the chapter's name, menu and events.
      - do: Open one event from the calendar.
        see: The event's own page, with its title, date and a sign-up form.
      - do: "The mentor directory: skip it. The public mentor directory page is not built yet (step 13.1). Write \"not built\" beside it."
      - do: Repeat the two events checks on a phone.
        see: One column, no sideways scrolling, no text cut off.
    done_when: >-
      Someone not signed in to anything opens the mentor directory and events pages
      on the chapter's website and they work.
    check:
      how: Each page shows the chapter's own content and name, on a computer and a phone.
      probe: The app can request each public page and check it answers with the chapter's name, but the look of the page needs a person.
    goes_wrong: >-
      A page with no styling at all, when the page and its stylesheet disagree.
      Cleveland shipped exactly this for an hour. Also, the public mentor directory
      page is not built yet (step 13.1).
    later: unchanged
    status: not-yet-tried — the trial chapter had no website.
    source: 5-Methods-Form-Accounts-Checks.md#17.8

  - id: "17.9"
    name: Remove the test records
    why: Test records left behind turn up in the chapter's reports and lists.
    who: central
    first: ["17.2", "17.3", "17.4", "17.5", "17.6", "17.7", "17.8"]
    needs: [test_submission, test_users]
    produces: []
    mode: automated
    actions:
      - do: "Sign in to CRM-ADDRESS as the central support organization's administrator and delete these records, in this order:"
        items:
          - "The engagement for Test Bakery DELETE-ME"
          - "The client profile for Test Bakery DELETE-ME"
          - "The contact Test Applicant DELETE-ME"
          - "The company Test Bakery DELETE-ME"
      - do: Leave the submission in Submission Admin, closed. It is the record that the path worked.
      - do: "In the CRM, open Administration, then Users, and set each of the seven test users to inactive, so the check can be repeated after a later release:"
        items:
          - SHORT-LABEL.test.clientadmin
          - SHORT-LABEL.test.mentoradmin
          - The Mentor Team test user
          - SHORT-LABEL.test.partner
          - SHORT-LABEL.test.funder
          - SHORT-LABEL.test.marketing
          - SHORT-LABEL.test.analytics
      - do: In Mentor Administration, set Test Mentor SHORT-LABEL's status to Inactive.
      - do: If step 17.1 created a Google mailbox for the test mentor, delete it in admin.google.com, so it stops taking a licence.
      - do: "Write in the chapter's handover notes: the date, the four records deleted, and the seven users set inactive."
    done_when:
      - "The test submissions created for this stage are gone or disabled."
      - "The test assignments created for this stage are gone or disabled."
      - "The test users created for this stage are gone or disabled."
      - "It is written down what was removed."
    check:
      how: A CRM search for DELETE-ME finds nothing, and each of the seven test users is refused at sign-in.
      probe: The app searches for the made-up names and confirms the test users are inactive.
    goes_wrong: >-
      A test record left behind turns up in the chapter's reports. The analytics
      pages count every engagement.
    later: The onboarding app removes its own standard test data.
    status: not-yet-tried — the trial chapter's test records were kept on purpose.
    source: 5-Methods-Form-Accounts-Checks.md#17.9

changes:
  - version: "0.5"
    date: "09-23-26 20:40"
    change: >-
      References to stage 9 follow its renumbering from twenty steps to nine
      (stage 9 version 0.11).
  - version: "0.4"
    date: "09-23-26 14:27"
    change: >-
      The placeholder CHAPTER-SLUG (and SLUG) is now SHORT-LABEL, the form's own name for it (Doug, 09-23-26: slug is a terrible name for a user). The guide's index lists every shared placeholder.
  - version: "0.3"
    date: "09-23-26 00:55"
    change: >-
      Three corrections from the review before the first real chapter. Step 17.1 sets the test mentor to accepting new clients, without which the Assign list in step 17.4 is empty, and step 17.9 deletes any Google mailbox that created. Step 17.2 no longer points at a record whose settings-page answer the next action calls wrong. Step 17.3 no longer waits on stage 13: the website link is checked once it exists, and the rest of the form check runs without it.
  - version: "0.2"
    date: "09-19-26 00:04"
    change: >-
      Actions made precise (Doug, 09-19-26): exact test user names and teams, the
      twelve session-check addresses and the expected result per test user from the
      August table, exact made-up values for the test application, the pages and
      statuses to look for at each step, and the records and users to remove. The
      exact labels of the CRM's user screens are not verified, and the steps say so.
  - version: "0.1"
    date: "09-18-26 17:20"
    change: >-
      First version as data, converted from the methods for checking everything
      works before going live (5-Methods-Form-Accounts-Checks.md, version 0.4) with
      the step list's finishing tests.
