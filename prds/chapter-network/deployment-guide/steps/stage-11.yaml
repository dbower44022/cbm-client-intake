stage: 11
name: Deploy the chapter's applications
version: "0.9"
updated: "09-23-26 20:40"
why: >-
  The applications are what the chapter's staff, mentors and the public actually
  use: the intake forms, the staff tools and the public events page. This stage
  deploys them into the chapter's own hosting account, connects them to the
  chapter's CRM and Google account, and sets them to take each weekly release by
  themselves. It ends by proving each Google connection works, one at a time.
who: >-
  The central support organization, inside the chapter's hosting account.
time: >-
  About an hour for the deployment itself; the August build was active on the
  first attempt in seven minutes. The Google checks at the end are not timed yet.
before_you_start:
  - The chapter information form, complete and reviewed (stage 8)
  - The CRM, built and matching the standard, with the applications' key in the vault (stage 9)
  - The Google permissions and the Google key (stage 10)
  - The chapter's domain names in its Cloudflare account, or at its own DNS provider with manual DNS (step 3.7)
  - The chapter's hosting account linked to the code repository on GitHub (step 5.9)
unlocks: >-
  Backups and monitoring can be set up (stage 12), and the chapter's website
  pages can be connected (stage 13).
steps:
  - id: "11.1"
    name: Generate the session secret
    why: The session secret protects every sign-in to the applications, so each chapter has its own.
    who: central
    first: ["2.7"]
    needs: []
    produces: [SESSION_SECRET]
    mode: automated
    actions:
      - do: Nothing to run by hand. The settings generator in step 11.2 creates the session secret the first time it runs, as a random value of 48 bytes, and appends it to the chapter's settings file (CHAPTER-ENV-FILE, which is ~/.config/cbm-SHORT-LABEL/SHORT-LABEL.env).
      - do: After step 11.2, open CHAPTER-ENV-FILE in a text editor, copy the value after SESSION_SECRET= into a new item in the chapter's Operations vault named Session secret, and save.
        see: The Session secret item in the Operations vault.
    done_when: >-
      A new random session secret has been generated for this chapter alone and
      stored in the secrets store. It is never copied from another chapter.
    check:
      how: The value is in the vault and differs from every other chapter's.
      probe: The app compares a fingerprint of the value with every other chapter's.
    goes_wrong: Copying another chapter's.
    later: Created directly in the vault.
    status: done-for-real
    source: 3-Methods-CRM-Google-Applications.md#11.1

  - id: "11.2"
    name: Generate the deployment settings
    why: The deployment settings are what the hosting platform builds the applications from, and every value must come from the reviewed form, not from memory.
    who: central
    first: ["8.9", "9.7"]
    needs: [GOOGLE_SERVICE_ACCOUNT_JSON, chapter_name, chapter_slug, timezone, app_base_url, website_base_url, events_public_base_url, docs_site_url, policy_client_conduct_url, policy_mentor_ethics_url, policy_terms_url, policy_privacy_url, chapter_tokens_url, primary_domain, ops_mailbox, alert_email_from, alert_email_to, members_group, shared_drive_id, zoom_host_email, crm_base_url, flags, ZOOM_CLIENT_SECRET, zoom_account_id, zoom_client_id, mentor_email_domain]
    produces: [APP_ENCRYPTION_KEY]
    mode: automated
    actions:
      - do: "Before running it, check CHAPTER-ENV-FILE already holds these three lines, written by the script in step 9.7:"
        items:
          - "ESPO_API_KEY="
          - "ESPO_PROVISION_USERNAME="
          - "ESPO_PROVISION_PASSWORD="
      - do: "Download the Google machine account key from the chapter's Operations vault (step 10.2) and save it as ~/.config/cbm-SHORT-LABEL/google-key.json. Then add this line to the end of CHAPTER-ENV-FILE. The file is named rather than pasted because the key runs over several lines, which would break the build commands that read CHAPTER-ENV-FILE:"
        items:
          - "GOOGLE_SERVICE_ACCOUNT_KEY_FILE=~/.config/cbm-SHORT-LABEL/google-key.json"
      - do: "Check the form's flags section names every switch deliberately, as true or false. The Google switches (gmail_sync, gcal_events, gdrive_docs, google_directory_check, google_create_mailbox) go into the deployment from here, not from the settings page: the background worker decides at start-up whether to read the mailbox, and a switch set later at /setup never reaches it. Set gdrive_identity to service, and set deploy_on_push to true so the application follows the release branch from its first build."
      - do: "In a terminal, in the folder ~/Dropbox/Projects/cbm-client-intake, type the line below and press Enter. CHAPTER-VALUES-FILE is the filled-in chapter information form saved as YAML (the trial chapter's is prds/chapter-network/rehearsal-2026-08-31/lakeside-values.yaml):"
        items:
          - "uv run python scripts/rehearsal/render_spec.py CHAPTER-VALUES-FILE ~/.config/cbm-SHORT-LABEL/SHORT-LABEL.env ~/.config/cbm-SHORT-LABEL/SHORT-LABEL-app.yaml"
        see: "A line reading: wrote ~/.config/cbm-SHORT-LABEL/SHORT-LABEL-app.yaml following branch release with N shared + N web-only env vars. If it reads secrets not yet minted, step 9.7 has not run. If it names GOOGLE_SERVICE_ACCOUNT_KEY_FILE or shared_drive_id, a Google switch is on before stage 10 has produced what it needs."
      - do: "Open SHORT-LABEL-app.yaml and check three things. The generator sets them itself; this is a check, not an edit:"
        items:
          - "There is no ENV_LABEL line."
          - "ALLOWED_ORIGINS is https://APP-ADDRESS, or absent if the application address is not known yet."
          - "Every branch line reads branch: release (the web part, the worker and the migrate job)."
          - "No value names Cleveland or cbmentors.org. The chapter's own website, mentor email domain and mailbox addresses appear instead."
      - do: "Open CHAPTER-ENV-FILE and copy the value after APP_ENCRYPTION_KEY= into a new item in the chapter's Operations vault named Stored-data encryption key. This value must never change."
        see: The Stored-data encryption key item in the Operations vault.
      - do: Never commit SHORT-LABEL-app.yaml anywhere. It holds secrets in plain text. It is deleted in step 11.3.
    done_when: >-
      The settings are produced from the chapter information form and every value
      in them traces back to a line on that form.
    check:
      how: Every value in the settings file matches a line on the form.
      probe: The app builds the settings from the form itself, so there is nothing to trace.
    if_not: The generator refuses to run when the CRM key or the administrator credentials are missing. Fetch them from the vault and run it again.
    goes_wrong: >-
      The stored-data encryption key. The generator creates it quietly on first run,
      and changing it later destroys the data it protects, so it is permanent from
      the moment it exists. Also, the trial script asks for a development database,
      which takes no backups (see step 11.4). A form field written as "none yet" is
      left out of the settings, so the software's own default applies until the
      field is filled in and the settings are generated again.
    later: The settings generator (work list item 16) reads the form and the vault and writes no file.
    status: done-for-real — with the trial script, not a finished generator.
    source: 3-Methods-CRM-Google-Applications.md#11.2

  - id: "11.3"
    name: Load the secrets
    why: The applications need their secrets at start-up, and a secret left readable in a file is a secret leaked.
    who: central
    first: ["11.2"]
    needs: [ESPO_API_KEY, ESPO_PROVISION_USERNAME, ESPO_PROVISION_PASSWORD, SESSION_SECRET, APP_ENCRYPTION_KEY, GOOGLE_SERVICE_ACCOUNT_JSON]
    produces: []
    mode: automated
    actions:
      - do: Nothing to run. The settings file from step 11.2 carries every secret into the deployment when step 11.5 creates the application. The database connection is supplied by the hosting platform and never appears in the file.
      - do: "After step 11.5 has succeeded, type the line below and press Enter, to delete the settings file:"
        items:
          - "rm ~/.config/cbm-SHORT-LABEL/SHORT-LABEL-app.yaml ~/.config/cbm-SHORT-LABEL/google-key.json"
        see: The prompt again, with no message.
      - do: Check every secret in CHAPTER-ENV-FILE also has an item in the Operations vault. Then delete CHAPTER-ENV-FILE too, once the vault holds everything.
        see: No settings file and no secrets file left on the computer.
    done_when:
      - "Every secret is loaded into the deployment, including the Google key."
      - "The session secret is loaded."
      - "The stored-data encryption key is loaded."
      - "None of them appears in a file anyone can read."
    note: "The database connection is not among them — the hosting platform supplies that to the application directly."
    check:
      how: The application starts, and no settings file with secrets is left on any computer.
      probe: The app reads the deployment's settings list and confirms each secret is present and encrypted.
    goes_wrong: >-
      The settings file with plain-text secrets left on a laptop or committed.
      Getting the settings back from the platform afterwards does not help: the
      platform hands the secrets back scrambled into an unreadable form.
    later: >-
      The settings generator reads each secret from the chapter's Proton Pass
      Operations vault with Proton Pass's command-line tool and hands it to the
      hosting platform without writing a file.
    status: done-for-real — and this is the weakest point in the stage.
    source: 3-Methods-CRM-Google-Applications.md#11.3

  - id: "11.4"
    name: Create the database
    why: Every submission is saved in the application's database before it reaches the CRM, so the database must exist and take backups.
    who: central
    first: ["5.1"]
    needs: [chapter_slug]
    produces: [DATABASE_URL]
    mode: automated
    actions:
      - do: Nothing to run. Step 11.5 creates the database with the application, named SHORT-LABEL-db.
      - do: "Straight after step 11.5, sign in to the chapter's hosting account at cloud.digitalocean.com and open Apps, then SHORT-LABEL-intake, then Settings, then the component SHORT-LABEL-db. The path is the one Cleveland used on 23 July 2026 (DEPLOYMENT.md)."
        see: Either a managed database, or a development database with an option to convert it.
      - do: "If it is a development database, choose Database Type and Scale, then Convert to a Managed Database, and choose:"
        items:
          - "Plan: the smallest node size (db-s-1vcpu-1gb)"
          - "Nodes: 1"
          - "Standby node: none"
        see: The conversion completing and the application redeploying by itself, with no downtime. The connection details do not change.
    done_when:
      - "The database exists in the chapter's hosting account."
      - "Its connection details are supplied to the application by the hosting platform, and no person holds them."
      - "The application can reach it."
    check:
      how: The application connects, and the hosting account shows a managed database.
      probe: The app reads the database type from the hosting account and refuses a development database.
    goes_wrong: >-
      Leaving it as a development database. Nothing reports an error, and there are
      no backups. The trial chapter's database is in this state. Also, the hosting
      platform adds an instruction to the connection details that the application's
      database library rejects; the software strips it, so it only looks broken.
    later: The settings generator asks for a managed database from the start.
    status: done-for-real — as a development database. A managed database is not yet tried on a chapter.
    source: 3-Methods-CRM-Google-Applications.md#11.4

  - id: "11.5"
    name: Create the application parts
    why: The applications run as three parts, and the background worker is the one that sends mail and finishes unfinished work.
    who: central
    first: ["11.2", "11.3", "5.9"]
    needs: [digitalocean_token, DATABASE_URL, repository_link]
    produces: [app_id]
    mode: automated
    actions:
      - do: "If this computer has never been signed in to the chapter's hosting account, type the line below and press Enter, then paste the chapter's DigitalOcean token from the Operations vault when asked:"
        items:
          - "doctl auth init --context SHORT-LABEL"
        see: A message that the token was validated.
      - do: "Type the line below and press Enter, so every following doctl command acts on the chapter's account and not Cleveland's:"
        items:
          - "doctl auth switch --context SHORT-LABEL"
      - do: "Type the line below and press Enter:"
        items:
          - "doctl apps create --spec ~/.config/cbm-SHORT-LABEL/SHORT-LABEL-app.yaml"
        see: A table with the new application's ID and the name SHORT-LABEL-intake. Copy the ID into the Operations vault as a note named Application ID; later steps call it APP-ID.
      - do: "Type the line below and press Enter:"
        items:
          - "doctl apps get APP-ID"
        see: The application listed. In the hosting account's web page, its Components show web, delivery-worker and migrate.
    done_when: >-
      The web part, the background worker part and the setup job all exist.
    check:
      how: All three parts appear in the hosting account.
      probe: The app reads the application's parts through the chapter's token.
    goes_wrong: >-
      Creating only the web part. Without the background worker the system looks
      fine and quietly does nothing.
    later: unchanged for now
    status: done-for-real — active on the first attempt, in seven minutes.
    source: 3-Methods-CRM-Google-Applications.md#11.5

  - id: "11.6"
    name: Run the database setup
    why: The application cannot start until its database has the tables it expects.
    who: central
    first: ["11.5"]
    needs: []
    produces: []
    mode: automated
    actions:
      - do: Nothing to run. The migrate job runs by itself before the application starts.
      - do: "Type the line below and press Enter:"
        items:
          - "doctl apps list-deployments APP-ID"
        see: The first deployment in the list with its phase ACTIVE. A phase of ERROR means the migrate job or the build failed; open the deployment in the hosting account's web page and read its log.
    done_when: >-
      The setup job has completed and the database holds the expected tables.
    check:
      how: The deployment log shows the setup job succeeded.
      probe: The app reads the deployment's status for the setup job.
    goes_wrong: nothing known yet
    later: unchanged
    status: done-for-real
    source: 3-Methods-CRM-Google-Applications.md#11.6

  - id: "11.7"
    name: Deploy the released version
    why: Every chapter runs the same named release, so a support question never starts with "which version are you on".
    who: central
    first: ["11.6"]
    needs: []
    produces: []
    mode: automated
    actions:
      - do: "Open https://APP-ADDRESS/healthz in a browser. Until step 11.10, use the address DigitalOcean gave the application, shown by doctl apps get APP-ID under Default Ingress."
        see:
          - "status: ok"
          - "version: the current release's number, the one the release branch holds today"
          - "releaseTag: the same release with a v in front. The application follows the release branch from its first build, so it reads the tag straight away. A null here means the release branch's latest commit is not a cut release."
    done_when: >-
      The application is running the version the release schedule names, and it
      reports that version when asked.
    check:
      how: /healthz shows releaseTag equal to the current release.
      probe: The app reads /healthz and compares releaseTag with the latest release.
    goes_wrong: >-
      releaseTag reads null. That means the application follows the development
      branch rather than the release branch. It is the honest answer, not a fault.
    later: unchanged
    status: done-for-real — twice, in August and in September.
    source: 3-Methods-CRM-Google-Applications.md#11.7

  - id: "11.8"
    name: Set the update policy to Latest Stable
    why: Latest Stable makes the application take each weekly release by itself, so no chapter falls behind.
    who: central
    first: ["11.7"]
    needs: [app_id]
    produces: []
    mode: automated
    actions:
      - do: "In the folder ~/Dropbox/Projects/cbm-client-intake, with doctl switched to the chapter's account (step 11.5), type the line below and press Enter. It changes nothing:"
        items:
          - "uv run python scripts/set_updates_policy.py APP-ID latest-stable"
        see: The change it would make to each of the three parts.
      - do: "Type the line below and press Enter. The deploy option starts a fresh deployment; without it the application rebuilds the same commit it already runs:"
        items:
          - "uv run python scripts/set_updates_policy.py APP-ID latest-stable --apply --deploy"
        see: The spec updated and a new deployment started.
      - do: "Type the line below and press Enter:"
        items:
          - "uv run python scripts/set_updates_policy.py APP-ID latest-stable --status"
        see: "One line per part, each showing branch=release and deploy_on_push=True, and a final line reading conformant with 'latest-stable'."
    done_when: >-
      All three parts of the application follow the release branch and the policy
      script reads all three back in agreement. An application has three parts,
      each with its own setting, and setting one without the others half-updates it
      with no warning from the platform.
    check:
      how: The status option reports all three parts in agreement.
      probe: The app runs the status check and shows the result.
    goes_wrong: >-
      Setting one part and not the others. Nothing on the platform tells you that
      you have half-updated it.
    later: A button in the fleet console.
    status: done-for-real
    source: 3-Methods-CRM-Google-Applications.md#11.8

  - id: "11.9"
    name: Confirm the application does not follow the development branch
    why: The development branch delivers untested software, and no chapter's live system may take it.
    who: central
    first: ["11.8"]
    needs: [app_id]
    produces: []
    mode: automated
    actions:
      - do: "Type the line below and press Enter:"
        items:
          - "uv run python scripts/set_updates_policy.py APP-ID latest-stable --status"
        see: "Every part showing branch=release, none showing branch=main, and the line conformant with 'latest-stable'."
    done_when:
      - "No part of the deployment follows the main development branch."
    note: "This replaces what the earlier planning documents said. Those documents require automatic deployment to be switched off on a chapter's application, which was right when the release version travelled inside each deployment's settings. The version is now stamped into the software itself when a release is cut, so an application following the release branch with automatic deployment on updates itself correctly. The danger was never automatic deployment — it is automatic deployment from the development branch, which delivers untested software straight to a chapter's live system."
    check:
      how: All three parts name the release branch.
      probe: The app reads the branch of every part of every chapter's application and flags any on main.
    goes_wrong: nothing known yet
    later: The fleet view reports any deployment following the wrong branch.
    status: done-for-real
    source: 3-Methods-CRM-Google-Applications.md#11.9

  - id: "11.10"
    name: Point the application's web address at the application
    why: People reach the applications by the chapter's own address, not the hosting platform's.
    who: central
    first: ["3.7", "11.5"]
    needs: [app_base_url, cloudflare_token]
    produces: []
    mode: automated
    actions:
      - do: "Type the line below and press Enter, and copy the address shown under Default Ingress (it ends .ondigitalocean.app):"
        items:
          - "doctl apps get APP-ID"
      - do: "In the chapter's Cloudflare account, open the domain, then DNS, then Records, and choose Add record. Enter exactly:"
        items:
          - "Type: CNAME"
          - "Name: the first part of the application's address, for example apps"
          - "Target: the Default Ingress address, without https://"
          - "Proxy status: DNS only (grey cloud)"
          - "TTL: Auto"
        see: The record listed with a grey cloud.
      - do: "With manual DNS (step 3.7), add the same CNAME record in the chapter's DNS provider account instead, with any proxy or forwarding off. Its screens differ by provider and are not given here; the Name and Target are the same."
      - do: "In the hosting account, open Apps, then SHORT-LABEL-intake, then Settings, then Domains, and add APP-ADDRESS. Choose to manage DNS yourself and make it the primary domain. Labels are not checked on screen for this guide."
        see: The domain listed, moving to Active once the certificate is issued.
    done_when: >-
      The domain name record for the application address resolves to it.
    check:
      how: A name lookup on the application's address returns the hosting platform's address for it.
      probe: The app looks up the address and compares it with the application's platform address.
    goes_wrong: >-
      The proxy switched on, an orange cloud. The hosting platform then cannot issue
      or renew the certificate. Also, straight after the record is created, some
      resolvers keep an earlier "no such address" answer for a while; wait rather
      than changing the record.
    later: unchanged
    status: not-yet-tried — the August build used the platform's own address. Cleveland's apps. address is set up exactly this way.
    source: 3-Methods-CRM-Google-Applications.md#11.10

  - id: "11.11"
    name: Publish the application at its own web address
    why: A secure connection protects every sign-in and every form submission.
    who: central
    first: ["11.10"]
    needs: [app_base_url]
    produces: []
    mode: automated
    actions:
      - do: Nothing to do. The hosting platform issues the certificate and renews it by itself.
      - do: Open https://APP-ADDRESS in a private browser window.
        see: The applications' sign-in page, with no certificate warning.
    done_when: >-
      The application loads at its address over a secure connection, and the
      security certificate is set to renew by itself.
    check:
      how: The page loads with no warning.
      probe: The app reads the certificate's expiry date and warns under thirty days.
    goes_wrong: nothing known yet
    later: unchanged
    status: not-yet-tried
    source: 3-Methods-CRM-Google-Applications.md#11.11

  - id: "11.12"
    name: Confirm the application is healthy
    why: The health address is the one place that shows, at a glance, that the application runs, knows whose it is, and has a working background worker.
    who: central
    first: ["11.7"]
    needs: [app_base_url, chapter_name]
    produces: []
    mode: automated
    actions:
      - do: "Open https://APP-ADDRESS/healthz in a browser and read these fields:"
        items:
          - "status: ok"
          - "organization: the chapter's own name, not Cleveland's"
          - "releaseTag: the current release"
          - "database: ok"
          - "worker, then lastHeartbeatAgeSeconds: under 180"
        see: All five as listed.
      - do: Read the crmConfig block's state field.
        see:
          - "stamped or unstamped: both are fine"
          - "absent, forbidden or unreachable: each is a problem to report"
    done_when:
      - "The application's health address reports it is running."
      - "The health address names the chapter correctly."
      - "The health address shows the background worker alive."
    check:
      how: /healthz shows the chapter's name, a live worker and a readable CRM.
      probe: The app reads /healthz for every chapter at once.
    if_not: Wait a minute and read it again before calling it a failure.
    goes_wrong: >-
      Reading it before the new software has finished starting, which shows a
      failure that is not real. And Cleveland's name where the chapter's should be,
      which means the chapter name setting was not applied.
    later: The fleet view reads it for every chapter at once.
    status: done-for-real
    source: 3-Methods-CRM-Google-Applications.md#11.12

  - id: "11.13"
    name: Confirm the application can read the CRM
    why: A permission missed in stage 9 shows up here as an empty screen rather than an error, so it is checked directly.
    who: central
    first: ["9.7", "11.12"]
    needs: [ESPO_API_KEY]
    produces: []
    mode: automated
    actions:
      - do: Open https://APP-ADDRESS and sign in with the CRM administrator account the deployment wizard created in step 9.3. Its name and password are in the Operations vault.
      - do: Open Client Administration.
        see: Records, or an empty list. Both are fine. A message that access was refused means a permission was missed in stage 9.
    done_when: >-
      A request through the application returns CRM data.
    check:
      how: The page shows records or an empty list, not a refusal.
      probe: The app makes one list request through the application.
    if_not: A refusal means a permission was missed in stage 9. Go back to step 9.7.
    goes_wrong: >-
      A page that asks for more than two hundred records at once is refused rather
      than trimmed, and inside the software that refusal reads as "there are no
      records". This once emptied every selection list on Cleveland's live system.
    later: unchanged
    status: done-for-real
    source: 3-Methods-CRM-Google-Applications.md#11.13

  - id: "11.14"
    name: Confirm incoming mail
    why: Inbound email is the first Google connection, and if it fails nothing after it will work.
    who: central
    first: ["10.3", "10.4"]
    needs: [ops_mailbox, GOOGLE_SERVICE_ACCOUNT_JSON]
    produces: []
    mode: guided
    actions:
      - do: Confirm no other deployment reads the same shared operations mailbox. Only one deployment may read a given mailbox.
      - do: "Every Google setting in steps 11.14 to 11.18 reached the application from the form in step 11.2. Sign in to https://APP-ADDRESS/setup as a CRM administrator and confirm these show the chapter's values:"
        items:
          - "GOOGLE_SERVICE_ACCOUNT_JSON: shown as set"
          - "OPS_MAILBOX: the shared operations mailbox address"
          - "COMMS_INTERNAL_DOMAINS: the chapter's email domain, and the mentors' domain when it differs"
          - "GMAIL_SYNC: true"
        see: Each value as listed. Do not change them here.
      - do: "If a value is missing or wrong, correct the form, run step 11.2 again, then type the two lines below, pressing Enter after each. The first loads the new settings; the second restarts the worker, which reads its mail switches only at start-up:"
        items:
          - "doctl apps update APP-ID --spec ~/.config/cbm-SHORT-LABEL/SHORT-LABEL-app.yaml"
          - "doctl apps create-deployment APP-ID"
        see: A new deployment reaching ACTIVE. Delete the settings file and the key file again afterwards, as in step 11.3.
      - do: In the hosting account, open Apps, then SHORT-LABEL-intake, then Runtime Logs, and choose the delivery-worker component.
        see: A line naming the mailbox the worker acts as, and it is the shared operations mailbox. If that line is absent or names another address, stop; the cause is in stage 10.
      - do: From an outside address, send a message to the shared operations mailbox.
        see: Within about five minutes, the message in Submission Admin as a new email submission.
    done_when: >-
      A message sent to the shared operations mailbox appears in the application.
    check:
      how: The log names the right mailbox and the test message appears in the application.
      probe: The app sends a test message to the mailbox and watches for it to arrive.
    if_not: If the log line is missing or names the wrong address, stop. The cause is in stage 10, not here.
    goes_wrong: >-
      Two deployments reading the same mailbox. Each takes roughly half the
      messages, and neither is obviously broken.
    later: unchanged
    status: not-yet-tried
    source: 3-Methods-CRM-Google-Applications.md#11.14

  - id: "11.15"
    name: Confirm outgoing mail
    why: Staff and mentors send email from records, and it must arrive with the chapter's own name.
    who: central
    first: ["11.14"]
    needs: [alert_email_from]
    produces: []
    mode: guided
    actions:
      - do: "At https://APP-ADDRESS/setup, confirm these show the chapter's values. If not, correct them the way step 11.14 describes:"
        items:
          - "ALERT_EMAIL_FROM: the alert sending mailbox (step 4.8)"
          - "ALERT_EMAIL_TO: the alert receiving address (step 4.9)"
      - do: Open a record in the application and send a message from it to an outside address you can read.
        see: The message arriving, with the chapter's own name as the sender.
    done_when: >-
      A message sent from a record arrives, and the sender shown is the chapter.
    check:
      how: The test message arrives with the chapter's name.
      probe: The app sends a test message to an address it can read and checks the sender.
    goes_wrong: >-
      The address the software sends warnings from must also be a real licensed
      mailbox. A group or alias is refused, and the refusal reads as though the
      machine account is not allowed at all.
    later: unchanged
    status: not-yet-tried
    source: 3-Methods-CRM-Google-Applications.md#11.15

  - id: "11.16"
    name: Confirm the calendar
    why: Mentors' sessions are put on their Google calendars, with the right people invited.
    who: central
    first: ["11.14"]
    needs: []
    produces: []
    mode: guided
    actions:
      - do: "At https://APP-ADDRESS/setup, confirm this shows true. If not, correct it the way step 11.14 describes:"
        items:
          - "GCAL_EVENTS: true"
      - do: "This check needs a mentor with a login and an assigned client, and none exists until stage 15. Create them now: the test mentor from step 17.1, then a test application and its assignment from steps 17.3 and 17.4, using the made-up values those steps give. Step 17.9 removes them."
      - do: Sign in as a mentor, open a client in Client Management, and create a session with Status Scheduled and a start time tomorrow.
        see: The meeting on the mentor's Google calendar, with the client's contacts invited and a Meet link attached.
    done_when: >-
      A meeting created through the application appears on the calendar with the
      right people invited.
    check:
      how: The meeting is on the calendar and the invitations went out.
      probe: The app creates a test event and reads it back.
    goes_wrong: >-
      The calendar permission is a separate entry in the grant from step 10.3, and
      the one most often missed, because working mail makes everything look fine.
    later: unchanged
    status: not-yet-tried
    source: 3-Methods-CRM-Google-Applications.md#11.16

  - id: "11.17"
    name: Confirm the shared drive
    why: Record documents are filed on the chapter's shared drive, so the application must be able to create folders there.
    who: central
    first: ["10.5", "11.14"]
    needs: [shared_drive_id]
    produces: []
    mode: guided
    actions:
      - do: "At https://APP-ADDRESS/setup, confirm these show the chapter's values. If not, correct them the way step 11.14 describes:"
        items:
          - "GDRIVE_SHARED_DRIVE_ID: the shared drive identifier (step 10.5)"
          - "GDRIVE_IDENTITY: service"
          - "GDRIVE_DOCS: true"
      - do: Open a client in Client Management, open its Documents tab, and upload a small test file.
        see: The file listed on the Documents tab, and a folder for that client on the shared drive holding it.
    done_when: >-
      The application creates a folder on the shared drive and it appears.
    check:
      how: The folder is on the shared drive.
      probe: The app creates and removes a test folder as the service account.
    goes_wrong: >-
      The service account is not a member of the shared drive, or the drive's
      identifier on the form is wrong. Both give silence, not an error.
    later: unchanged
    status: not-yet-tried
    source: 3-Methods-CRM-Google-Applications.md#11.17

  - id: "11.18"
    name: Confirm a new mentor gets a mailbox
    why: This last check exercises the most — the directory permissions, the mentor email domain and the approval process — and it is what each new mentor will depend on.
    who: central
    first: ["10.3", "11.14"]
    needs: [primary_domain]
    produces: []
    mode: guided
    actions:
      - do: "At https://APP-ADDRESS/setup, confirm these show the chapter's values. If not, correct them the way step 11.14 describes:"
        items:
          - "MENTOR_EMAIL_DOMAIN: the domain mentors' mailboxes are made on"
          - "GOOGLE_DELEGATED_ADMIN: the chapter's Google administrator address (step 4.5). The directory calls act as this administrator."
          - "GOOGLE_MEMBERS_GROUP: the members group address (step 4.10), or empty to skip the group step"
          - "GOOGLE_DIRECTORY_CHECK: true"
          - "GOOGLE_CREATE_MAILBOX: true"
          - "MENTOR_PROVISION_USERS: true"
      - do: In Mentor Administration, create a test mentor with a first and last name no real mentor has, and set Mentor Status to Accepted-Provisional.
        see: The status window reporting the mailbox created, and a temporary password shown once. Copy it into the Operations vault.
      - do: Sign in at mail.google.com as the new mentor address, with the temporary password.
        see: The mailbox opens and asks for a new password.
      - do: Delete the test mentor's mailbox in admin.google.com, then the test mentor record and its contact in the CRM.
      - do: "Switch doctl back to the account you use for Cleveland, so the next doctl command does not act on the chapter's account. Type the line below to see the account names, then the second with the right one:"
        items:
          - "doctl auth list"
          - "doctl auth switch --context CLEVELAND-CONTEXT"
    done_when: >-
      A mentor taken through approval ends up with a real working mailbox on the
      chapter's mentor email domain.
    check:
      how: The new mailbox exists and the mentor can sign in to it.
      probe: The app asks Google's directory whether the test mentor's address now exists.
    goes_wrong: >-
      Two directory permissions are needed, reading and changing. A grant with only
      the reading one gets all the way to this step before failing. And the mentor
      email domain is a setting somebody has to fill in; a chapter whose mentor
      addresses are on a different domain from its staff addresses has to say so.
    later: unchanged
    status: not-yet-tried
    source: 3-Methods-CRM-Google-Applications.md#11.18

