stage: 18
name: Hand over and start normal support
version: "0.3"
updated: "09-23-26 13:54"
why: >-
  This stage moves the chapter from being set up to being supported, and proves the
  chapter can reach everything it owns without help. The central support
  organization holds the only administrator accounts, so asking for help has to
  work well, or chapters start asking for administrator accounts of their own.
who: >-
  The central support organization, with the chapter's officers.
time: >-
  About two hours of meetings, plus the review three months later.
before_you_start:
  - The final checks passed (stage 17)
  - The chapter's first point of contact named (step 16.5)
  - Access to the ClickUp system for the chapter's people (work list item 8)
unlocks: >-
  Normal support. The chapter is live.
steps:
  - id: "18.1"
    name: Publish how to get help
    why: The chapter needs to know where every request goes and what to expect, so nobody waits in silence.
    who: central
    first: ["2.6", "16.5"]
    needs: [first_point_of_contact]
    produces: []
    mode: guided
    actions:
      - do: "Invite the chapter's first point of contact to the ClickUp system the support team uses for requests, at their chapter email address. The address of that ClickUp space, and how a chapter's people are given access to it, are not settled yet (work list item 8). The central support organization supplies both."
        see: The first point of contact signed in to ClickUp and able to see the chapter's requests.
      - do: "Show them the three kinds of request, and how to raise each one in ClickUp:"
        items:
          - "Support request: an everyday task needing an administrator, such as adding a person, changing someone's team or resetting a password. Handled by the support team as it arrives."
          - "Defect report: something that worked and has stopped, or does the wrong thing. Include the page address, what was expected, what happened, and the version number from the page footer."
          - "New feature request: anything that would change the software. Reviewed by the central committee every two weeks."
      - do: Have them raise one test support request, titled "Test request from CHAPTER-NAME — please close", and watch it to its answer.
        see: The request acknowledged and closed by the support team.
      - do: "Send the chapter's first point of contact an email, and keep a copy, saying:"
        items:
          - "Every request goes into ClickUp."
          - "No request is treated as urgent."
          - "Everyday requests are handled as they arrive."
          - "No response time is committed."
          - "Before raising a request, a forgotten password can be reset from \"Forgot your password?\" on the sign-in page."
    done_when:
      - "The chapter has in writing how to raise a request."
      - "The chapter has in writing that no request is treated as urgent."
      - "The chapter has in writing that everyday requests are handled as they arrive."
      - "The chapter has in writing that no response time is committed (ruled 09-18-26)."
    check:
      how: The first point of contact's test request was acknowledged and closed, and the email is sent.
      probe: The app confirms the chapter's contact has access to ClickUp.
    goes_wrong: >-
      Everyday requests held for the committee. A new volunteer who waits weeks for
      an account is how a chapter starts asking for an administrator account of its
      own.
    later: unchanged — the ClickUp system is the method.
    status: not-yet-tried
    source: 11-Methods-Handover.md#18.1

  - id: "18.2"
    name: Explain how to ask for a change
    why: Every chapter runs the same software, so a change is made for everyone or not at all, and the chapter needs to know who decides.
    who: central
    first: ["18.1"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: "Say the rule in these words: \"Every chapter runs the same software. A change you ask for is made for every chapter, or it is not made. There is no third answer.\""
      - do: Show them how to raise a new feature request in ClickUp, as in step 18.1.
      - do: "Explain what happens to it:"
        items:
          - "The central committee reviews and schedules features and defects every two weeks."
          - "An accepted request goes into a weekly release (step 18.3)."
    done_when:
      - "The chapter knows where to send a request that would change the software for everyone."
      - "The chapter knows who decides."
      - "The chapter knows how often those decisions are made."
    note: "The central committee decides, every two weeks (ruled 09-18-26)."
    check:
      how: The chapter can say, without looking it up, that a change is for everyone or not at all.
      probe: none
    goes_wrong: >-
      A request that is "only for us". Granting one exception is how the rule ends.
    later: unchanged
    status: not-yet-tried
    source: 11-Methods-Handover.md#18.2

  - id: "18.3"
    name: Explain the release schedule
    why: Software changes arrive without anyone at the chapter doing anything, so they need to know when, and what to do if something looks wrong.
    who: central
    first: ["11.8"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: "Explain when: a new release is named each week at 17:00 UTC on Sunday. That is 1 p.m. Eastern in summer and 12 noon Eastern in winter. The chapter's application then takes it by itself."
      - do: Explain that every chapter moves to the same release at the same time.
      - do: "Explain what to do if something looks wrong afterwards:"
        items:
          - "Refresh the page fully: Ctrl and Shift and R on Windows, or Cmd and Shift and R on a Mac. A browser can keep an old copy of a page."
          - "If it is still wrong, raise a defect report in ClickUp (step 18.1) with the version number from the page footer."
      - do: Open any application page with the first point of contact and point to the footer.
        see: "The version number in the footer, for example v0.231.1, followed by (Production)."
      - do: "Show where the release itself is reported: open APP-ADDRESS/healthz."
        see: A line named releaseTag, with the release's name.
    done_when:
      - "The chapter knows software updates arrive automatically on a weekly schedule."
      - "The chapter knows roughly when."
      - "The chapter knows what to do if something looks wrong afterwards."
    check:
      how: The first point of contact finds the version number in the footer without help.
      probe: The app reads the chapter's health address and shows its release.
    goes_wrong: >-
      A missed weekly slot. It has happened. A late release is harmless, but a
      chapter told "every Sunday" that sees nothing change should be told why.
    later: The fleet console shows each chapter its current release and the date of the next.
    status: not-yet-tried with a chapter — the trial chapter follows Latest Stable and has updated itself on a release.
    source: 11-Methods-Handover.md#18.3

  - id: "18.4"
    name: Hand over the account and access list
    why: The chapter owns its accounts, and must know every one of them, who holds it, and how to reach it.
    who: central prepares it; the chapter keeps it
    first: ["5.7"]
    needs: [account_list]
    produces: []
    mode: guided
    actions:
      - do: "Bring the account list from step 5.7 up to date. It has one line per account, with the address to sign in at:"
        items:
          - "The domain registrar: the registrar's own sign-in address"
          - "Cloudflare: https://dash.cloudflare.com, or with manual DNS the chapter's DNS provider's sign-in address"
          - "Google Workspace: https://admin.google.com"
          - "The hosting account: https://cloud.digitalocean.com"
          - "The video meeting account, if there is one: https://zoom.us"
          - "The chapter's vault: https://pass.proton.me"
          - "The CRM's administrator accounts: CRM-ADDRESS"
          - "The documentation site, if the chapter has its own: its address"
      - do: "On each line, write:"
        items:
          - "Who holds the top-level sign-in"
          - "Who else has access"
          - "That the password and recovery codes are in the chapter's vault. Never the password itself."
      - do: Check each top-level sign-in address. None may be a volunteer's personal email address; each must be a chapter mailbox.
        see: Chapter email addresses only.
      - do: Go through the list line by line with a named chapter officer.
        see: The officer recognising every account on it.
    done_when:
      - "The chapter holds the list of every account."
      - "The list says who has the top-level sign-in."
      - "The list says who else has access."
      - "A named chapter officer can reach every one of them."
    check:
      how: The named officer reads the list and confirms every account is one they recognise.
      probe: The app compares the list with the accounts recorded in the chapter's vault.
    goes_wrong: >-
      An account whose top-level sign-in is a volunteer's personal email address.
      When that volunteer leaves, the chapter loses the account.
    later: The fleet console produces the list from what it created.
    status: not-yet-tried
    source: 11-Methods-Handover.md#18.4

  - id: "18.5"
    name: Confirm the chapter can get in without the central support organization
    why: The promise that neither side can lock the other out is only real once a chapter officer has done it.
    who: both — the chapter officer does it; the central support organization watches
    first: ["18.4"]
    needs: []
    produces: []
    mode: guided
    actions:
      - do: "With someone from the central support organization watching, the chapter officer signs in with their own sign-in, not a shared one, to each of these:"
        items:
          - "The hosting account, at https://cloud.digitalocean.com"
          - "The Google Workspace admin console, at https://admin.google.com"
          - "The domain registrar account, at the registrar's own sign-in address"
        see: Each account's home page, under the officer's own name.
      - do: "In the hosting account, the officer opens the CRM server's page and opens its web console. The exact label of the console action is not verified."
        see: A command prompt on the CRM server.
      - do: "What the officer does once inside the server, to regain the CRM without the central support organization, is not written yet (work list item 5). Until it is, record this part as blocked."
      - do: Add the date and the officer's name to the chapter's entry in the list of watched systems (step 12.5).
    done_when:
      - "A named chapter officer has demonstrated, not merely been told, that they can reach the server on their own."
      - "The officer has demonstrated the same for the hosting account."
      - "The officer has demonstrated the same for the Google Workspace account."
      - "The officer has demonstrated the same for the domain registrar account."
    note: "The agreement says neither side can lock the other out; this is the step that makes that true rather than stated."
    check:
      how: The officer has signed in to all four, and the date is recorded.
      probe: none
    if_not: Record the step as blocked on the emergency access procedure, and carry on.
    goes_wrong: >-
      Being told instead of shown. An access route nobody has used is a promise, not
      a capability.
    later: unchanged — a person does it once, by hand, with someone watching.
    status: not-yet-tried — blocked on the emergency access procedure.
    source: 11-Methods-Handover.md#18.5

  - id: "18.6"
    name: Confirm the leaving terms in practice
    why: A chapter should know exactly what it keeps if it leaves, before it ever needs to.
    who: central
    first: ["2.5"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: "Walk the chapter through the four parts of the leaving kit, and who produces each:"
        items:
          - "The CRM. Already on the chapter's own server, so nobody needs to produce it."
          - "An export of the application's own database. Produced by the central support organization. No script produces it yet (work list item 9)."
          - "The shared drive documents. Already in the chapter's own Google Workspace."
          - "A licence to the last version of the software received. Written in the agreement."
      - do: "Explain what only the application's database holds, so keeping the CRM is not keeping all the data:"
        items:
          - "The discussion notes on partner and funder records."
          - "The history of every public form submission and the replies to it."
          - "The chapter's own analytics pages."
      - do: Explain that the chapter's mail, documents and calendars are already in its own Google Workspace, so they stay with it.
    done_when: >-
      The chapter has been shown exactly what it would receive if it left, and who
      produces each part.
    check:
      how: The chapter can list the four parts of the leaving kit.
      probe: none
    goes_wrong: >-
      Forgetting the application's own database. Keeping the CRM is not keeping all
      the data.
    later: The leaving kit is produced by a script and rehearsed once on the shared training system.
    status: not-yet-tried — the leaving kit does not exist.
    source: 11-Methods-Handover.md#18.6

  - id: "18.7"
    name: Set the first review date
    why: The first months show what the guide and the support route got wrong, and a booked review makes sure someone looks.
    who: both
    first: ["18.1", "18.2", "18.3", "18.4", "18.5", "18.6"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: "Book a one-hour meeting 90 days after the chapter's go-live date, titled \"CHAPTER-NAME: first review\", and invite:"
        items:
          - "The chapter's first point of contact"
          - "The chapter officer named in step 18.4"
          - "One member of the central committee"
          - "One member of the support team"
        see: The meeting in both organizations' calendars.
      - do: "Put this agenda in the invitation:"
        items:
          - "The requests raised in ClickUp, and how they went."
          - "Any feature requests, and their answers."
          - "Whether a restore test has run since go-live."
          - "Whether the account list from step 18.4 is still right."
    done_when: >-
      A date is booked to review how the first months have gone.
    check:
      how: The meeting is in both calendars, with the agenda.
      probe: The app shows the review date on the chapter's record.
    goes_wrong: nothing known yet
    later: unchanged
    status: not-yet-tried
    source: 11-Methods-Handover.md#18.7

