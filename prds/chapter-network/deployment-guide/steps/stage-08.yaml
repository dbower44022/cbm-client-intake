stage: 8
name: Fill in the chapter information form
version: "0.2"
updated: "09-19-26 00:05"
why: >-
  The chapter information form holds the roughly thirty-five values that differ
  from one chapter to the next: its name, its addresses, its Google details, its
  feature switches and the names of its secrets. Everything after this stage is
  built from the form, so a wrong or missing value here becomes a fault in every
  later stage. In the onboarding app, this stage is the interview.
who: >-
  The chapter's setup contact and someone from the central support organization,
  together. The form uses the names the software uses, so a chapter cannot fill in
  most of it alone.
time: >-
  One to two hours, once the website, the policy documents and Google Workspace
  exist.
before_you_start:
  - The agreement is signed (step 2.6)
  - The chapter's vault exists (step 2.7)
  - Google Workspace is set up (stage 4)
  - The website is published and the four policy documents have their addresses (stages 6 and 7)
unlocks: >-
  Building the CRM (stage 9). Nothing after this stage can start until the form is
  complete, and everything after it becomes routine once it is.
steps:
  - id: "8.1"
    name: Obtain the blank form
    why: Everyone has to work from the same current form, and each part needs a named person to fill it in.
    who: both — the central support organization supplies the form; the chapter names the people
    first: ["2.6"]
    needs: []
    produces: []
    mode: automated
    actions:
      - do: Copy the block of text under "The blank form" at the end of prds/chapter-network/chapter-values.md into a new file named CHAPTER-SLUG-values.yaml, for example akron-values.yaml.
        see:
          - A chapter section
          - A web section
          - A google section
          - A zoom section
          - A crm section
          - A secrets section
          - A flags section
      - do: Send the trial chapter's filled-in form, prds/chapter-network/rehearsal-2026-08-31/lakeside-values.yaml, alongside it as a worked example.
      - do: "Add a comment line at the top of each section naming who fills it in:"
        items:
          - "chapter and web: the chapter's setup contact"
          - "google and zoom: the chapter's setup contact, checked by the central support organization"
          - "crm, secrets and flags: the central support organization"
        see: Every section with a name at its top.
    done_when: >-
      The chapter has the current blank form and knows who fills in each part.
    check:
      how: Every section of the form has a name beside it.
      probe: The app opens the interview with each section assigned to a named person.
    goes_wrong: >-
      The blank form falls behind the software. A new setting that differs by
      chapter gets added to the software but not to the form. Run the information
      check in the plan again whenever the software gains a per-chapter setting.
    later: The onboarding app asks these questions on screen and checks each answer as it is typed.
    status: done-for-real — the trial chapter's form was filled in from this blank.
    source: 5-Methods-Form-Accounts-Checks.md#8.1

  - id: "8.2"
    name: Fill in the chapter's name and identity
    why: The chapter's name appears on every page the software shows, and the short label names its servers and secrets.
    who: chapter
    first: ["1.1", "8.1"]
    needs: [chapter_name]
    produces: [chapter_slug, timezone, currency, locale]
    mode: guided
    actions:
      - do: "Fill in the chapter section, key by key:"
        items:
          - "name: the chapter's name exactly as it should appear on every page, capital letters included. Example: Lakeside Business Mentors. It becomes the setting ORGANIZATION_NAME."
          - "slug: one lower-case word with no spaces, used to name the chapter's servers and secrets. Example: lakeside."
          - "timezone: the time zone's standard name. Examples: America/New_York, America/Chicago, America/Denver, America/Phoenix."
          - "currency: USD"
          - "locale: en_US"
      - do: If the time zone is not America/New_York, add the comment "not supported yet" beside it. The software has Eastern time written into its code (work list item 17).
    done_when:
      - "The chapter name is filled in."
      - "The short label is filled in."
      - "The time zone is filled in."
      - "The currency is filled in."
      - "The language is filled in."
    check:
      how: The name matches the legal name, or the trading name the board chose, letter for letter.
      probe: The app compares the name with the legal name recorded in stage 1, and warns when the time zone is not Eastern.
    goes_wrong: >-
      The time zone. A chapter outside the Eastern United States gets wrong dates on
      birthday greetings, assignment dates and the public events page, and nothing
      reports an error.
    later: unchanged
    status: done-for-real — the trial chapter recorded Eastern time, the only honest value available.
    source: 5-Methods-Form-Accounts-Checks.md#8.2

  - id: "8.3"
    name: Fill in the web addresses
    why: The software links to the website, the events page, the help documentation and the four policy documents, and a broken link on the consent box is a legal problem.
    who: chapter, checked by the central support organization
    first: ["6.2", "6.7", "7.6", "8.1"]
    needs: [website_base_url, docs_site_url, chapter_tokens_url, policy_client_conduct_url, policy_mentor_ethics_url, policy_terms_url, policy_privacy_url]
    produces: [app_base_url, events_public_base_url]
    mode: guided
    actions:
      - do: "Fill in the web section, key by key, copying every address from a browser's address bar:"
        items:
          - "app_base_url: https://apps.CHAPTER-DOMAIN/ — the address the applications will have. It does not answer until step 11.10."
          - "website_base_url: the website's home address from step 6.2. Example: https://lakesidebusinessmentors.org"
          - "events_public_base_url: leave empty. Empty means the applications' own events page, APP-ADDRESS/webinars/, which is what every chapter now uses."
          - "docs_site_url: the answer from step 6.7."
          - "policy_client_conduct_url, policy_mentor_ethics_url, policy_terms_url and policy_privacy_url: the four addresses from stage 7, one per key."
          - "chapter_tokens_url: the colour file's address from step 6.5."
      - do: "In a terminal, run this once for each address except app_base_url, putting the address in place of ADDRESS:"
        items:
          - "curl -sI ADDRESS"
        see: A first line of HTTP/2 200 for every one.
    done_when:
      - "The application address is filled in."
      - "The website address is filled in."
      - "The events page address is left empty, so the software uses its own events page."
      - "The documentation address is filled in."
      - "The colour file address is filled in."
      - "The four policy addresses are filled in."
    check:
      how: Every address, opened in a private browser window, shows the right page.
      probe: The app requests every address and reports any that does not answer.
    goes_wrong: >-
      A policy address that does not load. The public application form links to all
      four policies from its consent box.
    later: unchanged
    status: done-for-real — with made-up addresses; the trial chapter had no website, so nothing was opened.
    source: 5-Methods-Form-Accounts-Checks.md#8.3

  - id: "8.4"
    name: Fill in the Google details
    why: Mail, calendars, documents and mentor mailboxes all run through the chapter's Google Workspace, and each needs an exact address.
    who: chapter, checked by the central support organization
    first: ["4.1", "4.7", "4.8", "4.9", "4.10", "8.1"]
    needs: [primary_domain, mentor_email_domain, ops_mailbox, alert_email_from, alert_email_to, members_group, zoom_host_email, zoom_account_id, zoom_client_id]
    produces: []
    mode: guided
    actions:
      - do: "Fill in the google section, key by key, copying each address from the Google Workspace admin console:"
        items:
          - "primary_domain: the chapter's email domain. Example: cbmentors.org is Cleveland's."
          - "ops_mailbox: the shared operations mailbox from step 4.7. Example: info@CHAPTER-DOMAIN"
          - "alert_email_from: the alert sending mailbox from step 4.8. It must be a mailbox with a licence, never a group."
          - "alert_email_to: the address that receives warnings, from step 4.9. It may be a group."
          - "members_group: the members group from step 4.10. Example: members@CHAPTER-DOMAIN"
          - "mentor_email_domain: the domain mentors' mailboxes are made on. Usually the same as primary_domain. It becomes the setting MENTOR_EMAIL_DOMAIN."
          - "shared_drive_id: leave empty for now. The shared drive is created in step 10.5, which writes its identifier here: the part of the drive's web address after /drive/folders/."
          - "zoom_host_email: the Zoom host address from step 5.5, or leave empty for a chapter with no webinars. The default is Cleveland's host, so a webinar chapter must set it."
      - do: "Fill in the zoom section from step 5.5, or leave both empty for a chapter with no webinars:"
        items:
          - "account_id: the Zoom app's account identifier."
          - "client_id: the Zoom app's client identifier."
      - do: In the Google Workspace admin console, open Users and find ops_mailbox and alert_email_from.
        see: Both listed as users with a licence. Neither is a group.
    done_when:
      - "The main domain is filled in."
      - "The shared operations mailbox is filled in."
      - "The alert sending address is filled in."
      - "The alert receiving address is filled in."
      - "The members group is filled in."
      - "The mentor email domain is filled in."
    check:
      how: Each mailbox named on the form is listed as a mailbox, with a licence, in the Google Workspace admin console.
      probe: Once the Google connection works (stage 10), the app looks up each address in the chapter's directory and confirms it is a licensed mailbox, not a group.
    goes_wrong: >-
      Writing a group where a mailbox is needed. The alert sending address and the
      shared operations mailbox must both be real licensed mailboxes. A group fails
      later, with an error that does not name the cause.
    later: unchanged
    status: not-yet-tried — the trial chapter has no Google account, so this part of its form is blank.
    source: 5-Methods-Form-Accounts-Checks.md#8.4

  - id: "8.5"
    name: Fill in the CRM details
    why: The CRM has its own name, sending name, sending address and logo, and anything it sends directly carries them.
    who: central
    first: ["6.6", "8.1"]
    needs: [crm_logo_file]
    produces: [crm_base_url, crm_application_name, crm_outbound_from_name, crm_outbound_from_address]
    mode: guided
    actions:
      - do: "Fill in the crm section, key by key:"
        items:
          - "base_url: the CRM's address, published in step 9.6. Example: https://crm.CHAPTER-DOMAIN — Cleveland's is https://crm.clevelandbusinessmentors.org"
          - "application_name: the name shown inside the CRM. Usually the chapter's name."
          - "outbound_from_name: the name on mail the CRM sends. Usually the chapter's name."
          - "outbound_from_address: a mailbox from stage 4 that the CRM sends from. Example: info@CHAPTER-DOMAIN"
          - "logo_file: the logo's file name from step 6.6. Example: lakeside-logo.png"
    done_when:
      - "The CRM address is filled in."
      - "The name shown inside the CRM is filled in."
      - "The sending name is filled in."
      - "The sending address is filled in."
      - "The logo file is filled in."
    check:
      how: The section is complete, and the sending address is a real mailbox.
      probe: The app confirms the CRM address is under the chapter's domain and that the logo file is attached.
    goes_wrong: nothing known yet
    later: unchanged
    status: done-for-real — apart from the sending address and the logo; the trial chapter had neither.
    source: 5-Methods-Form-Accounts-Checks.md#8.5

  - id: "8.6"
    name: Decide every feature switch
    why: Each switch turns a part of the software on or off, and a switch left blank gives a chapter behaviour nobody chose.
    who: both — the central support organization proposes; the chapter agrees
    first: ["8.2", "8.3", "8.4", "8.5"]
    needs: []
    produces: [flags]
    mode: guided
    actions:
      - do: "Fill in the flags section. Write true or false for each switch; never leave one blank. These are the starting values for a new chapter, which the central support organization proposes and the chapter agrees:"
        items:
          - "analytics_enabled: true"
          - "events_enabled: true"
          - "events_public_api: true once the chapter runs public events, otherwise false"
          - "gmail_sync: false until step 11.14 passes"
          - "gcal_events: false until step 11.16 passes"
          - "gdrive_docs: false until step 11.17 passes"
          - "mentor_provision_users: true"
          - "google_directory_check: false until step 11.18 passes"
          - "google_create_mailbox: false until step 11.18 passes"
          - "gdrive_identity: service (this one is a word, not true or false)"
          - "zoom_events: false until the chapter's Zoom app is working"
          - "record_quick_add: true"
          - "setup_enabled: true"
          - "async_delivery: true"
          - "espo_dry_run: false"
          - "deploy_on_push: false"
        see: Sixteen switches, none blank.
      - do: Add the comment "follows the release branch" beside deploy_on_push. The application follows the release branch, never the development branch (step 11.9).
    done_when: >-
      Each switch has been deliberately set to on or off, and the branch the
      application follows is recorded as the release branch rather than the
      development branch.
    check:
      how: No switch on the form is blank.
      probe: The app refuses to finish the interview while any switch is unanswered.
    goes_wrong: >-
      A switch in the software that the form does not list. Until 09-18-26 the blank
      form was missing five switches the trial chapter needed, and it can fall behind
      again whenever the software gains one.
    later: The onboarding app offers a standard set of switches for a new chapter, and the chapter changes only what it needs.
    status: done-for-real
    source: 5-Methods-Form-Accounts-Checks.md#8.6

  - id: "8.7"
    name: List the secrets by name
    why: Each secret needs a named holder before it exists, so that none is ever held by one person alone.
    who: central
    first: ["8.6"]
    needs: []
    produces: [secret_list]
    mode: guided
    actions:
      - do: "Fill in the secrets section with these names, exactly as written, and nothing else:"
        items:
          - "ESPO_API_KEY — the CRM key the applications use. Created in step 9.17."
          - "ESPO_PROVISION_USERNAME — the name of the administrator account that creates logins. Created in step 9.18."
          - "ESPO_PROVISION_PASSWORD — that account's password. Created in step 9.18."
          - "DATABASE_URL — the database address. Supplied by the hosting platform in step 11.4."
          - "SESSION_SECRET — created in step 11.1."
          - "APP_ENCRYPTION_KEY — the encryption key for stored data. Created in step 11.2, and never changed afterwards."
          - "GOOGLE_SERVICE_ACCOUNT_JSON — the Google key. Created in step 10.2."
      - do: For a chapter that runs public webinars, add ZOOM_CLIENT_SECRET, the Zoom app's secret from step 5.5, as an eighth.
      - do: Add a comment beside each name with its holder. Write no secret value anywhere on the form.
        see: Seven or eight names, each with a holder, and no values.
    done_when:
      - "All seven are listed by name with the holder named beside each."
      - "The video meeting app's secret is listed too, for a chapter that runs webinars."
      - "No secret value is written on the form."
    note: "Seven, not six: besides the six the planning documents name, the applications use an encryption key for stored data that the settings generator creates quietly on first run. Changing it later destroys the data it protects, so it is permanent from the moment it exists."
    check:
      how: Seven names, or eight for a webinar chapter, each with a holder, and no values.
      probe: The app checks the list against the software's own list of secret settings.
    goes_wrong: >-
      Listing six and missing the encryption key. Changing that key later makes every
      stored secret permanently unreadable.
    later: The settings generator reads the list from the chapter's vault.
    status: done-for-real — as six; the seventh was found while writing the deployment methods.
    source: 5-Methods-Form-Accounts-Checks.md#8.7

  - id: "8.8"
    name: Put the chapter's secrets into the store
    why: A secret that exists only in a file on one computer is lost when that person or that computer is.
    who: central
    first: ["8.7", "2.7"]
    needs: [secret_list]
    produces: []
    mode: guided
    actions:
      - do: Open the chapter's Operations vault in Proton Pass.
      - do: For each name on the list from step 8.7 whose step has already happened, check there is an entry titled with exactly that name, for example ESPO_API_KEY. The machine secrets are created later, in stages 9 to 11, and go straight into the vault under the same titles as each is made.
        see: An entry for every secret that exists so far, titled with its name from the list.
      - do: Ask a second named person to open each entry in their own Proton Pass.
        see: The second person can open every entry.
    done_when:
      - "All seven of the chapter's secrets are held in the chapter's Proton Pass Operations vault (step 2.7)."
      - "At least two named people can reach each one."
      - "None of them exists only in a file on one person's computer."
    check:
      how: A second named person opens each secret without help.
      probe: The app reads each secret from the vault through Proton Pass's command-line tool, by name.
    goes_wrong: >-
      Treating a file on one laptop as good enough. Regenerating the deployment
      settings from the hosting provider scrambles the passwords inside them.
      Cleveland has lost working passwords that way.
    later: The settings generator reads the list from the vault.
    status: not-yet-tried — the vault was chosen on 09-18-26; the trial chapter's secrets still sit in files on one laptop.
    source: 5-Methods-Form-Accounts-Checks.md#8.8

  - id: "8.9"
    name: Review the completed form
    why: A wrong value becomes a fault in every later stage, and a second reader catches what the first misses.
    who: both — the chapter's setup contact and someone from the central support organization
    first: ["8.2", "8.3", "8.4", "8.5", "8.6", "8.7"]
    needs: []
    produces: []
    mode: offline
    actions:
      - do: Sit down together, the chapter's setup contact and someone from the central support organization, with the form open.
      - do: Read every key and its value aloud, section by section.
      - do: "Run the curl check from step 8.3 on every address again:"
        items:
          - "curl -sI ADDRESS"
        see: A first line of HTTP/2 200 for every address except app_base_url.
      - do: Read every switch aloud with its value.
      - do: "Add two comment lines at the top of the form:"
        items:
          - "# reviewed by: NAME-ONE and NAME-TWO"
          - "# reviewed on: MM-DD-YY"
    done_when: >-
      Two people have read the whole form together in one sitting and both have
      signed it off.
    check:
      how: Both names and the date are at the top of the form.
      probe: The app records who signed off, and when.
    goes_wrong: nothing known yet
    later: unchanged — a person still signs it off.
    status: not-yet-tried — the trial chapter's form was written and used by one person.
    source: 5-Methods-Form-Accounts-Checks.md#8.9

  - id: "8.10"
    name: Store the form where the central support organization can reach it
    why: Stages 9 to 12 are built from the form, so the people building them have to be able to open it.
    who: central
    first: ["8.9"]
    needs: []
    produces: []
    mode: automated
    actions:
      - do: Check the form holds no secret value. Every line under secrets must be a name only.
      - do: "Save the form in the software's code repository at exactly this path, beside the trial chapter's form's folder: prds/chapter-network/chapters/CHAPTER-SLUG-values.yaml"
      - do: 'Commit it with the message "docs(chapter-network): CHAPTER-SLUG chapter information form", and push it.'
      - do: Ask a second person at the central support organization to open the file from the remote repository.
        see: The file opens, with both reviewers' names at the top.
    done_when: >-
      The form is in the agreed place and the central support organization has
      confirmed it can open it.
    check:
      how: A second person at the central support organization opens it.
      probe: The app stores the form itself and refuses any secret value in it.
    goes_wrong: >-
      A secret pasted into the form by mistake. The code repository is not a
      secrets store.
    later: The onboarding app holds the form.
    status: done-for-real
    source: 5-Methods-Form-Accounts-Checks.md#8.10

changes:
  - version: "0.2"
    date: "09-19-26 00:05"
    change: >-
      Every action made precise (Doug, 09-19-26): each section of the form filled key by key
      with what goes in it and an example, the sixteen switches with their starting values, the
      secret names with the step that creates each, vault entry titles, curl checks for every
      address, and the exact file path the finished form is saved at.
  - version: "0.1"
    date: "09-18-26 17:20"
    change: >-
      First version as data, converted from the methods for filling in the chapter
      information form (5-Methods-Form-Accounts-Checks.md, version 0.4) with the
      step list's finishing tests. Each form field is now produced by a named step.
