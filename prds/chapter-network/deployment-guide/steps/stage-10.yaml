stage: 10
name: Set up the Google permissions the software needs
version: "0.3"
updated: "09-23-26 14:27"
why: >-
  The applications read and send the chapter's email, keep calendars in step,
  file documents on the shared drive and create mentor mailboxes. They do all of
  it through one machine account that the chapter's own Google administrator
  allows to act on the chapter's behalf. This stage creates that account and its
  permission, before the applications are deployed, because the applications need
  its key when they start.
who: >-
  The central support organization, inside the chapter's Google account, with the
  chapter's own Google administrator at the keyboard for the permission grant.
time: >-
  Not known yet. This stage has never been done on a new chapter. Book an hour
  with the chapter's Google administrator for step 10.3.
before_you_start:
  - The chapter's Google Workspace, with its shared operations mailbox (stage 4)
  - The chapter's vault, for the key this stage creates (step 2.7)
unlocks: >-
  The applications can be deployed with their Google key (stage 11), and the
  Google checks at the end of stage 11 can run.
steps:
  - id: "10.1"
    name: Create the machine account
    why: The applications act on Google through an account made for a program, not a person, so no one person's sign-in is involved.
    who: central, inside the chapter's Google account
    first: ["4.5"]
    needs: [primary_domain]
    produces: [google_service_account_client_id]
    mode: guided
    actions:
      - do: "In a browser, go to console.cloud.google.com and sign in as the chapter's Google administrator (the account from step 4.5). Labels below are Google Cloud's wording as of 2026, not checked on screen for this guide; if one differs, use the search box at the top of the console."
      - do: "Open the project picker at the top of the page and choose New project. Enter:"
        items:
          - "Project name: SHORT-LABEL-apps"
          - "Organization: the chapter's own domain"
        see: The new project selected in the project picker.
      - do: "Open APIs and services, then Library. Search for each of these and choose Enable on each:"
        items:
          - "Admin SDK API"
          - "Gmail API"
          - "Google Calendar API"
          - "Google Drive API"
          - "Google Meet REST API (only if meeting transcripts will be switched on)"
        see: Each API shown as enabled under APIs and services, then Enabled APIs and services.
      - do: "Open IAM and admin, then Service accounts, and choose Create service account. Enter:"
        items:
          - "Service account name: SHORT-LABEL-apps"
          - "Service account ID: SHORT-LABEL-apps (filled in for you)"
          - "Roles: none. Skip the optional steps and choose Done."
        see: "The service account listed, with an email address ending @SHORT-LABEL-apps.iam.gserviceaccount.com."
      - do: Open the service account. Copy its Unique ID, a number of about twenty digits, into the chapter's Operations vault as a note named Google machine account client ID. Step 10.3 needs it.
        see: The Unique ID on the service account's details page.
    done_when: >-
      The account the software will use exists in the chapter's Google account.
    check:
      how: The service account appears in the project with a client identifier.
      probe: none
    goes_wrong: nothing known yet
    later: unchanged
    status: not-yet-tried — ruled 09-15-26 that the Google stage will not be rehearsed; the first real chapter is the rehearsal.
    source: 3-Methods-CRM-Google-Applications.md#10.1

  - id: "10.2"
    name: Download and store its key
    why: The key file is the whole of the chapter's Google access in one file, so it goes straight into the vault and nowhere else.
    who: central
    first: ["10.1", "2.7"]
    needs: []
    produces: [GOOGLE_SERVICE_ACCOUNT_JSON]
    mode: guided
    actions:
      - do: "In the same service account, open the Keys tab, choose Add key, then Create new key. Choose:"
        items:
          - "Key type: JSON"
        see: One file ending .json downloaded to the computer.
      - do: "If Google refuses to create the key, the organization has the policy that blocks service account keys switched on. That is the default for Google Cloud organizations created since 2024. The chapter's Google administrator must allow keys for this one project: open IAM and admin, then Organization policies, find Disable service account key creation, and override it for project SHORT-LABEL-apps only. Then create the key again."
      - do: In Proton Pass, open the chapter's Operations vault and add a new item named Google machine account key. Attach the downloaded .json file to it.
        see: The item in the Operations vault with the file attached, and a second named person able to open it.
      - do: Delete the downloaded .json file from the computer, and empty the computer's bin.
        see: A search of the downloads folder for .json finds nothing.
    done_when: >-
      The key file is stored as a secret and is not left on anyone's laptop or in
      email.
    check:
      how: The file is in the vault, and a search of the downloads folder finds nothing.
      probe: none
    goes_wrong: >-
      The file stays in a downloads folder. It is not password-protected, and it
      gives whoever holds it the chapter's Google access.
    later: unchanged
    status: not-yet-tried
    source: 3-Methods-CRM-Google-Applications.md#10.2

  - id: "10.3"
    name: Enter the permission grant
    why: The machine account can do nothing until the chapter's Google administrator allows it, and each permission missed here fails much later with an error that names nothing useful.
    who: both — the chapter's Google administrator types; the central support organization reads out the list
    first: ["10.1"]
    needs: [google_service_account_client_id]
    produces: []
    mode: guided
    actions:
      - do: The chapter's Google administrator signs in at admin.google.com. Nobody else can do this step.
      - do: "Open Security, then Access and data control, then API controls, then Manage domain-wide delegation, and choose Add new. The menu names are Google's wording as of 2026, not checked on screen for this guide; if they differ, search the admin console for domain-wide delegation."
      - do: "In Client ID, paste the Unique ID from step 10.1 (it is in the Operations vault)."
      - do: "In OAuth scopes, paste these scopes, separated by commas with no spaces. They are exactly the scopes the software requests, read from its code (core/gmail.py, core/gcalendar.py, core/gdrive.py, core/google_directory.py, core/gmeet.py):"
        items:
          - "https://www.googleapis.com/auth/gmail.readonly"
          - "https://www.googleapis.com/auth/gmail.send"
          - "https://www.googleapis.com/auth/calendar.events"
          - "https://www.googleapis.com/auth/drive"
          - "https://www.googleapis.com/auth/admin.directory.user.readonly"
          - "https://www.googleapis.com/auth/admin.directory.user"
          - "https://www.googleapis.com/auth/admin.directory.group"
          - "https://www.googleapis.com/auth/meetings.space.created (only if meeting transcripts will be switched on)"
      - do: "The same list as one line, ready to paste (leave off the last scope if meeting transcripts will not be switched on):"
        items:
          - "https://www.googleapis.com/auth/gmail.readonly,https://www.googleapis.com/auth/gmail.send,https://www.googleapis.com/auth/calendar.events,https://www.googleapis.com/auth/drive,https://www.googleapis.com/auth/admin.directory.user.readonly,https://www.googleapis.com/auth/admin.directory.user,https://www.googleapis.com/auth/admin.directory.group,https://www.googleapis.com/auth/meetings.space.created"
      - do: Read each scope back against the list above, one at a time, aloud, before saving. Look for a space after a comma, a trailing full stop, or http instead of https; each silently breaks one scope.
        see: Every scope on the list, spelled exactly, and nothing missing.
      - do: Choose Authorize.
        see: The client ID listed on the domain-wide delegation page, with the scopes beside it.
    done_when: >-
      The grant is entered in the chapter's own Google admin console with the exact
      list of permissions, and the list has been checked item by item against the
      standard. A missing permission fails later with a message that names nothing
      useful.
    check:
      how: The grant is listed with the client identifier and every permission on the standard list.
      probe: The app tries one harmless call per permission as the service account and names any that is refused.
    if_not: If a Google check in stage 11 fails later, come back to this list first, before looking anywhere else.
    goes_wrong: >-
      A permission missed. It does not fail here. It fails later, and the error
      does not say which permission is missing. Directory access needs two
      permissions, reading and changing; a grant with only the reading one fails at
      the very last check (step 11.18).
    later: unchanged — this cannot be automated, because it happens inside the chapter's own Google account.
    status: not-yet-tried
    source: 3-Methods-CRM-Google-Applications.md#10.3

  - id: "10.4"
    name: Name the mailbox the software acts as
    why: The applications act as one mailbox when they read and send the chapter's mail, and Google refuses anything that is not a real mailbox.
    who: both
    first: ["4.7"]
    needs: [ops_mailbox]
    produces: []
    mode: guided
    actions:
      - do: "At admin.google.com, open Directory, then Users, and search for the shared operations mailbox address (for example info@CHAPTER-DOMAIN)."
        see: The address listed as a user, with a Google Workspace licence shown against it. If it is not in the users list at all, it is a group or an alias, and cannot be used.
      - do: Write the address on the chapter information form as the shared operations mailbox.
    done_when: >-
      The mailbox is named, and it is a real licensed mailbox rather than a group or
      an alias. A group or alias is refused.
    check:
      how: The address appears in the users list with a licence attached.
      probe: The app asks Google's directory whether the address is a licensed user.
    goes_wrong: >-
      A group address or a forwarding alias. Both look like email addresses and
      neither works, and the refusal names nothing useful. If the address has no
      licence, it is not a mailbox.
    later: unchanged
    status: not-yet-tried
    source: 3-Methods-CRM-Google-Applications.md#10.4

  - id: "10.5"
    name: Create the shared drive and add the machine account
    why: Every record's documents are kept on one shared drive the chapter owns, and the applications file them there as the machine account.
    who: central, inside the chapter's Google account
    first: ["10.1"]
    needs: []
    produces: [shared_drive_id]
    mode: guided
    actions:
      - do: "Sign in at drive.google.com as the chapter's Google administrator. Open Shared drives and choose New. Enter:"
        items:
          - "Name: CHAPTER-NAME Documents"
        see: The new shared drive open, and empty.
      - do: "Open the shared drive's menu, choose Manage members, and add the service account's email address from step 10.1 (ending @SHORT-LABEL-apps.iam.gserviceaccount.com). Choose:"
        items:
          - "Access: Manager (Cleveland's service account is a Manager of its shared drive, because it grants people access to folders)"
          - "Notify people: off (the service account has no mailbox)"
        see: The service account in the member list as Manager.
      - do: "Copy the shared drive's identifier from the browser's address bar: the characters after /drive/folders/ . Write it on the chapter information form as the shared drive."
        see: A string of about nineteen letters and numbers, often starting 0A.
    done_when: >-
      The shared drive exists and the machine account is a member of it.
    check:
      how: The service account appears in the drive's member list.
      probe: The app lists the shared drive as the service account.
    goes_wrong: >-
      An ordinary folder in somebody's personal drive instead of a shared drive. It
      works until that person leaves.
    later: unchanged
    status: not-yet-tried
    source: 3-Methods-CRM-Google-Applications.md#10.5

