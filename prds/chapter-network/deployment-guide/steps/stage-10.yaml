stage: 10
name: Set up the Google permissions the software needs
version: "0.4"
updated: "09-25-26 12:50"
summary: >-
  In this stage we give the applications a way to act inside the chapter's
  Google account. We create one account made for a program rather than a person,
  store its key in the chapter's vault, and have the chapter's own Google
  administrator grant that account an exact list of permissions. We also confirm
  the mailbox the applications will act as, and create the shared drive where
  every record's documents will be filed. The applications read and send the
  chapter's email, keep calendars in step, file documents and create mentor
  mailboxes, and every one of those goes through this single account. It comes
  before stage 11 because the applications need the key and the shared drive
  the moment they are deployed.
who: >-
  The central support organization, inside the chapter's Google account, with the
  chapter's own Google administrator at the keyboard for the permission grant.
time: >-
  Not known yet. This stage has never been done on a new chapter. Book an hour
  with the chapter's Google administrator for step 10.3.
before_you_start:
  - The chapter's Google Workspace, with its shared operations mailbox (stage 4)
  - The chapter's vault, for the key this stage creates (step 2.7)
unlocks: >-
  The applications can be deployed with their Google key (stage 11), and the
  Google checks at the end of stage 11 can run.
steps:
  - id: "10.1"
    name: Create the machine account
    summary: >-
      We create a Google Cloud project for the chapter and, inside it, a service
      account: an account made for a program rather than a person. The
      applications sign in to Google as this account, so nobody's personal sign-in
      is ever involved and nothing stops working when a person leaves. In the same
      project we switch on the five Google services the applications call, because
      Google refuses a call to a service that has not been switched on for the
      project. The account's Unique ID is the number the chapter's Google
      administrator will grant permission to in step 10.3.
    who: central, inside the chapter's Google account
    first: ["4.5"]
    needs: [primary_domain]
    produces: [google_service_account_client_id]
    mode: guided
    actions:
      - do: "In a browser, go to console.cloud.google.com and sign in as the chapter's Google administrator (the account from step 4.5). Labels below are Google Cloud's wording as of 2026, not checked on screen for this guide; if one differs, use the search box at the top of the console."
      - do: "Open the project picker at the top of the page and choose New project. Enter:"
        items:
          - "Project name: SHORT-LABEL-apps"
          - "Organization: the chapter's own domain"
        see: The new project selected in the project picker.
      - do: "Open APIs and services, then Library. Search for each of these and choose Enable on each:"
        items:
          - "Admin SDK API"
          - "Gmail API"
          - "Google Calendar API"
          - "Google Drive API"
          - "Google Meet REST API (only if meeting transcripts will be switched on)"
        see: Each API shown as enabled under APIs and services, then Enabled APIs and services.
      - do: "Open IAM and admin, then Service accounts, and choose Create service account. Enter:"
        items:
          - "Service account name: SHORT-LABEL-apps"
          - "Service account ID: SHORT-LABEL-apps (filled in for you)"
          - "Roles: none. Skip the optional steps and choose Done."
        see: "The service account listed, with an email address ending @SHORT-LABEL-apps.iam.gserviceaccount.com."
      - do: Open the service account. Copy its Unique ID, a number of about twenty digits, into the chapter's Operations vault as a note named Google machine account client ID. Step 10.3 needs it.
        see: The Unique ID on the service account's details page.
    done_when: >-
      The account the software will use exists in the chapter's Google account.
    check:
      how:
        - >-
          At console.cloud.google.com, with SHORT-LABEL-apps showing in the project
          picker at the top of the page, open IAM and admin, then Service accounts.
          The list shows one account named SHORT-LABEL-apps, with an email address
          ending @SHORT-LABEL-apps.iam.gserviceaccount.com and a status of Enabled.
        - >-
          Open that account. Its details page shows a Unique ID of about twenty
          digits. Open the note named Google machine account client ID in the
          chapter's Operations vault beside it and compare the two numbers digit
          by digit. They must be the same number: a wrong digit here means step
          10.3 grants permission to an account that does not exist.
        - >-
          Open APIs and services, then Enabled APIs and services. The list
          includes Admin SDK API, Gmail API, Google Calendar API and Google Drive
          API, and Google Meet REST API if meeting transcripts will be switched on.
          A service missing here is refused later with a message saying the API
          has not been used in this project or is disabled.
      probe: none
    goes_wrong: >-
      The project is created under the wrong organization, or under no
      organization at all, because the person signed in with a personal Google
      account rather than the chapter's administrator account. The project picker
      names the organization beside each project; if it does not name the chapter's
      domain, sign out, sign in as the administrator from step 4.5 and start again.
    later: unchanged
    status: not-yet-tried — ruled 09-15-26 that the Google stage will not be rehearsed; the first real chapter is the rehearsal.
    source: 3-Methods-CRM-Google-Applications.md#10.1

  - id: "10.2"
    name: Download and store its key
    summary: >-
      We create a key for the service account and put the key file in the
      chapter's vault. The key is how the applications prove to Google that they
      are this account. It is the whole of the chapter's Google access in one file,
      and anyone who holds the file can use it, so it goes into the vault and
      nowhere else, and the copy the browser downloaded is deleted straight
      afterwards. Stage 11 takes the key from the vault when the applications are
      deployed.
    who: central
    first: ["10.1", "2.7"]
    needs: []
    produces: [GOOGLE_SERVICE_ACCOUNT_JSON]
    mode: guided
    actions:
      - do: "In the same service account, open the Keys tab, choose Add key, then Create new key. Choose:"
        items:
          - "Key type: JSON"
        see: One file ending .json downloaded to the computer.
      - do: "If Google refuses to create the key, the organization has the policy that blocks service account keys switched on. That is the default for Google Cloud organizations created since 2024. The chapter's Google administrator must allow keys for this one project: open IAM and admin, then Organization policies, find Disable service account key creation, and override it for project SHORT-LABEL-apps only. Then create the key again."
      - do: In Proton Pass, open the chapter's Operations vault and add a new item named Google machine account key. Attach the downloaded .json file to it.
        see: The item in the Operations vault with the file attached, and a second named person able to open it.
      - do: Delete the downloaded .json file from the computer, and empty the computer's bin.
        see: A search of the downloads folder for .json finds nothing.
    done_when: >-
      The key file is stored as a secret and is not left on anyone's laptop or in
      email.
    check:
      how:
        - >-
          In Proton Pass, open the chapter's Operations vault. An item named Google
          machine account key is there with one attachment, a file ending .json.
          Open the attachment. It is plain text that starts with a curly bracket
          and contains a line beginning "client_email" whose value ends
          @SHORT-LABEL-apps.iam.gserviceaccount.com, and a line beginning
          "client_id" whose value is the Unique ID from step 10.1. A file naming a
          different account is the key to the wrong project.
        - >-
          A second named person at the central support organization opens the same
          item and sees the attachment. One person holding the only copy is the
          failure this vault exists to prevent.
        - >-
          On the computer that did the download, search the Downloads folder for
          .json. It finds nothing. Then open the bin: it is empty. Also check the
          browser's own downloads list, which keeps a link to the file until it is
          cleared.
        - >-
          At console.cloud.google.com, open the service account's Keys tab. Exactly
          one key is listed, dated today. If two are listed, the download was run
          twice: keep the one whose Key ID matches the "private_key_id" line in the
          file in the vault, and delete the other, so no key exists that the vault
          does not hold.
      probe: none
    goes_wrong: >-
      The file stays in a downloads folder. It is not password-protected, and it
      gives whoever holds it the chapter's Google access.
    later: unchanged
    status: not-yet-tried
    source: 3-Methods-CRM-Google-Applications.md#10.2

  - id: "10.3"
    name: Enter the permission grant
    summary: >-
      The chapter's Google administrator tells Google that the service account may
      act on behalf of the chapter's users, for an exact list of permissions
      (Google calls the mechanism domain-wide delegation). Without this grant the
      account exists but can do nothing. The list has to be exact, because a
      permission missed here does not fail here: it fails weeks later, in a message
      that does not say which permission is missing. Only the chapter's own
      administrator can enter the grant, which is why this step is booked in
      advance and why the central support organization reads the list aloud
      while the administrator types.
    who: both — the chapter's Google administrator types; the central support organization reads out the list
    first: ["10.1"]
    needs: [google_service_account_client_id]
    produces: []
    mode: guided
    actions:
      - do: The chapter's Google administrator signs in at admin.google.com. Nobody else can do this step.
      - do: "Open Security, then Access and data control, then API controls, then Manage domain-wide delegation, and choose Add new. The menu names are Google's wording as of 2026, not checked on screen for this guide; if they differ, search the admin console for domain-wide delegation."
      - do: "In Client ID, paste the Unique ID from step 10.1 (it is in the Operations vault)."
      - do: "In OAuth scopes, paste these scopes, separated by commas with no spaces. They are exactly the scopes the software requests, read from its code (core/gmail.py, core/gcalendar.py, core/gdrive.py, core/google_directory.py, core/gmeet.py):"
        items:
          - "https://www.googleapis.com/auth/gmail.readonly"
          - "https://www.googleapis.com/auth/gmail.send"
          - "https://www.googleapis.com/auth/calendar.events"
          - "https://www.googleapis.com/auth/drive"
          - "https://www.googleapis.com/auth/admin.directory.user.readonly"
          - "https://www.googleapis.com/auth/admin.directory.user"
          - "https://www.googleapis.com/auth/admin.directory.group"
          - "https://www.googleapis.com/auth/meetings.space.created (only if meeting transcripts will be switched on)"
      - do: "The same list as one line, ready to paste (leave off the last scope if meeting transcripts will not be switched on):"
        items:
          - "https://www.googleapis.com/auth/gmail.readonly,https://www.googleapis.com/auth/gmail.send,https://www.googleapis.com/auth/calendar.events,https://www.googleapis.com/auth/drive,https://www.googleapis.com/auth/admin.directory.user.readonly,https://www.googleapis.com/auth/admin.directory.user,https://www.googleapis.com/auth/admin.directory.group,https://www.googleapis.com/auth/meetings.space.created"
      - do: Read each scope back against the list above, one at a time, aloud, before saving. Look for a space after a comma, a trailing full stop, or http instead of https; each silently breaks one scope.
        see: Every scope on the list, spelled exactly, and nothing missing.
      - do: Choose Authorize.
        see: The client ID listed on the domain-wide delegation page, with the scopes beside it.
    done_when: >-
      The grant is entered in the chapter's own Google admin console with the exact
      list of permissions, and the list has been checked item by item against the
      standard. A missing permission fails later with a message that names nothing
      useful.
    check:
      how:
        - >-
          At admin.google.com, signed in as the chapter's Google administrator,
          open Security, then Access and data control, then API controls, then
          Manage domain-wide delegation. One row shows the Client ID from step
          10.1. Open the note named Google machine account client ID in the
          chapter's Operations vault beside it and compare digit by digit. A row
          for a different number is a grant to an account that does not exist.
        - >-
          Beside the Client ID, the row lists its scopes. Count them: seven, or
          eight if meeting transcripts will be switched on. Then read each one
          against the list in action 4 of this step, aloud, one at a time. Look for
          a space after a comma, a trailing full stop, or http instead of https;
          each one silently breaks that scope and nothing else.
        - >-
          Check there is only one row for this Client ID. Google keeps all of an
          account's scopes in a single row, and a second row for the same number
          does not add to the first; it conflicts with it. If there are two, edit
          the first to hold the full list and delete the second.
        - >-
          The real test is in stage 11, where steps 11.14 to 11.18 try each Google
          connection in turn. A grant takes a few minutes to take effect, and
          Google says it can take up to a day. A failure straight after
          authorizing that reads unauthorized_client is usually the wait, not a
          mistake: wait and try again before changing anything.
      probe: The app tries one harmless call per permission as the service account and names any that is refused.
    if_not: If a Google check in stage 11 fails later, come back to this list first, before looking anywhere else.
    goes_wrong: >-
      A permission missed. It does not fail here. It fails later, and the error
      does not say which permission is missing. Directory access needs two
      permissions, reading and changing; a grant with only the reading one fails at
      the very last check (step 11.18). The other known failure is a second row
      added for the same Client ID instead of editing the first: the two rows
      conflict rather than combine.
    later: unchanged — this cannot be automated, because it happens inside the chapter's own Google account.
    status: not-yet-tried
    source: 3-Methods-CRM-Google-Applications.md#10.3

  - id: "10.4"
    name: Name the mailbox the software acts as
    summary: >-
      We confirm that the shared operations mailbox from stage 4 is a real mailbox
      with its own licence, and write its address on the chapter information form.
      The applications read and send the chapter's shared mail as this mailbox, and
      Google lets the service account act only as a real licensed user. A group
      address or a forwarding alias looks the same in an address book, but Google
      refuses it, with a message that names nothing useful. This check has cost
      the project time before, so it is done here rather than discovered in stage
      11.
    who: both
    first: ["4.7"]
    needs: [ops_mailbox]
    produces: []
    mode: guided
    actions:
      - do: "At admin.google.com, open Directory, then Users, and search for the shared operations mailbox address (for example info@CHAPTER-DOMAIN)."
        see: The address listed as a user, with a Google Workspace licence shown against it. If it is not in the users list at all, it is a group or an alias, and cannot be used.
      - do: Write the address on the chapter information form as the shared operations mailbox.
    done_when: >-
      The mailbox is named, and it is a real licensed mailbox rather than a group or
      an alias. A group or alias is refused.
    check:
      how:
        - >-
          At admin.google.com, open Directory, then Users, and search for the
          address. It appears as a user with a person's or a team's name beside it.
          Open the user: the page names a Google Workspace licence against it. A
          user with no licence has no mailbox, and the applications cannot act as
          it.
        - >-
          On that user's page, find the primary email address. The address written
          on the chapter information form must be that primary address, character
          for character. An address listed further down the page as an email alias
          is not a mailbox of its own, and must not be the one on the form.
        - >-
          Open Directory, then Groups, and search for the same address. It must not
          appear there. An address that is a group appears here and not under
          Users.
        - >-
          Signing in at mail.google.com as the address, with its own password from
          step 4.7, opens an inbox. A group or an alias has no password and no inbox
          to open.
      probe: The app asks Google's directory whether the address is a licensed user.
    goes_wrong: >-
      A group address or a forwarding alias. Both look like email addresses and
      neither works, and the refusal names nothing useful. If the address has no
      licence, it is not a mailbox.
    later: unchanged
    status: not-yet-tried
    source: 3-Methods-CRM-Google-Applications.md#10.4

  - id: "10.5"
    name: Create the shared drive and add the machine account
    summary: >-
      We create the shared drive that will hold every record's documents, and add
      the service account to it as a Manager. The applications file documents
      there as the service account, and give each person access to the folders for
      their own records, which is what the Manager role allows. A shared drive
      belongs to the chapter rather than to a person, so it survives staff
      changes; a folder in someone's own drive goes with them when they leave.
      Its identifier goes on the chapter information form, and stage 11 gives it
      to the applications.
    who: central, inside the chapter's Google account
    first: ["10.1"]
    needs: []
    produces: [shared_drive_id]
    mode: guided
    actions:
      - do: "Sign in at drive.google.com as the chapter's Google administrator. Open Shared drives and choose New. Enter:"
        items:
          - "Name: CHAPTER-NAME Documents"
        see: The new shared drive open, and empty.
      - do: "Open the shared drive's menu, choose Manage members, and add the service account's email address from step 10.1 (ending @SHORT-LABEL-apps.iam.gserviceaccount.com). Choose:"
        items:
          - "Access: Manager (Cleveland's service account is a Manager of its shared drive, because it grants people access to folders)"
          - "Notify people: off (the service account has no mailbox)"
        see: The service account in the member list as Manager.
      - do: "Copy the shared drive's identifier from the browser's address bar: the characters after /drive/folders/ . Write it on the chapter information form as the shared drive."
        see: A string of about nineteen letters and numbers, often starting 0A.
    done_when: >-
      The shared drive exists and the machine account is a member of it.
    check:
      how:
        - >-
          At drive.google.com, signed in as the chapter's Google administrator,
          open Shared drives in the left-hand list. CHAPTER-NAME Documents is
          listed there, under Shared drives and not under My Drive. A drive that
          appears under My Drive is an ordinary folder, and the check has failed.
        - >-
          Open the drive, click its name at the top of the page and choose Manage
          members. The service account's address, ending
          @SHORT-LABEL-apps.iam.gserviceaccount.com, is in the list with the role
          Manager. Any other role lets the applications file documents but not
          give people access to their folders.
        - >-
          The rest of the member list is the chapter's Google administrator who
          created the drive, and nobody else. People are given access to single
          folders later, by the applications, never to the whole drive.
        - >-
          With the drive itself open (not a folder inside it), the browser's
          address bar ends /drive/folders/ followed by the identifier. The value on
          the chapter information form matches it character for character. It is
          about nineteen characters and usually begins 0A; a much longer value was
          copied from inside a folder and points at that folder, not the drive.
      probe: The app lists the shared drive as the service account.
    goes_wrong: >-
      An ordinary folder in somebody's personal drive instead of a shared drive. It
      works until that person leaves.
    later: unchanged
    status: not-yet-tried
    source: 3-Methods-CRM-Google-Applications.md#10.5

changes:
  - version: "0.4"
    date: "09-25-26 12:50"
    change: >-
      Rewritten for the reader (Doug, 09-25-26): the stage and every step open with a Summary, what is done and why in a few plain sentences, in place of the one-line Why. Every How to check is now a list of concrete checks naming where to look and what must be seen: the Unique ID compared digit by digit, the key file's own contents and the Keys tab, the single delegation row and its scope count, the primary address against the alias list, and the shared drive's place in the left-hand list and the length of its identifier. Two more known failures added: a project made under a personal account (10.1) and a second delegation row for the same Client ID (10.3).
  - version: "0.3"
    date: "09-23-26 14:27"
    change: >-
      The placeholder CHAPTER-SLUG is now SHORT-LABEL, the form's own name for it (Doug, 09-23-26: slug is a terrible name for a user). The guide's index lists every shared placeholder.
  - version: "0.2"
    date: "09-19-26 00:07"
    change: >-
      Every action made exact (Doug, 09-19-26: sweep every step): the Google Cloud project, the five APIs, the service account, the JSON key (including the organization policy that blocks keys by default), the domain-wide delegation entry with the exact scope list read from the software's code, one per line and as one pasteable line, and the shared drive with the Manager role Cleveland's own service account holds.
  - version: "0.1"
    date: "09-18-26 17:20"
    change: >-
      First version as data, converted from the methods for the Google permissions
      (3-Methods-CRM-Google-Applications.md, version 0.5) with the step list's
      finishing tests. Numbered actions, a reason per step, and a check an app can
      run were added.
